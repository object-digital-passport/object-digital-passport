/**
 * Safari / MetaMask in-app often never resolve `provider.waitForTransaction` (promise hangs).
 * Poll `getTransactionReceipt` only — same data the UI would see after reload.
 */
async function waitForTransactionReceiptReliable(tx, prov) {
  const hash = tx && tx.hash;
  const p = prov || provider || (signer && signer.provider);
  if (!hash || !p) throw new Error("waitForTransactionReceiptReliable: missing hash or provider");
  const timeoutMs = 15 * 60 * 1000;
  const deadline = Date.now() + timeoutMs;
  let lastErr;
  while (Date.now() < deadline) {
    try {
      const r = await p.getTransactionReceipt(hash);
      if (r != null) return r;
    } catch (e) {
      lastErr = e;
    }
    await new Promise((res) => setTimeout(res, 2000));
  }
  throw lastErr || new Error("Transaction confirmation timed out");
}

/**
 * Programmatic `<a download>` often fails in MetaMask in-app browser — try Web Share (Save to Files) first.
 * @param {Blob|File} blob
 * @param {string} filename
 * @param {string} [mime]
 */
async function triggerBrowserFileDownload(blob, filename, mime) {
  const mt = mime || (blob && blob.type) || "application/octet-stream";
  const file = blob instanceof File ? blob : new File([blob], filename, { type: mt });
  const url = URL.createObjectURL(file);
  const cleanup = () => {
    try {
      URL.revokeObjectURL(url);
    } catch (_) {}
  };
  try {
    if (typeof navigator !== "undefined" && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      cleanup();
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") {
      cleanup();
      return;
    }
  }
  try {
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try {
        document.body.removeChild(a);
      } catch (_a) {}
      cleanup();
    }, 4000);
    return;
  } catch (_e2) {}
  try {
    window.open(url, "_blank", "noopener,noreferrer");
    setTimeout(cleanup, 120000);
  } catch (_e3) {
    cleanup();
  }
}

function collectExtraMetaDraft() {
  var out = [];
  var metaRoot = document.getElementById("extraMetaRows");
  if (!metaRoot) return out;
  metaRoot.querySelectorAll(".extra-meta-row").forEach(function (row) {
    var kEl = row.querySelector(".extra-meta-key");
    var vEl = row.querySelector(".extra-meta-val");
    var k = kEl && kEl.value != null ? String(kEl.value).trim() : "";
    var val = vEl && vEl.value != null ? String(vEl.value).trim() : "";
    if (k || val) out.push([k, val]);
  });
  return out;
}

function buildPassportFormDraftState() {
  var fields = {};
  odpPassportDraftFieldIds().forEach(function (id) {
    var el = document.getElementById(id);
    if (el && "value" in el) fields[id] = el.value;
  });
  return {
    v: 1,
    t: Date.now(),
    objType: objType,
    sealType: sealType,
    fields: fields,
    skipUrl: !!(document.getElementById("f_skip_public_url") && document.getElementById("f_skip_public_url").checked),
    useFolder: document.getElementById("f_use_folder") ? document.getElementById("f_use_folder").checked !== false : true,
    hashes: {
      fileHashBytes32: fileHashBytes32,
      imageHash: imageHash,
      imageHash2: imageHash2,
      imageHash3: imageHash3,
      fileSize: fileSize,
    },
    names: {
      orig: selectedOriginalFile && selectedOriginalFile.name ? selectedOriginalFile.name : "",
      i1: selectedImageFile && selectedImageFile.name ? selectedImageFile.name : "",
      i2: selectedImageFile2 && selectedImageFile2.name ? selectedImageFile2.name : "",
      i3: selectedImageFile3 && selectedImageFile3.name ? selectedImageFile3.name : "",
    },
    extraMeta: collectExtraMetaDraft(),
  };
}

function migrateAnonPassportDraftIfNeeded() {
  try {
    if (!wallet || typeof sessionStorage === "undefined") return;
    var wk = odpPassportDraftStorageKey();
    if (sessionStorage.getItem(wk)) return;
    var raw = sessionStorage.getItem(ODP_PASSPORT_DRAFT_PREFIX + "anon");
    if (!raw) return;
    sessionStorage.setItem(wk, raw);
    sessionStorage.removeItem(ODP_PASSPORT_DRAFT_PREFIX + "anon");
  } catch (e) {}
}

function savePassportFormDraftSync() {
  try {
    if (typeof sessionStorage === "undefined") return;
    if (!document.getElementById("f_title")) return;
    sessionStorage.setItem(odpPassportDraftStorageKey(), JSON.stringify(buildPassportFormDraftState()));
  } catch (e) {
    console.warn("[ODP] passport draft save failed", e);
  }
}

function schedulePassportDraftSave() {
  if (odpPassportDraftTimer) clearTimeout(odpPassportDraftTimer);
  odpPassportDraftTimer = setTimeout(function () {
    odpPassportDraftTimer = null;
    savePassportFormDraftSync();
  }, 450);
}

function flushPassportDraftSave() {
  if (odpPassportDraftTimer) {
    clearTimeout(odpPassportDraftTimer);
    odpPassportDraftTimer = null;
  }
  savePassportFormDraftSync();
}

function clearPassportFormDraft() {
  try {
    if (typeof sessionStorage === "undefined") return;
    sessionStorage.removeItem(odpPassportDraftStorageKey());
    sessionStorage.removeItem(ODP_PASSPORT_DRAFT_PREFIX + "anon");
  } catch (e) {}
}

function applyPassportFormDraftState(d) {
  if (!d || d.v !== 1 || !d.fields) return false;
  try {
    if (d.objType === "physical" || d.objType === "digital" || d.objType === "mixed") setType(d.objType);
    if (typeof d.sealType === "number" && d.sealType >= 1 && d.sealType <= 3) setSeal(d.sealType);

    Object.keys(d.fields).forEach(function (id) {
      var el = document.getElementById(id);
      if (el && "value" in el) el.value = d.fields[id] != null ? String(d.fields[id]) : "";
    });

    var sk = document.getElementById("f_skip_public_url");
    if (sk) sk.checked = !!d.skipUrl;
    var uf = document.getElementById("f_use_folder");
    if (uf) uf.checked = d.useFolder !== false;

    if (d.hashes) {
      if (d.hashes.fileHashBytes32) fileHashBytes32 = d.hashes.fileHashBytes32;
      if (d.hashes.imageHash) imageHash = d.hashes.imageHash;
      if (d.hashes.imageHash2) imageHash2 = d.hashes.imageHash2;
      if (d.hashes.imageHash3) imageHash3 = d.hashes.imageHash3;
      if (d.hashes.fileSize != null) fileSize = Number(d.hashes.fileSize) || 0;
    }

    syncHostingInputs();

    if (d.extraMeta && d.extraMeta.length) {
      var wrap = document.getElementById("extraMetaRows");
      if (wrap) {
        wrap.innerHTML = "";
        d.extraMeta.forEach(function (pair) {
          addExtraMetaRow();
          var rows = wrap.querySelectorAll(".extra-meta-row");
          var row = rows[rows.length - 1];
          if (row && pair) {
            var kEl = row.querySelector(".extra-meta-key");
            var vEl = row.querySelector(".extra-meta-val");
            if (kEl) kEl.value = pair[0] != null ? String(pair[0]) : "";
            if (vEl) vEl.value = pair[1] != null ? String(pair[1]) : "";
          }
        });
      }
    }

    var names = d.names || {};
    if (fileHashBytes32 !== ZERO32 && names.orig) {
      var fd = document.getElementById("fileDrop");
      if (fd) fd.classList.add("has-file");
      var fi = document.getElementById("fileInfo");
      if (fi)
        fi.innerHTML =
          '<div class="finfo">✓ ' +
          esc(names.orig) +
          "<br>" +
          fmtSz(fileSize) +
          "<br>" +
          fileHashBytes32.slice(0, 22) +
          "…</div>";
    }
    if (imageHash !== ZERO32 && names.i1) {
      var idp = document.getElementById("imgDrop");
      if (idp) idp.classList.add("has-file");
      var ii = document.getElementById("imgInfo");
      if (ii) ii.innerHTML = '<div class="finfo">✓ ' + esc(names.i1) + "<br>" + imageHash.slice(0, 20) + "…</div>";
    }
    if (imageHash2 !== ZERO32 && names.i2) {
      var id2 = document.getElementById("imgDrop2");
      if (id2) id2.classList.add("has-file");
      var i2 = document.getElementById("imgInfo2");
      if (i2) i2.innerHTML = '<div class="finfo">✓ ' + esc(names.i2) + "<br>" + imageHash2.slice(0, 20) + "…</div>";
    }
    if (imageHash3 !== ZERO32 && names.i3) {
      var id3 = document.getElementById("imgDrop3");
      if (id3) id3.classList.add("has-file");
      var i3 = document.getElementById("imgInfo3");
      if (i3) i3.innerHTML = '<div class="finfo">✓ ' + esc(names.i3) + "<br>" + imageHash3.slice(0, 20) + "…</div>";
    }

    return true;
  } catch (e) {
    console.warn("[ODP] passport draft apply failed", e);
    return false;
  }
}

    migrateAnonPassportDraftIfNeeded();

    var d = JSON.parse(raw);

      if (first) mw.insertBefore(b, first);
      else mw.appendChild(b);

    console.warn("[ODP] passport draft load failed", e);
  }
}

function bindPassportFormDraftHooks() {
  var root = document.getElementById("passportMintWorkspace");
  if (!root || root.dataset.odpDraftBound === "1") return;
  root.dataset.odpDraftBound = "1";
  var h = function () {
    schedulePassportDraftSave();
  };
  root.addEventListener("input", h, true);
  root.addEventListener("change", h, true);
  if (!odpPassportDraftGlobalHooks) {
    odpPassportDraftGlobalHooks = true;
    window.addEventListener("pagehide", flushPassportDraftSave);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") flushPassportDraftSave();
    });
  }
}

/** MetaMask mobile: `metamask.app.link/dapp/{host…}` with `https://` stripped (same as metamask-deeplinks generator; do not encode the full URL). */
function openInMetaMaskAppUrl() {
  try {
    const u = new URL(location.href);
    if (u.protocol !== "https:" && u.protocol !== "http:") return "";
    const rest = u.href.replace(/^https?:\/\//i, "");
    const out = "https://metamask.app.link/dapp/" + rest;
    return out;
  } catch {
    return "";
  }
}

async function connectWallet() {
  const eth = injectedEthereum();
  const errEl = document.getElementById("connectErr");
  if (odpConnectInFlight) {
    if (errEl)
      errEl.innerHTML =
        `<div class="info e">${esc(t("passport.errors.connectInProgress"))}</div>`;
    return;
  }
  if (!eth) {
    errEl.innerHTML = noWalletHtml();
    return;
  }
  odpConnectInFlight = true;
  odpSetConnectButtonsBusy(true);
  try {
    await eth.request({ method: "eth_requestAccounts" });
    const single = await odpRequireSingleEthereumAccount(eth);
    if (!single.ok) {
      errEl.innerHTML = `<div class="info e">${esc(single.message)}</div>`;
      return;
    }
    await odpMergeRegistryConfigAsync(NET);
    await ensureWalletChain(eth, NET);
    await ensureWalletChain(eth, NET);
    const Elib = odpEthersLib();
    if (!Elib || !Elib.providers) {
      errEl.innerHTML = `<div class="info e">${esc("ethers v5 failed to load (CDN blocked?).")}</div>`;
      return;
    }
    await _finish(new Elib.providers.Web3Provider(eth));
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (/already pending|request of type.*pending/i.test(msg)) {
      errEl.innerHTML =
        `<div class="info e">${esc(t("passport.errors.walletPending"))}</div>`;
    } else {
      errEl.innerHTML = `<div class="info e">${esc(msg)}</div>`;
    }
  } finally {
    odpConnectInFlight = false;
    odpSetConnectButtonsBusy(false);
  }
}

async function connectWalletWithWalletConnect() {
  const errEl = document.getElementById("connectErr");
  if (odpConnectInFlight) {
    if (errEl)
      errEl.innerHTML =
        `<div class="info e">${esc(t("passport.errors.connectInProgress"))}</div>`;
    return;
  }
  await odpMergeRegistryConfigAsync(NET);
  odpConnectInFlight = true;
  odpSetConnectButtonsBusy(true);
  try {
    await odpEnsureWalletConnectBundle();
    const eth = await odpWalletConnectConnect({ chainId: NET.chainId, rpcUrl: NET.rpc });
    await ensureWalletChain(eth, NET);
    const single = await odpRequireSingleEthereumAccount(eth);
    if (!single.ok) {
      errEl.innerHTML = `<div class="info e">${esc(single.message)}</div>`;
      return;
    }
    await ensureWalletChain(eth, NET);
    if (typeof odpInstallSingleAccountGuard === "function") {
      odpInstallSingleAccountGuard(eth, {
        onMultiple: async function () {
          var r = await odpRequireSingleEthereumAccount(eth);
          walletConnectError = r.message || t("passport.multiAccount");
          await disconnectWallet();
        },
        onEmpty: async function () {
          await disconnectWallet();
        },
      });
    }
    const Ewc = odpEthersLib();
    if (!Ewc || !Ewc.providers) {
      errEl.innerHTML = `<div class="info e">${esc("ethers v5 failed to load (CDN blocked?).")}</div>`;
      return;
    }
    await _finish(new Ewc.providers.Web3Provider(eth));
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (/already pending|request of type.*pending/i.test(msg)) {
      errEl.innerHTML =
        `<div class="info e">${esc(t("passport.errors.walletPending"))}</div>`;
    } else {
      errEl.innerHTML = `<div class="info e">${esc(msg)}</div>`;
    }
  } finally {
    odpConnectInFlight = false;
    odpSetConnectButtonsBusy(false);
  }
}

async function _finish(p) {
  await odpMergeRegistryConfigAsync(NET);
  try { sessionStorage.removeItem(ODP_SKIP_WALLET_AUTOCONNECT); } catch {}
  const net = NET;
  const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || "");
  if (!odpHasValidRegistryAddress(net)) {
    const ce = document.getElementById("connectErr");
    if (ce) ce.innerHTML = odpRegistryMisconfiguredBannerHtml(isLocal);
    return;
  }
  provider = p; signer = p.getSigner();
  wallet   = await signer.getAddress();
  const fin = await odpFinalizeWalletContract(net, signer, POLYGON_RPC_FALLBACKS, "passport");
  if (fin.legacyUnsupported) {
    provider = null;
    signer = null;
    contract = null;
    wallet = null;
    odpContractGeneration = null;
    ABI = null;
    const msg = fin.message || (typeof ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG !== "undefined" ? ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG : "Legacy contract not supported.");
    walletConnectError = msg;
    document.getElementById("connectErr").innerHTML = `<div class="info e">${esc(msg)}</div>`;
    syncOdpHeaderDisconnect();
    return;
  }
  odpContractGeneration = fin.generation;
  ABI = fin.abi;
  contract = fin.contract;
  if (typeof odpPersistRegistryContractToSession === "function") odpPersistRegistryContractToSession(net);
  creatorId = await contract.getCreatorByWallet(wallet);
  if (!creatorId) {
    document.getElementById("app").innerHTML = `
      <div class="info w" style="text-align:center">
        ${esc(t("passport.noCreator.title"))}<br>
        <a href="creator.html" style="color:var(--accent)">${esc(t("passport.noCreator.link"))}</a>
      </div>`;
    syncOdpHeaderDisconnect();
    return;
  }
  renderForm();
}

async function loadMyPassports(reset) {
  const el = document.getElementById("myPassportsList");
  const meta = document.getElementById("myPassportsMeta");
  const btn = document.getElementById("myPassportsLoadMoreBtn");
  const row = document.getElementById("myPassportsLoadMoreRow");
  if (!el || !contract || !wallet) return;
  if (reset) {
    el.innerHTML = `<div class="pl-loading">${esc(t("passport.list.loading"))}</div>`;
    myPassportsLoaded = [];
    myPassportsAllIds = [];
    myPassportsTotal = 0;
    if (btn) btn.disabled = true;
    if (row) row.style.display = "none";
    if (meta) meta.textContent = "";
  } else if (btn) {
    btn.disabled = true;
  }
  try {
    if (reset) {
      const ids = typeof odpListCreatorPassports === "function" ? await odpListCreatorPassports(contract, wallet, 100) : [];
      myPassportsAllIds = Array.isArray(ids) ? ids.slice() : [];
      myPassportsTotal = myPassportsAllIds.length;
      myPassportsLoaded = myPassportsAllIds.slice(0, MY_PASSPORTS_LIMIT);
    } else {
      const offset = myPassportsLoaded.length;
      const more = myPassportsAllIds.slice(offset, offset + MY_PASSPORTS_LIMIT);
      myPassportsLoaded = myPassportsLoaded.concat(more);
    }

    if (myPassportsLoaded.length === 0) {
      el.innerHTML = `<p class="pl-empty">${esc(t("passport.list.empty"))}</p>`;
      if (row) row.style.display = "none";
      return;
    }

    const rows = await Promise.all(
      myPassportsLoaded.map(async (hid) => {
        try {
          const p = await odpGetPassportRecord(contract, hid);
          const ts = Number(p.timestamp) * 1000;
          const dateStr = ts ? odpFormatDateDDMMYYYY(new Date(ts)) : "—";
          return { hid, objectType: p.objectType, dateStr };
        } catch {
          return { hid, objectType: "?", dateStr: "—" };
        }
      })
    );
    const vbase = "verify.html?id=";
    const showManage =
      typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration);
    const showManageModal =
      odpContractGeneration >= 5 &&
      contract &&
      typeof contract.updatePassportStatus === "function";
    el.innerHTML = `
      <div class="pl-table">
        ${rows
          .map(
            (r) => `
          <div class="pl-row">
            <div>
              <div class="pl-id">${esc(r.hid)}</div>
              <div class="pl-meta">${esc(r.objectType)} · ${esc(r.dateStr)}</div>
            </div>
            <div class="pl-actions">
              <a href="${vbase}${encodeURIComponent(r.hid)}">${esc(t("passport.list.verifyLink"))}</a>
              <button type="button" class="pl-url-btn" onclick='openPassportShareModal(${JSON.stringify(r.hid)})'>${esc(t("passport.list.share"))}</button>
              <button type="button" class="pl-url-btn" onclick='void downloadOdpDidForPassport(${JSON.stringify(r.hid)})'>${esc(t("passport.list.didDoc"))}</button>
              <button type="button" class="pl-url-btn" onclick='openPassportUrlEditor(${JSON.stringify(r.hid)})'>${esc(t("passport.list.urls"))}</button>
              ${
                showManage
                  ? showManageModal
                    ? `<button type="button" class="pl-url-btn" onclick='openPassportManageEditor(${JSON.stringify(r.hid)})'>${esc(t("passport.list.manageOps"))}</button>`
                    : `<a class="pl-url-btn" href="creator.html?${new URLSearchParams({ v03hid: r.hid }).toString()}">${esc(t("passport.list.manageOps"))}</a>`
                  : ""
              }
            </div>
          </div>`
          )
          .join("")}
      </div>`;

    if (row && btn && meta && myPassportsTotal > MY_PASSPORTS_LIMIT) {
      row.style.display = "flex";
      meta.textContent = t("passport.list.pageMeta")
        .replace("{n}", String(myPassportsLoaded.length))
        .replace("{total}", String(myPassportsTotal));
      btn.disabled = myPassportsLoaded.length >= myPassportsTotal;
    } else if (row) {
      row.style.display = "none";
    }
  } catch (e) {
    el.innerHTML = `<div class="info e">${esc(e.message || String(e))}</div>`;
    if (btn) btn.disabled = false;
  }
}

function passportManageNormalizeText(v) {
  return String(v == null ? "" : v).trim();
}

function passportManageBytes32Hex(v) {
  const direct = String(v == null ? "" : v).trim();
  if (/^0x[0-9a-f]{64}$/i.test(direct)) return direct.toLowerCase();
  try {
    if (typeof ethers !== "undefined" && ethers.utils && typeof ethers.utils.hexlify === "function") {
      const hx = ethers.utils.hexlify(v);
      if (/^0x[0-9a-f]{64}$/i.test(hx)) return String(hx).toLowerCase();
    }
  } catch {}
  return ZERO32;
}

function passportManageIsZeroBytes32(v) {
  return passportManageBytes32Hex(v) === ZERO32;
}

function passportManageParseOptionalBytes32(raw) {
  const v = String(raw || "").trim();
  if (!v) return ZERO32;
  if (!/^0x[0-9a-f]{64}$/i.test(v)) throw new Error(t("passport.manage.hashInvalid"));
  return v.toLowerCase();
}

  const ndppCommitmentUri = passportManageNormalizeText(p.ndppCommitmentUri);
  const revocationReasonHash = passportManageBytes32Hex(p.revocationReasonHash);
  return `
    <div class="section-label" style="margin-bottom:8px">${esc(t("passport.manage.summaryTitle"))}</div>
    <p class="fhint" style="margin:0 0 10px;line-height:1.55">${esc(t("passport.manage.summaryLead"))}</p>

      <div><strong>${esc(t("passport.v03Ops.owner"))}:</strong> <span class="mono">${esc(String(ownerAddr || "—"))}</span></div>
      <div><strong>${esc(t("passport.form.labelStatus"))}:</strong> ${esc(lifecycleStatusLabelFromCode(p.lifecycleStatus))}</div>
      <div><strong>${esc(t("passport.v03Ops.revoked"))}:</strong> ${esc(revoked ? t("passport.v03Ops.revokedYes") : t("passport.v03Ops.revokedNo"))}</div>
      ${
        revoked && revokedAtNum > 0
          ? `<div><strong>${esc(t("passport.manage.revokedAtLabel"))}:</strong> ${esc(odpFormatDateTimeLocalDDMMYYYY(new Date(revokedAtNum * 1000)))}</div>`
          : ""
      }
      ${
        revoked && !passportManageIsZeroBytes32(revocationReasonHash)
          ? `<div><strong>${esc(t("passport.manage.revocationHashLabel"))}:</strong> <span class="mono">${esc(revocationReasonHash)}</span></div>`
          : ""
      }
      ${currentLocation ? `<div><strong>${esc(t("passport.form.labelLocation"))}:</strong> ${esc(currentLocation)}</div>` : ""}
      ${rightsNote ? `<div><strong>${esc(t("passport.form.labelRightsNote"))}:</strong> ${esc(rightsNote)}</div>` : ""}

      ${auxCommitmentUri ? `<div><strong>${esc(t("passport.manage.auxUrlLabel"))}:</strong> ${esc(auxCommitmentUri)}</div>` : ""}

      }
      ${ndppCommitmentUri ? `<div><strong>${esc(t("passport.manage.ndppUrlLabel"))}:</strong> ${esc(ndppCommitmentUri)}</div>` : ""}
      ${
        !passportManageIsZeroBytes32(p.ndppCommitmentHash)
          ? `<div><strong>${esc(t("passport.manage.ndppHashLabel"))}:</strong> <span class="mono">${esc(passportManageBytes32Hex(p.ndppCommitmentHash))}</span></div>`

}

async function openPassportManageEditor(humanId) {
  const modal = document.getElementById("passportManageModal");
  const summaryEl = document.getElementById("passportManageSummary");
  const idEl = document.getElementById("passportManagePassportId");
  if (!modal || !summaryEl || !idEl) return;
  idEl.textContent = humanId;
  summaryEl.innerHTML = "";
  passportManageSetStatus("neutral", t("passport.manage.loading"));
  passportManageSetSectionVisible("passportManageStateSection", false);
  passportManageSetSectionVisible("passportManageLinksSection", false);
  passportManageSetSectionVisible("passportManageTransferSection", false);
  passportManageSetSectionVisible("passportManageAuxSection", false);
  passportManageSetSectionVisible("passportManageOfflineSection", false);
  passportManageSetSectionVisible("passportManageRevokeSection", false);
  modal.classList.add("open");
  try {
    const p = await odpGetPassportRecord(contract, humanId);
    let governanceAddr = "";
    try {
      if (contract && typeof contract.governance === "function") governanceAddr = await contract.governance();
    } catch {}
    const creatorAddr = String(p.creator || "").trim();
    const ownerAddr = String((p.owner !== undefined && p.owner) ? p.owner : creatorAddr).trim();
    const wl = String(wallet || "").trim().toLowerCase();
    const gov = String(governanceAddr || "").trim();
    const isCreator = !!creatorAddr && wl === creatorAddr.toLowerCase();
    const isOwner = !!ownerAddr && wl === ownerAddr.toLowerCase();
    const isGov = !!gov && wl === gov.toLowerCase();
    const revoked = !!p.revoked;
    const hasStateOps =
      contract &&
      typeof contract.updatePassportStatus === "function" &&
      typeof contract.updatePassportLocation === "function" &&
      typeof contract.updatePassportRights === "function" &&
      typeof contract.updatePassportCondition === "function";
    const canEditState = !revoked && hasStateOps && (isCreator || isOwner || isGov);
    const canEditUrls = !revoked && contract && typeof contract.updatePassportUrls === "function" && (isCreator || isOwner);
    const canTransfer = !revoked && contract && typeof contract.transferPassport === "function" && isOwner;
    const canEditAux = !revoked && contract && typeof contract.updatePassportAuxCommitment === "function" && (isCreator || isGov);
    const canEditNdpp = !revoked && contract && typeof contract.updatePassportNdppCommitment === "function" && (isCreator || isGov);
    const canRevoke = !revoked && contract && typeof contract.revokePassport === "function" && (isCreator || isGov);
    const showOffline = odpContractGeneration >= 5 && typeof odpOfflineEncode === "function";
    passportManageState = {
      hid: humanId,
      record: p,
      governance: governanceAddr,
      canEditState,
      canEditUrls,
      canTransfer,
      canEditAux,
      canEditNdpp,
      canRevoke,
    };
    summaryEl.innerHTML = passportManageSummaryHtml(humanId, p, governanceAddr);
    document.getElementById("passportManageStatusSelect").value = lifecycleStatusValueFromCode(p.lifecycleStatus) || "concept";
    document.getElementById("passportManageLocation").value = passportManageNormalizeText(p.currentLocation);
    document.getElementById("passportManageRights").value = passportManageNormalizeText(p.rightsNote);
    document.getElementById("passportManageCondition").value = passportManageNormalizeText(p.conditionNote);
    document.getElementById("passportManageDamageUrl").value = passportManageNormalizeText(p.damageHistoryUrl);
    document.getElementById("passportManageDamageHash").value = passportManageIsZeroBytes32(p.damageHistoryHash)
      ? ""
      : passportManageBytes32Hex(p.damageHistoryHash);
    document.getElementById("passportManageAuxUrl").value = passportManageNormalizeText(p.auxCommitmentUri);
    document.getElementById("passportManageAuxHash").value = passportManageIsZeroBytes32(p.auxCommitmentHash)
      ? ""
      : passportManageBytes32Hex(p.auxCommitmentHash);
    document.getElementById("passportManageNdppUrl").value = passportManageNormalizeText(p.ndppCommitmentUri);
    const offlineState = document.getElementById("passportManageOfflineIncludeState");
    if (offlineState) offlineState.checked = false;
    document.getElementById("passportManageTransferTo").value = "";
    document.getElementById("passportManageRevokeReason").value = "";
    const revokeAck = document.getElementById("passportManageRevokeAck");
    if (revokeAck) revokeAck.checked = false;
    syncPassportManageRevokeAck();
    passportManageSetSectionVisible("passportManageStateSection", canEditState);
    passportManageSetSectionVisible("passportManageLinksSection", canEditUrls);
    passportManageSetSectionVisible("passportManageTransferSection", canTransfer);
    passportManageSetSectionVisible("passportManageAuxSection", canEditAux);
    passportManageSetSectionVisible("passportManageOfflineSection", showOffline);
    passportManageSetSectionVisible("passportManageRevokeSection", canRevoke);
    if (showOffline) await refreshPassportManageOffline();
    if (revoked) {
      passportManageSetStatus("warn", t("passport.manage.revokedLocked"));
    } else if (!canEditState && !canEditUrls && !canTransfer && !canEditAux && !canEditNdpp && !canRevoke) {
      passportManageSetStatus("warn", t("passport.manage.notAllowed"));
    } else {
      passportManageSetStatus("", "");
    }
  } catch (e) {
    passportManageSetStatus("error", e && e.message ? e.message : t("passport.manage.loadError"));
  }
}

async function submitPassportManageState() {
  const btn = document.getElementById("passportManageStateSubmit");
  if (!btn || !passportManageState || !passportManageState.hid || !passportManageState.canEditState) return;
  const hid = passportManageState.hid;
  const original = passportManageState.record || {};
  const nextStatus = lifecycleStatusCodeFromValue(document.getElementById("passportManageStatusSelect").value);
  const nextLocation = passportManageNormalizeText(document.getElementById("passportManageLocation").value);
  const nextRights = passportManageNormalizeText(document.getElementById("passportManageRights").value);
  const nextCondition = passportManageNormalizeText(document.getElementById("passportManageCondition").value);
  const nextDamageUrl = passportManageNormalizeText(document.getElementById("passportManageDamageUrl").value);
  let nextDamageHash;
  try {
    nextDamageHash = passportManageParseOptionalBytes32(document.getElementById("passportManageDamageHash").value);
  } catch (e) {
    passportManageSetStatus("error", e.message || String(e));
    return;
  }
  if (!nextStatus) {
    passportManageSetStatus("warn", t("passport.form.validateStatus"));
    return;
  }
  if (nextLocation.length > 256) {
    passportManageSetStatus("warn", passportManageFieldTooLong(t("passport.form.labelLocation"), 256));
    return;
  }
  if (nextRights.length > 256) {
    passportManageSetStatus("warn", passportManageFieldTooLong(t("passport.form.labelRightsNote"), 256));
    return;
  }
  if (nextCondition.length > 256) {
    passportManageSetStatus("warn", passportManageFieldTooLong(t("passport.form.labelConditionNote"), 256));
    return;
  }
  if (nextDamageHash === ZERO32 && nextDamageUrl) {
    passportManageSetStatus("warn", t("passport.manage.damagePairRequired"));
    return;
  }
  if (nextDamageUrl.length > 512) {
    passportManageSetStatus("warn", passportManageFieldTooLong(t("passport.manage.damageHistoryUrlLabel"), 512));
    return;
  }
  const ops = [];
  if (Number(original.lifecycleStatus || 0) !== nextStatus) {
    ops.push(() => contract.updatePassportStatus(hid, nextStatus));
  }
  if (passportManageNormalizeText(original.currentLocation) !== nextLocation) {
    ops.push(() => contract.updatePassportLocation(hid, nextLocation));
  }
  if (passportManageNormalizeText(original.rightsNote) !== nextRights) {
    ops.push(() => contract.updatePassportRights(hid, nextRights));
  }
  if (
    passportManageNormalizeText(original.conditionNote) !== nextCondition ||
    passportManageBytes32Hex(original.damageHistoryHash) !== nextDamageHash ||
    passportManageNormalizeText(original.damageHistoryUrl) !== nextDamageUrl
  ) {
    ops.push(() => contract.updatePassportCondition(hid, nextCondition, nextDamageHash, nextDamageUrl));
  }
  if (!ops.length) {
    passportManageSetStatus("neutral", t("passport.manage.stateNoChanges"));
    return;
  }
  btn.disabled = true;
  let completed = 0;
  try {
    for (let i = 0; i < ops.length; i++) {
      passportManageSetStatus(
        "neutral",
        t("passport.manage.stateProgress")
          .replace("{cur}", String(i + 1))
          .replace("{total}", String(ops.length))
      );
      const tx = await ops[i]();
      await waitForTransactionReceiptReliable(tx, provider);
      completed += 1;
    }
    await openPassportManageEditor(hid);
    passportManageSetStatus("neutral", t("passport.manage.stateSaved").replace("{n}", String(completed)));
    await loadMyPassports(true);
  } catch (e) {
    if (completed > 0) {
      await openPassportManageEditor(hid);
      passportManageSetStatus(
        "warn",
        t("passport.manage.statePartial")
          .replace("{done}", String(completed))
          .replace("{total}", String(ops.length)) +
          " " +
          String(e && e.message ? e.message : e)
      );
    } else {
      passportManageSetStatus("error", e && e.message ? e.message : String(e));
    }
  } finally {
    const btnNow = document.getElementById("passportManageStateSubmit");
    if (btnNow) btnNow.disabled = false;
  }
}

async function refreshPassportManageOffline() {
  const out = document.getElementById("passportManageOfflinePreview");
  const statusEl = document.getElementById("passportManageOfflineStatus");
  const uriEl = document.getElementById("passportManageNdppUrl");
  const dlCbor = document.getElementById("passportManageOfflineDownloadCbor");
  const dlNdef = document.getElementById("passportManageOfflineDownloadNdef");
  const anchorBtn = document.getElementById("passportManageOfflineAnchor");
  if (!out || !passportManageState || !passportManageState.record || typeof odpOfflineEncode !== "function") return;
  if (statusEl) statusEl.innerHTML = "";
  if (dlCbor) dlCbor.disabled = true;
  if (dlNdef) dlNdef.disabled = true;
  if (anchorBtn) anchorBtn.disabled = true;
  try {
    const includeState = !!(document.getElementById("passportManageOfflineIncludeState") || {}).checked;
    const built = odpOfflineEncode(passportManageState.record, {
      includeState,
      passportId: passportManageState.hid,
      contractAddress: NET.contract,
      chainId: NET.chainId,
    });
    const payloadHash = await odpOfflineSha256Hex(built.payloadBytes);
    passportManageState.offlineDraft = built;
    passportManageState.offlineHash = payloadHash;
    const fp = built.footprint || {};
    const statusTone = !fp.withinHardMax ? "e" : !fp.withinSoftMax ? "warn" : !fp.withinTarget ? "n" : "ok";
    const sizeLabel = !fp.withinHardMax
      ? t("passport.manage.offlineSizeHard")
      : !fp.withinSoftMax
        ? t("passport.manage.offlineSizeSoft")
        : !fp.withinTarget
          ? t("passport.manage.offlineSizeTarget")
          : t("passport.manage.offlineSizeOk");
    const anchored = passportManageBytes32Hex(passportManageState.record.ndppCommitmentHash);
    const anchorMatch = anchored && anchored === payloadHash.toLowerCase();
    out.innerHTML = `
      <div><strong>${esc(t("passport.manage.offlineFingerprintLabel"))}:</strong> <span class="mono">${esc(payloadHash)}</span></div>
      <div><strong>${esc(t("passport.manage.offlinePayloadBytesLabel"))}:</strong> ${esc(String(fp.payloadBytes || 0))} B</div>
      <div><strong>${esc(t("passport.manage.offlineNdefBytesLabel"))}:</strong> ${esc(String(fp.ndefFileBytes || 0))} / 256 B</div>
      <div><strong>${esc(t("passport.manage.offlineSizeLabel"))}:</strong> <span class="info ${statusTone}" style="display:inline-block;padding:2px 8px;margin:0">${esc(sizeLabel)}</span></div>
      ${
        built.titleTruncated
          ? `<div style="margin-top:6px">${esc(t("passport.manage.offlineTitleTruncated").replace("{n}", String(built.titleBytes || 0)))}</div>`
          : ""
      }
      <div style="margin-top:6px"><strong>${esc(t("passport.manage.offlineAnchoredLabel"))}:</strong> ${
        anchorMatch ? esc(t("passport.manage.offlineAnchoredMatch")) : esc(t("passport.manage.offlineAnchoredDifferent"))
      }</div>
      <div style="margin-top:6px"><strong>${esc(t("passport.manage.offlineBase64Label"))}:</strong></div>
      <textarea readonly rows="5" style="width:100%;margin-top:6px;font-family:ui-monospace,monospace;font-size:11px">${esc(built.payloadBase64)}</textarea>
    `;
    if (dlCbor) dlCbor.disabled = false;
    if (dlNdef) dlNdef.disabled = false;
    if (anchorBtn) anchorBtn.disabled = !passportManageState.canEditNdpp || !fp.withinHardMax;
    if (statusEl && !fp.withinHardMax) {
      statusEl.innerHTML = `<div class="info e">${esc(t("passport.manage.offlineTooLarge"))}</div>`;
    }
    if (statusEl && fp.withinHardMax && !fp.withinTarget) {
      statusEl.innerHTML = `<div class="info warn">${esc(t("passport.manage.offlineRecommendSmaller"))}</div>`;
    }
    if (uriEl && String(uriEl.value || "").trim().length > 512 && statusEl) {
      statusEl.innerHTML = `<div class="info e">${esc(passportManageFieldTooLong(t("passport.manage.ndppUrlLabel"), 512))}</div>`;
    }
  } catch (e) {
    passportManageState.offlineDraft = null;
    passportManageState.offlineHash = "";
    out.innerHTML = "";
    if (statusEl) statusEl.innerHTML = `<div class="info e">${esc(e && e.message ? e.message : String(e))}</div>`;
  }
}

async function downloadPassportManageOffline(kind) {
  if (!passportManageState || !passportManageState.offlineDraft) {
    await refreshPassportManageOffline();
  }
  const draft = passportManageState && passportManageState.offlineDraft;
  if (!draft) return;
  const payload = kind === "ndef" ? draft.ndefFileBytes : draft.payloadBytes;
  const mime = kind === "ndef" ? "application/octet-stream" : "application/cbor";
  const ext = kind === "ndef" ? "ndef" : "cbor";
  const blob = new Blob([payload], { type: mime });
  await triggerBrowserFileDownload(blob, `${safeFilePart(passportManageState.hid || "passport")}-odp-offline-v1.${ext}`, mime);
}

async function submitPassportManageNdpp() {
  const btn = document.getElementById("passportManageOfflineAnchor");
  const statusEl = document.getElementById("passportManageOfflineStatus");
  if (!btn || !passportManageState || !passportManageState.hid || !passportManageState.canEditNdpp) return;
  const uri = passportManageNormalizeText((document.getElementById("passportManageNdppUrl") || {}).value);
  if (uri.length > 512) {
    if (statusEl) statusEl.innerHTML = `<div class="info e">${esc(passportManageFieldTooLong(t("passport.manage.ndppUrlLabel"), 512))}</div>`;
    return;
  }
  await refreshPassportManageOffline();
  const draft = passportManageState.offlineDraft;
  const nextHash = passportManageState.offlineHash || "";
  if (!draft || !nextHash) return;
  if (!draft.footprint || !draft.footprint.withinHardMax) {
    if (statusEl) statusEl.innerHTML = `<div class="info e">${esc(t("passport.manage.offlineTooLarge"))}</div>`;
    return;
  }
  const original = passportManageState.record || {};
  if (
    passportManageBytes32Hex(original.ndppCommitmentHash) === String(nextHash).toLowerCase() &&
    passportManageNormalizeText(original.ndppCommitmentUri) === uri
  ) {
    if (statusEl) statusEl.innerHTML = `<div class="info n">${esc(t("passport.manage.ndppNoChanges"))}</div>`;
    return;
  }
  btn.disabled = true;
  try {
    if (statusEl) statusEl.innerHTML = `<div class="info n">${esc(t("passport.manage.ndppConfirmWallet"))}</div>`;
    const tx = await contract.updatePassportNdppCommitment(passportManageState.hid, nextHash, uri);
    await waitForTransactionReceiptReliable(tx, provider);
    await openPassportManageEditor(passportManageState.hid);
    passportManageSetStatus("neutral", t("passport.manage.ndppSaved"));
  } catch (e) {
    if (statusEl) statusEl.innerHTML = `<div class="info e">${esc(e && e.message ? e.message : String(e))}</div>`;
  } finally {
    const btnNow = document.getElementById("passportManageOfflineAnchor");
    if (btnNow) btnNow.disabled = false;
  }
}

async function submitPassportManageTransfer() {
  const btn = document.getElementById("passportManageTransferSubmit");

    passportManageSetStatus("warn", t("passport.manage.transferSameOwner"));

    await waitForTransactionReceiptReliable(tx, provider);
    await openPassportManageEditor(hid);

    const btnNow = document.getElementById("passportManageTransferSubmit");
    if (btnNow) btnNow.disabled = false;

}

async function submitPassportManageRevoke() {

function lifecycleStatusCodeFromValue(vv) {
  const v = String(vv || "").trim().toLowerCase();
  if (v === "concept") return 1;
  if (v === "prototype") return 2;
  if (v === "produced_object") return 3;
  if (v === "archived") return 4;
  return 0;
}

function lifecycleStatusValueFromCode(vv) {
  const v = Number(vv);
  if (v === 1) return "concept";
  if (v === 2) return "prototype";
  if (v === 3) return "produced_object";
  if (v === 4) return "archived";
  return "";
}

function lifecycleStatusLabelFromCode(vv) {
  const v = lifecycleStatusValueFromCode(vv);
  if (v === "concept") return t("passport.form.statusConcept");
  if (v === "prototype") return t("passport.form.statusPrototype");
  if (v === "produced_object") return t("passport.form.statusProducedObject");
  if (v === "archived") return t("passport.form.statusArchived");
  return vv != null && vv !== "" ? String(vv) : "—";
}

  if (!contract || odpContractGeneration == null) return false;
  if (typeof contract.getCounterfeitConcern === "function") return true;
  if (typeof odpCounterfeitSatelliteAddress === "function" && odpCounterfeitSatelliteAddress(NET)) {
    return typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration);
  }
  return false;
}

/** @param doScroll Omit or true when the user explicitly switched tools; false on initial page sync (avoid jumping on nav). */
function activatePassportTool(tool, updateUrl, doScroll) {
  const scroll = doScroll !== false;
  let slug = String(tool ?? "").trim();
  const q = new URLSearchParams(window.location.search);
  const qTool = (q.get("tool") || "").trim();
  if (!slug) {
    if ((q.get("tool") || "").trim() === "mint") slug = "mint";
  }
  if (updateUrl) {
    const u = new URL(window.location.href);
    if (slug === "mint") u.searchParams.set("tool", "mint");
    else u.searchParams.delete("tool");
    try {
      window.history.replaceState({}, "", u.toString());
    } catch {}
  }

  const mintSec = document.getElementById("passportMintWorkspace");
  const menu = document.getElementById("passportToolsMenu");
  const subnav = document.getElementById("passportToolSubnav");
  const subTitle = document.getElementById("passportToolSubnavTitle");

  if (slug !== "mint") {
    if (subnav) subnav.style.display = "none";
    if (menu) menu.hidden = false;
    if (mintSec) mintSec.hidden = true;
    if (scroll) {
      scrollToPassportSection(document.getElementById("passportToolsMenu") || document.getElementById("passportToolsHeading"));
    }
    return;
  }
  if (menu) menu.hidden = true;
  if (subnav) subnav.style.display = "";
  if (subTitle) subTitle.textContent = t("passport.tools.mintSubnavTitle");
  if (mintSec) mintSec.hidden = false;
  if (scroll) {
    scrollToPassportSection(mintSec);
  }
}

const PM_PROOF_ZERO32 = "0x" + "0".repeat(64);

async function pmProofSha256FileToBytes32(file) {
  const buf = await file.arrayBuffer();
  const d = await crypto.subtle.digest("SHA-256", buf);
  return "0x" + [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function bindPMProofHandlers() {
  const humanIn = document.getElementById("pmProofHumanId");
  const noteFile = document.getElementById("pmProofNoteFile");
  const noteFileDrop = document.getElementById("pmProofNoteFileDrop");
  const noteUrlIn = document.getElementById("pmProofNoteUrl");
  const noteHashEl = document.getElementById("pmProofNoteHash");
  const submitBtn = document.getElementById("pmProofSubmitBtn");
  const refreshBtn = document.getElementById("pmProofRefreshBtn");
  const submitResult = document.getElementById("pmProofSubmitResult");
  const listEl = document.getElementById("pmProofList");
  if (!contract || !creatorId || !humanIn || !submitBtn || !listEl) return;

  function syncPmProofFileDropEmpty() {
    const drop = noteFileDrop || document.getElementById("pmProofNoteFileDrop");
    const dropText = drop && drop.querySelector(".fdrop-text");
    if (noteHashEl) noteHashEl.textContent = "";
    if (drop) drop.classList.remove("has-file");
    if (dropText) {
      dropText.innerHTML =
        "<span>" +
        esc(t("passport.pmProof.noteFileDrop1")) +
        '</span><br><span style="font-size:11px;opacity:0.6">' +
        esc(t("passport.pmProof.noteFileDrop2")) +
        "</span>";
    }
  }

  async function refreshList() {
    listEl.textContent = "…";
    try {
      const proofContract =
        typeof odpProofReadContract === "function"
          ? odpProofReadContract(contract, NET, odpContractGeneration, contract.signer || contract.provider || contract)
          : contract;
      const ids = await proofContract.getProofsByInstitution(creatorId);
      const arr = Array.isArray(ids) ? ids : [];
      if (arr.length === 0) {
        listEl.textContent = t("passport.pmProof.listEmpty");
        return;
      }
      const lines = [];
      for (const pid of arr) {
        try {
          const pr = await proofContract.getProof(pid);
          const nh =
            pr && pr.noteHash != null && typeof ethers !== "undefined"
              ? ethers.utils.hexlify(pr.noteHash)
              : String((pr && pr.noteHash) || "");
          const ts = pr && pr.timestamp != null ? Number(pr.timestamp) * 1000 : 0;
          const when = ts ? odpFormatDateTimeLocalDDMMYYYY(new Date(ts)) : "—";
          lines.push(
            `${pid}\n  ${t("passport.pmProof.listPassport")} ${(pr && pr.passportId != null ? pr.passportId : pr.humanId) || "—"}\n  ${t("passport.pmProof.listWhen")} ${when}\n  noteHash: ${nh}\n  noteUrl: ${(pr && pr.noteUrl) || "—"}\n`
          );
        } catch {
          lines.push(String(pid) + "\n");
        }
      }
      listEl.textContent = lines.join("\n");
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      listEl.textContent = m;
    }
  }

  if (noteFile) {
    noteFile.addEventListener("change", async () => {
      const f = noteFile.files && noteFile.files[0];
      const drop = noteFileDrop || document.getElementById("pmProofNoteFileDrop");
      const dropText = drop && drop.querySelector(".fdrop-text");
      if (!f) {
        syncPmProofFileDropEmpty();
        return;
      }
      try {
        const h = await pmProofSha256FileToBytes32(f);
        if (noteHashEl) noteHashEl.textContent = t("passport.pmProof.noteHashComputed") + " " + h;
        if (drop) drop.classList.add("has-file");
        if (dropText) {
          var sz = f.size || 0;
          var szStr =
            sz < 1024
              ? sz + " B"
              : sz < 1048576
                ? (sz / 1024).toFixed(1) + " KB"
                : (sz / 1048576).toFixed(1) + " MB";
          dropText.innerHTML =
            "<span>" +
            esc(f.name || t("passport.pmProof.noteFileLabel")) +
            '</span><br><span style="font-size:11px;opacity:0.6">' +
            esc(szStr) +
            "</span>";
        }
      } catch {
        if (noteFile) noteFile.value = "";
        syncPmProofFileDropEmpty();
      }
    });
  }

  const pmCfPassportIn = document.getElementById("pmCfPassportId");
  const pmCfNoteFile = document.getElementById("pmCfNoteFile");
  const pmCfFileDrop = document.getElementById("pmCfFileDrop");
  const pmCfNoteHashEl = document.getElementById("pmCfNoteHash");
  const pmCfNoteUrlIn = document.getElementById("pmCfNoteUrl");
  const pmCfChainStatus = document.getElementById("pmCfChainStatus");
  const pmCfRaiseBtn = document.getElementById("pmCfRaiseBtn");
  const pmCfClearBtn = document.getElementById("pmCfClearBtn");
  const pmCfRefreshStatusBtn = document.getElementById("pmCfRefreshStatusBtn");
  const pmCfResult = document.getElementById("pmCfResult");

  /** Default file fingerprint for concern hash when no file is chosen. */
  let pmCfFileHashBytes32 = PM_PROOF_ZERO32;

  function syncPmCfFileDropEmpty() {
    pmCfFileHashBytes32 = PM_PROOF_ZERO32;
    const drop = pmCfFileDrop || document.getElementById("pmCfFileDrop");
    const dropText = drop && drop.querySelector(".fdrop-text");
    if (pmCfNoteHashEl) pmCfNoteHashEl.textContent = "";
    if (drop) drop.classList.remove("has-file");
    if (dropText) {
      dropText.innerHTML =
        "<span>" +
        esc(t("passport.pmProof.noteFileDrop1")) +
        '</span><br><span style="font-size:11px;opacity:0.6">' +
        esc(t("passport.pmProof.noteFileDrop2")) +
        "</span>";
    }
  }

  function pmCfConcernReasonHash(passportId, fileSha256Hex, urlText) {
    const E = odpEthersLib();
    if (!E || !E.utils) throw new Error("ethers");
    const fh =
      fileSha256Hex && /^0x[0-9a-f]{64}$/i.test(String(fileSha256Hex))
        ? String(fileSha256Hex).toLowerCase()
        : PM_PROOF_ZERO32;
    const u = (urlText || "").trim().slice(0, 512);
    const payload =
      "ODP institutional concern|v1\npassportId:" +
      String(passportId).trim() +
      "\nfileSha256:" +
      fh +
      "\nurl:" +
      u;
    return E.utils.keccak256(E.utils.toUtf8Bytes(payload));
  }

  if (pmCfNoteFile) {
    pmCfNoteFile.addEventListener("change", async () => {
      const f = pmCfNoteFile.files && pmCfNoteFile.files[0];
      const drop = pmCfFileDrop || document.getElementById("pmCfFileDrop");
      const dropText = drop && drop.querySelector(".fdrop-text");
      if (!f) {
        syncPmCfFileDropEmpty();
        if (pmCfNoteFile) pmCfNoteFile.value = "";
        return;
      }
      try {
        const h = await pmProofSha256FileToBytes32(f);
        pmCfFileHashBytes32 = h;
        if (pmCfNoteHashEl) pmCfNoteHashEl.textContent = t("passport.pmProof.noteHashComputed") + " " + h;
        if (drop) drop.classList.add("has-file");
        if (dropText) {
          var sz = f.size || 0;
          var szStr =
            sz < 1024
              ? sz + " B"
              : sz < 1048576
                ? (sz / 1024).toFixed(1) + " KB"
                : (sz / 1048576).toFixed(1) + " MB";
          dropText.innerHTML =
            "<span>" +
            esc(f.name || t("passport.pmProof.noteFileLabel")) +
            '</span><br><span style="font-size:11px;opacity:0.6">' +
            esc(szStr) +
            "</span>";
        }
      } catch {
        if (pmCfNoteFile) pmCfNoteFile.value = "";
        syncPmCfFileDropEmpty();
      }
    });
  }

  async function refreshCfStatus() {
    const cfRead =
      typeof odpCounterfeitReadContract === "function"
        ? odpCounterfeitReadContract(contract, NET, odpContractGeneration, provider || signer)
        : null;
    if (!pmCfChainStatus || !contract || !cfRead || typeof cfRead.getCounterfeitConcern !== "function") return;
    const humanId = pmCfPassportIn && pmCfPassportIn.value ? String(pmCfPassportIn.value).trim() : "";
    if (!humanId || !/^ODP-/i.test(humanId)) {
      pmCfChainStatus.textContent = "";
      if (pmCfClearBtn) pmCfClearBtn.disabled = true;
      return;
    }
    pmCfChainStatus.textContent = t("passport.pmProof.cfStatusLoading");
    try {
      const cc = await cfRead.getCounterfeitConcern(humanId);
      const active = cc.active !== undefined ? cc.active : cc[0];
      const prover = cc.proverCreatorId !== undefined ? String(cc.proverCreatorId) : String(cc[1] || "");
      if (!active) {
        pmCfChainStatus.textContent = t("passport.pmProof.cfStatusInactive");
        if (pmCfClearBtn) pmCfClearBtn.disabled = true;
      } else {
        pmCfChainStatus.textContent = t("passport.pmProof.cfStatusActive").replace("{prover}", prover || "—");
        const canClear = !!(creatorId && prover && creatorId === prover);
        if (pmCfClearBtn) {
          pmCfClearBtn.disabled = !canClear;
          pmCfClearBtn.title = canClear ? "" : t("passport.pmProof.cfClearOnlyProver");
        }
      }
    } catch (e) {
      const msg = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      pmCfChainStatus.textContent =
        /execution reverted|CALL_EXCEPTION|missing revert|BAD_DATA|0x/i.test(msg) ? "" : msg.slice(0, 220);
      if (pmCfClearBtn) pmCfClearBtn.disabled = true;
    }
  }

  let pmCfInputTimer = null;
  if (pmCfPassportIn) {
    pmCfPassportIn.addEventListener("input", () => {
      clearTimeout(pmCfInputTimer);
      pmCfInputTimer = setTimeout(() => {
        void refreshCfStatus();
      }, 450);
    });
    pmCfPassportIn.addEventListener("blur", () => {
      void refreshCfStatus();
    });
  }

  if (refreshBtn) {
    refreshBtn.addEventListener("click", () => {
      void refreshList();
      void refreshCfStatus();
    });
  }
  void refreshList();
  void refreshCfStatus();

  if (pmCfRefreshStatusBtn) {
    pmCfRefreshStatusBtn.addEventListener("click", () => {
      void refreshCfStatus();
    });
  }

  if (pmCfRaiseBtn) {
    pmCfRaiseBtn.addEventListener("click", async () => {
      if (!contract) return;
      if (pmCfResult) pmCfResult.innerHTML = "";
      const humanId = pmCfPassportIn && pmCfPassportIn.value ? String(pmCfPassportIn.value).trim() : "";
      const urlStr = pmCfNoteUrlIn && pmCfNoteUrlIn.value ? String(pmCfNoteUrlIn.value).trim() : "";
      if (!humanId || !/^ODP-/i.test(humanId)) {
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.needHumanId"))}</div>`;
        return;
      }
      if (urlStr.length > 512) {
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.urlTooLong"))}</div>`;
        return;
      }
      let fileHex = pmCfFileHashBytes32;
      const f = pmCfNoteFile && pmCfNoteFile.files && pmCfNoteFile.files[0];
      if (f) {
        try {
          fileHex = await pmProofSha256FileToBytes32(f);
        } catch (e1) {
          if (pmCfResult)
            pmCfResult.innerHTML = `<div class="info error">${esc(e1 && e1.message ? String(e1.message) : String(e1))}</div>`;
          return;
        }
      } else {
        fileHex = PM_PROOF_ZERO32;
      }
      const cfWrite =
        typeof odpCounterfeitWriteContract === "function"
          ? odpCounterfeitWriteContract(contract, NET, odpContractGeneration, signer)
          : null;
      if (!cfWrite || typeof cfWrite.raiseCounterfeitConcern !== "function") {
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.cfRevertNoMethod"))}</div>`;
        return;
      }
      pmCfRaiseBtn.disabled = true;
      if (pmCfResult) pmCfResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.sending"))}</div>`;
      try {
        const rh = pmCfConcernReasonHash(humanId, fileHex, urlStr);
        const tx = await cfWrite.raiseCounterfeitConcern(humanId, rh);
        await waitForTransactionReceiptReliable(tx, provider);
        if (pmCfResult)
          pmCfResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.cfResultRaise"))} <code class="mono">${esc(tx.hash)}</code></div>`;
        await refreshCfStatus();
      } catch (e) {
        const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
        const hint = /execution reverted|CALL_EXCEPTION|missing revert/i.test(m) ? t("passport.pmProof.cfRevertNoMethod") : m;
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info error">${esc(hint)}</div>`;
      }
      pmCfRaiseBtn.disabled = false;
    });
  }

  if (pmCfClearBtn) {
    pmCfClearBtn.addEventListener("click", async () => {
      if (!contract) return;
      if (pmCfResult) pmCfResult.innerHTML = "";
      const humanId = pmCfPassportIn && pmCfPassportIn.value ? String(pmCfPassportIn.value).trim() : "";
      if (!humanId || !/^ODP-/i.test(humanId)) {
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.needHumanId"))}</div>`;
        return;
      }
      const cfWrite2 =
        typeof odpCounterfeitWriteContract === "function"
          ? odpCounterfeitWriteContract(contract, NET, odpContractGeneration, signer)
          : null;
      if (!cfWrite2 || typeof cfWrite2.clearCounterfeitConcern !== "function") {
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.cfRevertNoMethod"))}</div>`;
        return;
      }
      pmCfClearBtn.disabled = true;
      if (pmCfResult) pmCfResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.sending"))}</div>`;
      try {
        const tx = await cfWrite2.clearCounterfeitConcern(humanId);
        await waitForTransactionReceiptReliable(tx, provider);
        if (pmCfResult)
          pmCfResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.cfResultClear"))} <code class="mono">${esc(tx.hash)}</code></div>`;
        await refreshCfStatus();
      } catch (e) {
        const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
        const hint = /execution reverted|CALL_EXCEPTION|missing revert/i.test(m) ? t("passport.pmProof.cfRevertNoMethod") : m;
        if (pmCfResult) pmCfResult.innerHTML = `<div class="info error">${esc(hint)}</div>`;
        await refreshCfStatus();
      }
    });
  }

  submitBtn.addEventListener("click", async () => {
    if (!contract) return;
    submitResult.innerHTML = "";
    const humanId = humanIn.value ? String(humanIn.value).trim() : "";
    const nowPm = new Date();
    const year = nowPm.getUTCFullYear();
    const month = nowPm.getUTCMonth() + 1;
    const noteUrl = noteUrlIn && noteUrlIn.value ? String(noteUrlIn.value).trim() : "";
    let noteHash = PM_PROOF_ZERO32;
    const f = noteFile && noteFile.files && noteFile.files[0];
    if (f) {
      try {
        noteHash = await pmProofSha256FileToBytes32(f);
      } catch (e) {
        submitResult.innerHTML = `<div class="info error">${esc(e.message || String(e))}</div>`;
        return;
      }
    }
    if (!humanId || !/^ODP-/i.test(humanId)) {
      submitResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.needHumanId"))}</div>`;
      return;
    }
    if (noteUrl.length > 512) {
      submitResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.urlTooLong"))}</div>`;
      return;
    }
    if (noteHash === PM_PROOF_ZERO32 && noteUrl.length > 0) {
      submitResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.urlNeedsHash"))}</div>`;
      return;
    }
    submitBtn.disabled = true;
    submitResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.sending"))}</div>`;
    try {
      const proofWriter =
        typeof odpProofWriteContract === "function"
          ? odpProofWriteContract(contract, NET, odpContractGeneration, contract.signer || contract.provider || contract)
          : contract;
      const tx = await proofWriter.submitProof(humanId, noteHash, noteUrl, year, month);
      await waitForTransactionReceiptReliable(tx, provider);
      submitResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.done"))} <code class="mono">${esc(tx.hash)}</code></div>`;
      if (noteFile) noteFile.value = "";
      if (noteUrlIn) noteUrlIn.value = "";
      syncPmProofFileDropEmpty();
      await refreshList();
      await refreshCfStatus();
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      submitResult.innerHTML = `<div class="info error">${esc(m)}</div>`;
    }
    submitBtn.disabled = false;
  });
}

async function updatePassportMintsRow() {
  const el = document.getElementById("passportMintsRow");
  if (!el || !contract || !wallet) return;
  if (
    typeof odpSupportsFolderBaseMint !== "function" ||
    !odpSupportsFolderBaseMint(odpContractGeneration) ||
    typeof odpEstimateRemainingMints !== "function"
  ) {
    el.style.display = "none";
    el.innerHTML = "";
    return;
  }
  el.style.display = "block";
  try {
    const remInfo = await odpEstimateRemainingMints(contract, wallet);
    const prefix =
      typeof odpPassportProfileTypeLetter === "function" ? odpPassportProfileTypeLetter(creatorId) : "";
    if ((remInfo && remInfo.unlimited) || prefix === "P" || prefix === "M") {
      el.innerHTML = `<div class="info n passport-mints-banner">${esc(t("passport.mints.unlimited"))}</div>`;
      return;
    }
    const remN = remInfo && remInfo.remaining != null ? Number(remInfo.remaining) : 0;
    let limN = null;
    try {
      if (prefix === "B") {
        if (typeof contract.MONTHLY_LIMIT_B === "function") {
          const L = await contract.MONTHLY_LIMIT_B();
          limN = L && typeof L.toNumber === "function" ? L.toNumber() : Number(L);
        } else {
          limN = 100000;
        }
      } else if (typeof contract.MONTHLY_LIMIT_C === "function") {
        const L = await contract.MONTHLY_LIMIT_C();
        limN = L && typeof L.toNumber === "function" ? L.toNumber() : Number(L);
      } else {
        limN = 1000;
      }
    } catch {
      limN = prefix === "B" ? 100000 : 1000;
    }
    if (limN != null && !isNaN(limN)) {
      el.innerHTML = `<div class="info n passport-mints-banner">${esc(
        t("passport.mints.remaining").replace("{rem}", String(remN)).replace("{limit}", String(limN))
      )}</div>`;
    } else {
      el.innerHTML = `<div class="info n passport-mints-banner">${esc(
        t("passport.mints.remainingSimple").replace("{rem}", String(remN))
      )}</div>`;
    }
  } catch (e) {
    el.innerHTML = `<div class="info w passport-mints-banner passport-mints-banner--error">${esc(e.message || String(e))}</div>`;
  }
}

function syncHostingInputs() {
  const skip =
    odpSupportsOptionalDataUrl(odpContractGeneration) && document.getElementById("f_skip_public_url")?.checked === true;
  const rowMode = document.getElementById("hostingModeRow");
  const rowF = document.getElementById("hostingFolderRow");
  const rowU = document.getElementById("hostingFullRow");
  if (skip) {
    if (rowMode) rowMode.style.display = "none";
    if (rowF) rowF.style.display = "none";
    if (rowU) rowU.style.display = "none";
    return;
  }
  if (rowMode) rowMode.style.display = "";
  const folder = document.getElementById("f_use_folder")?.checked !== false;
  if (rowF) rowF.style.display = folder ? "" : "none";
  if (rowU) rowU.style.display = folder ? "none" : "";
}

// ── Object type switch ────────────────────────────────────────────────────────

function setType(ty) {
  objType = ty;
  document.getElementById("tt-physical").classList.toggle("sel", ty==="physical");
  document.getElementById("tt-digital").classList.toggle("sel",  ty==="digital");
  document.getElementById("tt-mixed").classList.toggle("sel", ty==="mixed");
  document.getElementById("physExtra").style.display    = isPhysicalLikeType(ty) ? "" : "none";
  document.getElementById("digitalExtra").style.display = isDigitalLikeType(ty)  ? "" : "none";
  document.getElementById("sealSection").style.display  = isPhysicalLikeType(ty) ? "" : "none";
  document.getElementById("digitalFile").style.display  = isDigitalLikeType(ty)  ? "" : "none";
  const cat = document.getElementById("f_type");
  if (cat) {
    cat.innerHTML =
      ty === "digital"
        ? htmlCategoryOptionsDigital()
        : ty === "mixed"
          ? htmlCategoryOptionsMixed()
          : htmlCategoryOptionsPhysical();
  }
  schedulePassportDraftSave();
}

// ── Seal switch ───────────────────────────────────────────────────────────────

function setSeal(n) {
  sealType = n;
  [1,2,3].forEach(i => { const el=document.getElementById(`s${i}`); if(el) el.classList.toggle("sel",i===n); });
  const nfc = document.getElementById("nfcFields");
  const num = document.getElementById("numFields");
  if (nfc) nfc.style.display = (n===1||n===3) ? "" : "none";
  if (num) num.style.display = (n===2||n===3) ? "" : "none";
  schedulePassportDraftSave();

// ── Build passport JSON ───────────────────────────────────────────────────────

function v(id) { const el=document.getElementById(id); return el?el.value.trim():""; }

/** Normalize folder root: https, no trailing slash (for joining). */
function normalizeBaseUrl(raw) {
  let s = String(raw || "").trim();
  if (!s) return "";
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try {
    const u = new URL(s);
    if (u.protocol !== "http:" && u.protocol !== "https:") return "";
    let out = u.origin + u.pathname;
    out = out.replace(/\/+$/, "");
    return out;
  } catch {
    return "";
  }
}

/** Final on-chain dataUrl when using folder hosting — hosts the .odpass ZIP (Verify reads passport.json inside). */
function joinPassportBundleUrl(baseNormalized, humanId) {
  return `${baseNormalized}/${humanId}.odpass`;
}

/**
 * Registration clock for `passport.json`: one instant in UTC only (SPEC reference / privacy mode).
 * Does not record device IANA zone, local wall clock, or non-UTC offsets — matches `tools/mint.py`.
 */
function buildRegistrationClock(now) {
  const registeredAt = Math.floor(now.getTime() / 1000);
  const pad = function (n) {
    return String(n).padStart(2, "0");
  };
  const utcIso8601 =
    now.getUTCFullYear() +
    "-" +
    pad(now.getUTCMonth() + 1) +
    "-" +
    pad(now.getUTCDate()) +
    "T" +
    pad(now.getUTCHours()) +
    ":" +
    pad(now.getUTCMinutes()) +
    ":" +
    pad(now.getUTCSeconds()) +
    "Z";
  const localIso8601 =
    now.getUTCFullYear() +
    "-" +
    pad(now.getUTCMonth() + 1) +
    "-" +
    pad(now.getUTCDate()) +
    "T" +
    pad(now.getUTCHours()) +
    ":" +
    pad(now.getUTCMinutes()) +
    ":" +
    pad(now.getUTCSeconds()) +
    "+00:00";
  return {
    registeredAt: registeredAt,
    registration: { ianaTimeZone: "UTC", localIso8601: localIso8601, utcIso8601: utcIso8601 },
  };
}

/** @param {Date} [mintAt] wall-clock instant for mint; UTC calendar year/month in JSON must match on-chain mint args. */
function buildPassport(humanId, mintAt) {
  const now = mintAt instanceof Date ? mintAt : new Date();
  const jsonSpecVersion =
    typeof odpContractGeneration === "number" && odpContractGeneration >= 5
      ? "0.5"
      : typeof odpContractGeneration === "number" && odpContractGeneration >= 4
      ? "0.4"
      : typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)
        ? "0.3"
        : "0.2";
  const clock = buildRegistrationClock(now);
  const utcY = now.getUTCFullYear();
  const utcM = now.getUTCMonth() + 1;
  const fy = parseInt(v("f_year"), 10);
  const contentClass = v("f_content_class");
  const domain = v("f_domain");
  const status = v("f_status");
  const aiStatus = v("f_ai_status");
  const verificationMethod = v("f_verification_method");
  const editionModel = v("f_edition_model");
  const team = v("f_team");
  const coAuthors = splitCsvValues(v("f_coauthors"));
  const refinementTags = splitCsvValues(v("f_tags"));
  const categoryTag = v("f_type");
  const desc = v("f_desc");
  const creationDate = v("f_creation_date");
  const marksRaw = v("f_marks");
  const p = {
    version: jsonSpecVersion,
    passportId: humanId || null,
    title: v("f_title"),
    domain: domain,
    objectType: objType,
    status: status,
    contentClass: contentClass,
    aiStatus: aiStatus,
    verificationMethod: verificationMethod,
    editionModel: editionModel,
    authorship: {
      author: { name: v("f_name"), wallet, creatorId },
    },
    year: utcY,
    month: utcM,
    registeredAt: clock.registeredAt,
    registration: clock.registration,
  };
  if (coAuthors.length) p.authorship.coAuthors = coAuthors.map((name) => ({ name }));
  if (team) p.authorship.team = team;
  if (categoryTag) refinementTags.unshift(categoryTag);
  if (refinementTags.length) p.refinementTags = Array.from(new Set(refinementTags));
  if (desc) p.description = desc;
  if (creationDate) p.creationDate = creationDate;
  if (!Number.isNaN(fy) && fy !== utcY) p.objectYear = fy;

  const currentState = {};
  const currentLocation = v("f_location");
  const rightsNote = v("f_rights_note");
  const conditionNote = v("f_condition_note");
  if (currentLocation) currentState.location = currentLocation;
  if (rightsNote) currentState.rightsNote = rightsNote;
  if (conditionNote) currentState.conditionNote = conditionNote;
  if (Object.keys(currentState).length) p.currentState = currentState;

  if (editionModel) {
    p.edition = { model: editionModel };
    const en = v("f_edn");
    const et = v("f_edt");
    if (en && et) {
      p.edition.number = parseInt(en, 10);
      p.edition.total = parseInt(et, 10);
    }
  }

  if (isPhysicalLikeType(objType)) {
    const med = v("f_medium");
    const mat = v("f_mat");
    const physical = {};
    if (categoryTag) physical.category = categoryTag;
    if (med) physical.medium = med;
    if (mat) physical.materials = mat.split(",").map((m) => ({ name: m.trim() })).filter((m) => m.name);
    const seal = {};
    if (sealType===1||sealType===3) {
      seal.nfc = { uid:v("f_nuid"), publicKey:v("f_nkey"), model:v("f_nmod"), installedAt:v("f_ndate") };
      const nn=v("f_nnotes"); if(nn) seal.nfc.notes=nn;
    }
    if (sealType===2||sealType===3) {
      seal.numbered = { number:v("f_snum"), type:v("f_stype") };
      const sc=v("f_scol"),ss=v("f_ssz"),sn=v("f_snotes");
      if(sc) seal.numbered.color=sc; if(ss) seal.numbered.size=ss; if(sn) seal.numbered.notes=sn;
    }
    if (Object.keys(seal).length) physical.seal = seal;
    if (marksRaw) physical.marks = [{ type: "note", description: marksRaw }];
    const dw = v("f_dim_w"), dh = v("f_dim_h"), dpt = v("f_depth");
    if (dw || dh || dpt) {
      physical.dimensions = {};
      if (dw) physical.dimensions.width = Number(dw);
      if (dh) physical.dimensions.height = Number(dh);
      if (dpt) physical.dimensions.depth = Number(dpt);
      physical.dimensions.unit = v("f_dim_unit") || "cm";
    }
    const wv = v("f_weight");
    if (wv) physical.weight = { value: Number(wv), unit: v("f_weight_unit") || "kg" };
    if (Object.keys(physical).length) p.physical = physical;
  }

  if (isDigitalLikeType(objType)) {
    const fmt=v("f_fmt");
    const c2paManifestRaw = v("f_c2pa_manifest_hash");
    const c2paManifestLabel = v("f_c2pa_manifest_label");
    const dig = { subtype:v("f_sub") };
    if (fileHashBytes32 !== ZERO32) dig.fileHash = "sha256:" + fileHashBytes32.slice(2);
    if (fmt) dig.format = fmt;
    if (fileSize) dig.fileSize = fileSize;
    const c2paManifestNorm = normalizeSha256Text(c2paManifestRaw);
    if (c2paManifestNorm || c2paManifestLabel) {
      dig.c2pa = {};
      if (c2paManifestNorm) dig.c2pa.manifestHash = c2paManifestNorm;
      if (c2paManifestLabel) dig.c2pa.activeManifest = c2paManifestLabel;
    }
    p.digital = dig;
  }

  imageUrl = v("f_imgUrl");
  // JSON field matches mint.py: f"sha256:{hex}"; on-chain still uses 0x bytes32 (imageHash)
  if (imageHash!==ZERO32) p.image = { url:imageUrl, hash: "sha256:"+imageHash.slice(2) };
  const extras = [];
  if (imageHash2 !== ZERO32) extras.push({ url: v("f_imgUrl2"), hash: "sha256:" + imageHash2.slice(2) });
  if (imageHash3 !== ZERO32) extras.push({ url: v("f_imgUrl3"), hash: "sha256:" + imageHash3.slice(2) });
  if (extras.length) p.images = extras;
  const additionalMetadata = {};
  const metaRoot = document.getElementById("extraMetaRows");
  if (metaRoot) {
    metaRoot.querySelectorAll(".extra-meta-row").forEach((row) => {
      const kEl = row.querySelector(".extra-meta-key");
      const vEl = row.querySelector(".extra-meta-val");
      const k = kEl && kEl.value != null ? String(kEl.value).trim() : "";
      const val = vEl && vEl.value != null ? String(vEl.value).trim() : "";
      if (k) additionalMetadata[k] = val;
    });
  }
  const lprice = v("f_listing_price");
  if (lprice) additionalMetadata.listingPrice = lprice;
  const itag = v("f_internal_tag");
  if (itag) additionalMetadata.internalTag = itag;
  if (Object.keys(additionalMetadata).length) p.additionalMetadata = additionalMetadata;
  return p;
}

function normalizeNFC(obj) {
  // Unicode NFC normalization — must match Python unicodedata.normalize("NFC", s)
  if (typeof obj === "string") return obj.normalize("NFC");
  if (Array.isArray(obj))      return obj.map(normalizeNFC);
  if (obj !== null && typeof obj === "object") {
    return Object.fromEntries(Object.entries(obj).map(([k,v]) => [k, normalizeNFC(v)]));
  }
  return obj;
}

function normalizeSha256Text(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  if (/^sha256:[a-fA-F0-9]{64}$/.test(s)) return "sha256:" + s.slice(7).toLowerCase();
  if (/^0x[a-fA-F0-9]{64}$/.test(s)) return "sha256:" + s.slice(2).toLowerCase();
  return "";
}

function sortKeysDeep(obj) {
  if (Array.isArray(obj)) return obj.map(sortKeysDeep);
  if (obj !== null && typeof obj === "object") {
    return Object.keys(obj).sort().reduce((acc, k) => {
      acc[k] = sortKeysDeep(obj[k]);
      return acc;
    }, {});
  }
  return obj;
}

/** Same string as hashed for on-chain dataHash (SPEC: NFC → sort keys → stringify). */
function canonicalJsonString(o) {
  return JSON.stringify(sortKeysDeep(normalizeNFC(o)));
}

async function sha256obj(o) {
  const canonical = canonicalJsonString(o);
  const buf = new TextEncoder().encode(canonical);
  const h   = await crypto.subtle.digest("SHA-256", buf);
  return "0x"+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ── Validate ──────────────────────────────────────────────────────────────────

function validate() {
  if (!v("f_title"))   return t("passport.form.validateTitle");
  if (!v("f_name"))    return t("passport.form.validateName");
  if (!v("f_content_class")) return t("passport.form.validateContentClass");
  if (!v("f_status")) return t("passport.form.validateStatus");
  if (
    (imageHash2 !== ZERO32 || imageHash3 !== ZERO32) &&
    imageHash === ZERO32
  ) {
    return t("passport.form.validateExtraImagesFirst");
  }
  if (imageHash3 !== ZERO32 && imageHash2 === ZERO32) {
    return t("passport.form.validateNeedImage2Before3");
  }
  const skip =
    odpSupportsOptionalDataUrl(odpContractGeneration) && document.getElementById("f_skip_public_url")?.checked === true;
  if (!skip) {
    const useFolder = document.getElementById("f_use_folder")?.checked !== false;
    if (useFolder) {
      if (!normalizeBaseUrl(v("f_urlBase"))) return t("passport.form.validateFolderUrl");
    } else if (!v("f_url")) {
      return t("passport.form.validateJsonUrl");
    }
  }
  if (isDigitalLikeType(objType) && fileHashBytes32===ZERO32) return t("passport.form.validateDigitalFile");
  if (isDigitalLikeType(objType)) {
    const c2 = v("f_c2pa_manifest_hash");
    if (c2 && !normalizeSha256Text(c2)) return t("passport.form.validateC2pa");
  }
  if (isPhysicalLikeType(objType)) {
    if ((sealType===1||sealType===3) && (!v("f_nuid")||!v("f_nkey"))) return t("passport.form.validateNfc");
    if ((sealType===2||sealType===3) && (!v("f_snum")||!v("f_stype"))) return t("passport.form.validateSeal");
  }
  return null;
}

function openPreMintModal() {

    errEl.innerHTML = `<div class="info e" style="margin-top:12px">${esc(err)}</div>`;

  }

  const blkSkip = document.getElementById("preMintSkipUrlBlock");

    blkSkip.style.display = skip ? "" : "none";

    ackText.textContent = skip
      ? t("passport.form.preAckSkipUrl")
      : t("passport.form.preAckWithUrl");
  }
  const ack = document.getElementById("preMintAck");
  const preErr = document.getElementById("preMintAckErr");
  if (ack) ack.checked = false;

    preErr.style.display = "none";

function confirmPreMintAndMint() {
