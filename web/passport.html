// ── Config ────────────────────────────────────────────────────────────────────

function t(key) {
  return typeof window.odpT === "function" ? window.odpT(key) : key;
}

const POLYGON_RPC_FALLBACKS = [
  "https://polygon-bor.publicnode.com",
  "https://1rpc.io/matic",
];

const NET = {
  name: "Polygon PoS", chainId: 137,
  rpc: POLYGON_RPC_FALLBACKS[0],
  explorer: "https://polygonscan.com",
  /** Paste deployed address (v0.2+ — generation is read via CONTRACT_VERSION()). */
  contract: "0xadb65b2F25596be7A798640BE3Ecc23956198d39",
  /** If CONTRACT_VERSION cannot be probed, assume this packed generation (default 2 = v0.2-shaped). */
  contractGenerationFallback: null,
};

/** When you deploy this site to a real domain, set this to that root (e.g. https://example.com/) so “Share via device” sends a full https://… link. Leave empty to use whatever host the page is opened on. */
const PUBLIC_VERIFY_BASE = "";

function getVerifyRelativePath(id) {
  return `verify.html?id=${encodeURIComponent(id)}`;
}

/** Absolute URL for Web Share / APIs; uses PUBLIC_VERIFY_BASE when set, else current page origin. */
function getVerifyAbsoluteUrl(id) {
  const rel = getVerifyRelativePath(id);
  const b = typeof PUBLIC_VERIFY_BASE === "string" && PUBLIC_VERIFY_BASE.trim();
  if (b) {
    try {
      return new URL(rel, b.endsWith("/") ? b : `${b}/`).href;
    } catch {
      /* fall through */
    }
  }
  return new URL(rel, window.location.href).href;
}

/** Prevents parallel wallet prompts (double-click → “already pending”). */
let odpWalletConnectInFlight = false;

/** Filled after wallet connect from `odpFinalizeWalletContract` (depends on on-chain CONTRACT_VERSION). */
let ABI = null;
/** ≥2 = v0.2+ (folder mint, optional dataUrl). Legacy byte 0 is rejected (see odpFinalizeWalletContract). */
let odpContractGeneration = null;

const ZERO32 = "0x"+"0".repeat(64);
/** User chose Disconnect — skip eth_accounts auto-reconnect until explicit Connect (same tab). */
const ODP_SKIP_WALLET_AUTOCONNECT = "odp_skip_wallet_autoconnect";
let provider=null, signer=null, contract=null, wallet=null, creatorId=null;
let objType="physical", sealType=2;
/** Raw file SHA-256 as bytes32 (0x + 64 hex) — required for mintDigital; matches mint.py to_bytes32 */
let fileHashBytes32=ZERO32, imageHash=ZERO32, imageUrl="", fileSize=0;
let imageHash2=ZERO32, imageHash3=ZERO32, imageUrl2="", imageUrl3="";
let selectedOriginalFile = null, selectedImageFile = null;
let selectedImageFile2 = null, selectedImageFile3 = null;
/** One-shot banner on connect screen (e.g. multi-account rejection). */
let walletConnectError = null;
/** When true, `walletConnectError` is trusted HTML (neutral hint, not escaped). */
let walletConnectErrorNeutral = false;
/** Client-paginated on-chain list in `loadMyPassports` (contract no longer exposes paged reads in v0.3). */
let myPassportsLoaded = [];
let myPassportsAllIds = [];
let myPassportsTotal = 0;
const MY_PASSPORTS_LIMIT = 20;
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/`/g,"&#96;"); }

function passportStackStripHtml() {
  if (typeof odpFormatStackSummaryHtml !== "function" || odpContractGeneration == null) return "";
  return '<div class="odp-passport-stack-strip">' + odpFormatStackSummaryHtml(odpContractGeneration) + "</div>";
}

/** v0.2+ mints: gas only (no protocol fee). */
function mintTxOpts() {
  return {};
}

// ── Connect ───────────────────────────────────────────────────────────────────

async function connect() {
  const app = document.getElementById("app");
  app.innerHTML = renderConnectUI();
}

async function disconnectWallet() {
  const eth = injectedEthereum();
  let revoked = false;
  if (eth) {
    revoked = await revokeSiteWalletPermission(eth);
  }
  try { sessionStorage.setItem(ODP_SKIP_WALLET_AUTOCONNECT, "1"); } catch {}
  provider = null; signer = null; contract = null; wallet = null; creatorId = null;
  odpContractGeneration = null;
  ABI = null;
  connect();
}

function renderConnectUI() {
  const errBanner = walletConnectError
    ? walletConnectErrorNeutral
      ? walletConnectError
      : `<div class="info e" style="margin-bottom:16px;line-height:1.55;text-align:left">${esc(walletConnectError)}</div>`
    : "";
  walletConnectError = null;
  walletConnectErrorNeutral = false;
  return `
    <div style="max-width:400px;margin:0 auto;text-align:center">
      ${errBanner}
      <p style="font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.7">
        ${esc(t("passport.connect.lead1"))}<br>
        ${esc(t("passport.connect.lead2"))}
        <a href="creator.html" style="color:var(--accent)">${esc(t("passport.connect.registerHere"))}</a> ${esc(t("passport.connect.lead3"))}
      </p>
      <div style="max-width:320px;margin:0 auto 12px">
        <div class="tt-opt" id="odpConnectWalletBtn" onclick="connectWallet()" style="padding:18px 12px">
          <div class="tt-icon">🔗</div>
          <div class="tt-name">${esc(t("passport.connect.btnName"))}</div>
          <div class="tt-desc">${esc(t("passport.connect.btnDesc"))}</div>
        </div>
      </div>
      <div id="connectErr" style="margin-top:12px"></div>
    </div>`;
}

function injectedEthereum() {
  const w = window.ethereum;
  if (!w) return null;
  if (w.providers && w.providers.length)
    return w.providers.find((p) => p.isMetaMask) || w.providers[0];
  return w;
}

/** MetaMask / modern EIP-1193: revoke site access so the next Connect shows a wallet prompt. */
async function revokeSiteWalletPermission(eth) {
  if (!eth) return false;
  try {
    await eth.request({ method: "wallet_revokePermissions", params: [{ eth_accounts: {} }] });
    return true;
  } catch {
    return false;
  }
}

/** MetaMask mobile: `metamask.app.link/dapp/{host…}` with `https://` stripped (same as metamask-deeplinks generator; do not encode the full URL). */
function openInMetaMaskAppUrl() {
  try {
    const u = new URL(location.href);
    if (u.protocol !== "https:" && u.protocol !== "http:") return "";
    const rest = u.href.replace(/^https?:\/\//i, "");
    const out = "https://metamask.app.link/dapp/" + rest;
    return out;
  } catch {
    return "";
  }
}

async function ensureWalletChain(eth, cfg) {
  const target = cfg.chainId;
  const hex = await eth.request({ method: "eth_chainId" });
  const cur = parseInt(hex, 16);
  if (cur === target) {
    return;
  }
  const chainIdHex = "0x" + target.toString(16);
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: chainIdHex }] });
  } catch (e) {
    if (e.code === 4902) {
      await eth.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: chainIdHex,
          chainName: cfg.name,
          nativeCurrency: { name: "POL", symbol: "POL", decimals: 18 },
          rpcUrls: [cfg.rpc],
          blockExplorerUrls: [cfg.explorer],
        }],
      });
    } else {
      throw e;
    }
  }
}

function noWalletHtml() {
  const fileProto = location.protocol === "file:";
  const mmApp = openInMetaMaskAppUrl();
  const mobileHint =
    !fileProto && mmApp
      ? `<div style="margin:14px 0 10px">
          <a class="btn" href="${esc(mmApp)}" rel="noopener" style="display:inline-block;text-decoration:none">${esc(t("passport.noWallet.mmOpen"))}</a>
          <p class="fhint" style="margin:10px 0 0;font-size:11px">${esc(t("passport.noWallet.mmHint"))}</p>
        </div>`
      : "";
  return `<div class="info e" style="line-height:1.6;text-align:left">
    ${esc(t("passport.noWallet.line1"))}
    <a href="https://metamask.io" target="_blank" rel="noopener" style="color:var(--accent)">${esc(t("passport.noWallet.metaMask"))}</a>
    ${esc(t("passport.noWallet.line2"))}
    ${mobileHint}
    ${fileProto ? `<br><br>${esc(t("passport.noWallet.fileProto"))}` : !mmApp ? `<br><br>${esc(t("passport.noWallet.httpsHint"))}` : ""}
  </div>`;
}

async function connectWallet() {
  const eth = injectedEthereum();
  const errEl = document.getElementById("connectErr");
  const btn = document.getElementById("odpConnectWalletBtn");
  if (odpWalletConnectInFlight) {
    if (errEl)
      errEl.innerHTML =
        `<div class="info e">${esc(t("passport.errors.connectInProgress"))}</div>`;
    return;
  }
  if (!eth) {
    errEl.innerHTML = noWalletHtml();
    return;
  }
  await odpMergeRegistryConfigAsync(NET);
  odpWalletConnectInFlight = true;
  if (btn) {
    btn.style.opacity = "0.65";
    btn.style.pointerEvents = "none";
  }
  try {
    // Polygon first, then accounts — so MetaMask scopes the connection to this chain
    // (requesting accounts before switch often shows permission for multiple networks).
    await ensureWalletChain(eth, NET);
    await eth.request({ method: "eth_requestAccounts" });
    const single = await odpRequireSingleEthereumAccount(eth);
    if (!single.ok) {
      errEl.innerHTML = `<div class="info e">${esc(single.message)}</div>`;
      return;
    }
    await ensureWalletChain(eth, NET);
    await _finish(new ethers.providers.Web3Provider(eth));
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (/already pending|request of type.*pending/i.test(msg)) {
      errEl.innerHTML =
        `<div class="info e">${esc(t("passport.errors.walletPending"))}</div>`;
    } else {
      errEl.innerHTML = `<div class="info e">${esc(msg)}</div>`;
    }
  } finally {
    odpWalletConnectInFlight = false;
    if (btn) {
      btn.style.opacity = "";
      btn.style.pointerEvents = "";
    }
  }
}

async function _finish(p) {
  await odpMergeRegistryConfigAsync(NET);
  try { sessionStorage.removeItem(ODP_SKIP_WALLET_AUTOCONNECT); } catch {}
  const net = NET;
  const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || "");
  if (!odpHasValidRegistryAddress(net)) {
    const ce = document.getElementById("connectErr");
    if (ce) ce.innerHTML = odpRegistryMisconfiguredBannerHtml(isLocal);
    return;
  }
  provider = p; signer = p.getSigner();
  wallet   = await signer.getAddress();
  const fin = await odpFinalizeWalletContract(net, signer, POLYGON_RPC_FALLBACKS, "passport");
  if (fin.legacyUnsupported) {
    provider = null;
    signer = null;
    contract = null;
    wallet = null;
    odpContractGeneration = null;
    ABI = null;
    const msg = fin.message || (typeof ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG !== "undefined" ? ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG : "Legacy contract not supported.");
    walletConnectError = msg;
    document.getElementById("connectErr").innerHTML = `<div class="info e">${esc(msg)}</div>`;
    return;
  }
  odpContractGeneration = fin.generation;
  ABI = fin.abi;
  contract = fin.contract;
  if (typeof odpPersistRegistryContractToSession === "function") odpPersistRegistryContractToSession(net);
  creatorId = await contract.getCreatorByWallet(wallet);
  if (!creatorId) {
    document.getElementById("app").innerHTML = `
      <div class="info w" style="text-align:center">
        ${esc(t("passport.noCreator.title"))}<br>
        <a href="creator.html" style="color:var(--accent)">${esc(t("passport.noCreator.link"))}</a>
      </div>`;
    return;
  }
  renderForm();
  initNetPill();
}

// ── My passports (on-chain list) ─────────────────────────────────────────────

async function loadMyPassports(reset) {
  const el = document.getElementById("myPassportsList");
  const meta = document.getElementById("myPassportsMeta");
  const btn = document.getElementById("myPassportsLoadMoreBtn");
  const row = document.getElementById("myPassportsLoadMoreRow");
  if (!el || !contract || !wallet) return;
  if (reset) {
    el.innerHTML = `<div class="pl-loading">${esc(t("passport.list.loading"))}</div>`;
    myPassportsLoaded = [];
    myPassportsAllIds = [];
    myPassportsTotal = 0;
    if (btn) btn.disabled = true;
    if (row) row.style.display = "none";
    if (meta) meta.textContent = "";
  } else if (btn) {
    btn.disabled = true;
  }
  try {
    if (reset) {
      const ids = await contract.getPassportsByCreator(wallet);
      myPassportsAllIds = Array.isArray(ids) ? ids.slice() : [];
      myPassportsTotal = myPassportsAllIds.length;
      myPassportsLoaded = myPassportsAllIds.slice(0, MY_PASSPORTS_LIMIT);
    } else {
      const offset = myPassportsLoaded.length;
      const more = myPassportsAllIds.slice(offset, offset + MY_PASSPORTS_LIMIT);
      myPassportsLoaded = myPassportsLoaded.concat(more);
    }

    if (myPassportsLoaded.length === 0) {
      el.innerHTML = `<p class="pl-empty">${esc(t("passport.list.empty"))}</p>`;
      if (row) row.style.display = "none";
      return;
    }

    const rows = await Promise.all(
      myPassportsLoaded.map(async (hid) => {
        try {
          const p = await contract.getPassport(hid);
          const ts = Number(p.timestamp) * 1000;
          const dateStr = ts ? new Date(ts).toLocaleDateString("en-GB", { year: "numeric", month: "short", day: "numeric" }) : "—";
          return { hid, objectType: p.objectType, dateStr };
        } catch {
          return { hid, objectType: "?", dateStr: "—" };
        }
      })
    );
    const vbase = "verify.html?id=";
    const showManage =
      typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration);
    el.innerHTML = `
      <div class="pl-table">
        ${rows
          .map(
            (r) => `
          <div class="pl-row">
            <div>
              <div class="pl-id">${esc(r.hid)}</div>
              <div class="pl-meta">${esc(r.objectType)} · ${esc(r.dateStr)}</div>
            </div>
            <div class="pl-actions">
              <a href="${vbase}${encodeURIComponent(r.hid)}">${esc(t("passport.list.verifyLink"))}</a>
              <button type="button" class="pl-url-btn" onclick='openPassportShareModal(${JSON.stringify(r.hid)})'>${esc(t("passport.list.share"))}</button>
              <button type="button" class="pl-url-btn" onclick='void downloadOdpDidForPassport(${JSON.stringify(r.hid)})'>${esc(t("passport.list.didDoc"))}</button>
              <button type="button" class="pl-url-btn" onclick='openPassportUrlEditor(${JSON.stringify(r.hid)})'>${esc(t("passport.list.urls"))}</button>
              ${
                showManage
                  ? `<a class="pl-url-btn" href="creator.html?${new URLSearchParams({ v03hid: r.hid }).toString()}" style="text-decoration:none;display:inline-block">${esc(t("passport.list.manageOps"))}</a>`
                  : ""
              }
            </div>
          </div>`
          )
          .join("")}
      </div>`;

    if (row && btn && meta && myPassportsTotal > MY_PASSPORTS_LIMIT) {
      row.style.display = "flex";
      meta.textContent = t("passport.list.pageMeta")
        .replace("{n}", String(myPassportsLoaded.length))
        .replace("{total}", String(myPassportsTotal));
      btn.disabled = myPassportsLoaded.length >= myPassportsTotal;
    } else if (row) {
      row.style.display = "none";
    }
  } catch (e) {
    el.innerHTML = `<div class="info e">${esc(e.message || String(e))}</div>`;
    if (btn) btn.disabled = false;
  }
}

async function initNetPill() {
  const dot = document.getElementById("netDot");
  const label = document.getElementById("netLabel");
  if (!dot || !label) return;
  label.textContent = NET.name + " — …";
  for (const rpcUrl of POLYGON_RPC_FALLBACKS) {
    try {
      const p = new ethers.providers.JsonRpcProvider(rpcUrl, { name: "polygon", chainId: NET.chainId });
      await p.getBlockNumber();
      dot.className = "net-dot on";
      label.textContent = NET.name;
      return;
    } catch { /* try next */ }
  }
  dot.className = "net-dot off";
  label.textContent = NET.name + " — offline";
}

function closeUrlModal() {
  const m = document.getElementById("urlModal");
  if (m) m.classList.remove("open");
}

function openHostingJsonInfo() {
  const m = document.getElementById("hostingJsonInfoModal");
  if (m) m.classList.add("open");
}

function closeHostingJsonInfo() {
  const m = document.getElementById("hostingJsonInfoModal");
  if (m) m.classList.remove("open");
}

async function openPassportUrlEditor(humanId) {
  const errEl = document.getElementById("urlEditErr");
  if (errEl) errEl.innerHTML = "";
  try {
    const p = await contract.getPassport(humanId);
    document.getElementById("urlEditHid").value = humanId;
    document.getElementById("urlEditDataHash").value = p.dataHash;
    document.getElementById("urlEditDataUrl").value = p.dataUrl || "";
    document.getElementById("urlEditImageUrl").value = p.imageUrl || "";
    document.getElementById("urlModal").classList.add("open");
  } catch (e) {
    alert(esc(e.message || String(e)));
  }
}

async function submitPassportUrls() {
  const errEl = document.getElementById("urlEditErr");
  errEl.innerHTML = "";
  const humanId = document.getElementById("urlEditHid").value;
  const newData = document.getElementById("urlEditDataUrl").value.trim();
  const newImg = document.getElementById("urlEditImageUrl").value.trim();
  const confirmed = document.getElementById("urlEditDataHash").value;
  if (newData.length > 512 || newImg.length > 512) {
    errEl.innerHTML = `<div class="info e">${esc(t("passport.form.urlEdit.urlTooLong"))}</div>`;
    return;
  }
  const btn = document.getElementById("urlEditSubmit");
  btn.disabled = true;
  try {
    const tx = await contract.updatePassportUrls(humanId, newData, newImg, confirmed);
    errEl.innerHTML = `<div class="info n">${esc(t("passport.form.urlEdit.confirmWallet"))}</div>`;
    await tx.wait();
    closeUrlModal();
    await loadMyPassports(true);
  } catch (e) {
    errEl.innerHTML = `<div class="info e">${esc(e.message || String(e))}</div>`;
  } finally {
    btn.disabled = false;
  }
}

  return [
    ["artwork", "passport.form.catArtwork"],
    ["photography", "passport.form.catPhotography"],
    ["digital", "passport.form.catDigitalCarrier"],
    ["collectible", "passport.form.catCollectible"],
    ["document", "passport.form.catDocument"],
    ["object", "passport.form.catObject"],
  ].map(([v, k]) => `<option value="${v}">${esc(t(k))}</option>`).join("");
}
function htmlCategoryOptionsDigital() {
  return `<option value="digital">${esc(t("passport.form.catDigitalOnly"))}</option>`;
}
function defaultIssuerRoleFromCreatorId(cid) {
  const p =
    typeof odpPassportProfileTypeLetter === "function" ? odpPassportProfileTypeLetter(cid) : "";
  if (p === "B") return "brand";
  if (p === "P") return "proof_institution";
  if (p === "M") return "museum";
  return "individual";
}

function htmlSubtypeOptions() {
  return [
    ["image", "passport.form.subImage"],
    ["video", "passport.form.subVideo"],
    ["3d", "passport.form.sub3d"],
    ["audio", "passport.form.subAudio"],
    ["document", "passport.form.subDocument"],
    ["other", "passport.form.subOther"],
  ].map(([v, k]) => `<option value="${v}">${esc(t(k))}</option>`).join("");
}

function scrollToPassportSection(el) {
  if (!el) return;
  try {
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch {}
}

function scrollToElId(id) {
  scrollToPassportSection(document.getElementById(id));
}

function canShowPassportPmProof() {
  const letter =
    typeof odpPassportProfileTypeLetter === "function" ? odpPassportProfileTypeLetter(creatorId) : "";
  return (
    (letter === "P" || letter === "M") &&
    odpContractGeneration >= 2 &&
    contract &&
    typeof contract.submitProof === "function"
  );
}

function htmlPassportPmProofCard() {
  if (!canShowPassportPmProof()) return "";
  return `
    <div class="card" style="margin-top:16px">
      <div class="card-head">${esc(t("passport.pmProof.cardTitle"))}</div>
      <div class="card-body">
        <div class="pm-proof-layout">
          <div class="pm-proof-callout info warn">
            <strong>${esc(t("passport.pmProof.calloutTitle"))}</strong>
            ${esc(t("passport.pmProof.calloutBody"))}
          </div>
          <p class="pm-proof-lead">${esc(t("passport.pmProof.body"))}</p>
          <p class="pm-proof-mint-note fhint">${esc(t("passport.pmProof.mintFootnote"))}</p>

          <div class="pm-proof-section">

function activatePassportTool(tool, updateUrl) {
  let slug = String(tool ?? "").trim();
  const q = new URLSearchParams(window.location.search);
  const qTool = (q.get("tool") || "").trim();
  if (!slug) {
    if ((q.get("tool") || "").trim() === "mint") slug = "mint";
  }
  if (updateUrl) {
    const u = new URL(window.location.href);
    if (slug === "mint") u.searchParams.set("tool", "mint");
    else u.searchParams.delete("tool");
    try {
      window.history.replaceState({}, "", u.toString());
    } catch {}
  }

  const mintSec = document.getElementById("passportMintWorkspace");
  const menu = document.getElementById("passportToolsMenu");
  const subnav = document.getElementById("passportToolSubnav");
  const subTitle = document.getElementById("passportToolSubnavTitle");

  if (slug !== "mint") {
    if (subnav) subnav.style.display = "none";
    if (menu) menu.hidden = false;
    if (mintSec) mintSec.hidden = true;
    scrollToPassportSection(document.getElementById("passportToolsMenu") || document.getElementById("passportToolsHeading"));
    return;
  }
  if (menu) menu.hidden = true;
  if (subnav) subnav.style.display = "";
  if (subTitle) subTitle.textContent = t("passport.tools.mintSubnavTitle");
  if (mintSec) mintSec.hidden = false;
  scrollToPassportSection(mintSec);
}

const PM_PROOF_ZERO32 = "0x" + "0".repeat(64);

async function pmProofSha256FileToBytes32(file) {
  const buf = await file.arrayBuffer();
  const d = await crypto.subtle.digest("SHA-256", buf);
  return "0x" + [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function bindPMProofHandlers() {
  const humanIn = document.getElementById("pmProofHumanId");
  const noteFile = document.getElementById("pmProofNoteFile");
  const noteFileDrop = document.getElementById("pmProofNoteFileDrop");
  const noteUrlIn = document.getElementById("pmProofNoteUrl");
  const noteHashEl = document.getElementById("pmProofNoteHash");
  const submitBtn = document.getElementById("pmProofSubmitBtn");
  const refreshBtn = document.getElementById("pmProofRefreshBtn");
  const submitResult = document.getElementById("pmProofSubmitResult");
  const listEl = document.getElementById("pmProofList");
  if (!contract || !creatorId || !humanIn || !submitBtn || !listEl) return;

  function syncPmProofFileDropEmpty() {
    const drop = noteFileDrop || document.getElementById("pmProofNoteFileDrop");
    const dropText = drop && drop.querySelector(".fdrop-text");
    if (noteHashEl) noteHashEl.textContent = "";
    if (drop) drop.classList.remove("has-file");
    if (dropText) {
      dropText.innerHTML =
        "<span>" +
        esc(t("passport.pmProof.noteFileDrop1")) +
        '</span><br><span style="font-size:11px;opacity:0.6">' +
        esc(t("passport.pmProof.noteFileDrop2")) +
        "</span>";
    }
  }

  async function refreshList() {
    listEl.textContent = "…";
    try {
      const ids = await contract.getProofsByInstitution(creatorId);
      const arr = Array.isArray(ids) ? ids : [];
      if (arr.length === 0) {
        listEl.textContent = t("passport.pmProof.listEmpty");
        return;
      }
      const lines = [];
      for (const pid of arr) {
        try {
          const pr = await contract.getProof(pid);
          const nh =
            pr && pr.noteHash != null && typeof ethers !== "undefined"
              ? ethers.utils.hexlify(pr.noteHash)
              : String((pr && pr.noteHash) || "");
          const ts = pr && pr.timestamp != null ? Number(pr.timestamp) * 1000 : 0;
          const when = ts ? new Date(ts).toLocaleString() : "—";
          lines.push(
            `${pid}\n  ${t("passport.pmProof.listPassport")} ${pr.humanId}\n  ${t("passport.pmProof.listWhen")} ${when}\n  noteHash: ${nh}\n  noteUrl: ${(pr && pr.noteUrl) || "—"}\n`
          );
        } catch {
          lines.push(String(pid) + "\n");
        }
      }
      listEl.textContent = lines.join("\n");
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      listEl.textContent = m;
    }
  }

  if (noteFile) {
    noteFile.addEventListener("change", async () => {
      const f = noteFile.files && noteFile.files[0];
      const drop = noteFileDrop || document.getElementById("pmProofNoteFileDrop");
      const dropText = drop && drop.querySelector(".fdrop-text");
      if (!f) {
        syncPmProofFileDropEmpty();
        return;
      }
      try {
        const h = await pmProofSha256FileToBytes32(f);
        if (noteHashEl) noteHashEl.textContent = t("passport.pmProof.noteHashComputed") + " " + h;
        if (drop) drop.classList.add("has-file");
        if (dropText) {
          var sz = f.size || 0;
          var szStr =
            sz < 1024
              ? sz + " B"
              : sz < 1048576
                ? (sz / 1024).toFixed(1) + " KB"
                : (sz / 1048576).toFixed(1) + " MB";
          dropText.innerHTML =
            "<span>" +
            esc(f.name || t("passport.pmProof.noteFileLabel")) +
            '</span><br><span style="font-size:11px;opacity:0.6">' +
            esc(szStr) +
            "</span>";
        }
      } catch {
        if (noteFile) noteFile.value = "";
        syncPmProofFileDropEmpty();
      }
    });
  }

  if (refreshBtn) {
    refreshBtn.addEventListener("click", () => {
      void refreshList();
    });
  }
  void refreshList();

  submitBtn.addEventListener("click", async () => {
    if (!contract) return;
    submitResult.innerHTML = "";
    const humanId = humanIn.value ? String(humanIn.value).trim() : "";
    const nowPm = new Date();
    const year = nowPm.getFullYear();
    const month = nowPm.getMonth() + 1;
    const noteUrl = noteUrlIn && noteUrlIn.value ? String(noteUrlIn.value).trim() : "";
    let noteHash = PM_PROOF_ZERO32;
    const f = noteFile && noteFile.files && noteFile.files[0];
    if (f) {
      try {
        noteHash = await pmProofSha256FileToBytes32(f);
      } catch (e) {
        submitResult.innerHTML = `<div class="info error">${esc(e.message || String(e))}</div>`;
        return;
      }
    }
    if (!humanId || !/^ODP-/i.test(humanId)) {
      submitResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.needHumanId"))}</div>`;
      return;
    }
    if (noteUrl.length > 512) {
      submitResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.urlTooLong"))}</div>`;
      return;
    }
    if (noteHash === PM_PROOF_ZERO32 && noteUrl.length > 0) {
      submitResult.innerHTML = `<div class="info warn">${esc(t("passport.pmProof.urlNeedsHash"))}</div>`;
      return;
    }
    submitBtn.disabled = true;
    submitResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.sending"))}</div>`;
    try {
      const tx = await contract.submitProof(humanId, noteHash, noteUrl, year, month);
      await tx.wait();
      submitResult.innerHTML = `<div class="info neutral">${esc(t("passport.pmProof.done"))} <code class="mono">${esc(tx.hash)}</code></div>`;
      if (noteFile) noteFile.value = "";
      if (noteUrlIn) noteUrlIn.value = "";
      syncPmProofFileDropEmpty();
      await refreshList();
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      submitResult.innerHTML = `<div class="info error">${esc(m)}</div>`;
    }
    submitBtn.disabled = false;
  });
}

async function updatePassportMintsRow() {
  const el = document.getElementById("passportMintsRow");
  if (!el || !contract || !wallet) return;
  if (
    typeof odpSupportsFolderBaseMint !== "function" ||
    !odpSupportsFolderBaseMint(odpContractGeneration) ||
    typeof contract.getRemainingMints !== "function"
  ) {
    el.style.display = "none";
    el.innerHTML = "";
    return;
  }
  el.style.display = "block";
  try {
    const remBn = await contract.getRemainingMints(wallet);
    const remN = remBn && typeof remBn.toNumber === "function" ? remBn.toNumber() : Number(remBn);
    const maxU32 = 4294967295;
    const prefix =
      typeof odpPassportProfileTypeLetter === "function" ? odpPassportProfileTypeLetter(creatorId) : "";
    if (remN === maxU32 || prefix === "P" || prefix === "M") {
      el.innerHTML = `<div class="info n" style="padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.55">${esc(t("passport.mints.unlimited"))}</div>`;
      return;
    }
    let limN = null;
    try {
      if (prefix === "B" && typeof contract.MONTHLY_LIMIT_B === "function") {
        const L = await contract.MONTHLY_LIMIT_B();
        limN = L && typeof L.toNumber === "function" ? L.toNumber() : Number(L);
      } else if (typeof contract.MONTHLY_LIMIT_C === "function") {
        const L = await contract.MONTHLY_LIMIT_C();
        limN = L && typeof L.toNumber === "function" ? L.toNumber() : Number(L);
      }
    } catch {
      limN = null;
    }
    if (limN != null && !isNaN(limN)) {
      el.innerHTML = `<div class="info n" style="padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.55">${esc(
        t("passport.mints.remaining").replace("{rem}", String(remN)).replace("{limit}", String(limN))
      )}</div>`;
    } else {
      el.innerHTML = `<div class="info n" style="padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.55">${esc(
        t("passport.mints.remainingSimple").replace("{rem}", String(remN))
      )}</div>`;
    }
  } catch (e) {
    el.innerHTML = `<div class="info w" style="font-size:12px">${esc(e.message || String(e))}</div>`;
  }
}

// ── Build passport JSON ───────────────────────────────────────────────────────

function v(id) { const el=document.getElementById(id); return el?el.value.trim():""; }

/** Normalize folder root: https, no trailing slash (for joining). */
function normalizeBaseUrl(raw) {
  let s = String(raw || "").trim();
  if (!s) return "";
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try {
    const u = new URL(s);
    if (u.protocol !== "http:" && u.protocol !== "https:") return "";
    let out = u.origin + u.pathname;
    out = out.replace(/\/+$/, "");
    return out;
  } catch {
    return "";
  }
}

/** Final on-chain dataUrl when using folder hosting — hosts the .odpass ZIP (Verify reads passport.json inside). */
function joinPassportBundleUrl(baseNormalized, humanId) {
  return `${baseNormalized}/${humanId}.odpass`;
}

/**
 * Wall-clock instant at mint (second precision) + IANA zone; `registeredAt` stays Unix UTC seconds.
 */
function buildRegistrationClock(now) {
  const registeredAt = Math.floor(now.getTime() / 1000);
  const pad = function (n) {
    return String(n).padStart(2, "0");
  };
  const y = now.getFullYear();
  const mo = pad(now.getMonth() + 1);
  const da = pad(now.getDate());
  const h = pad(now.getHours());
  const mi = pad(now.getMinutes());
  const s = pad(now.getSeconds());
  const offMin = -now.getTimezoneOffset();
  const sign = offMin >= 0 ? "+" : "-";
  const a = Math.abs(offMin);
  const oh = pad(Math.floor(a / 60));
  const om = pad(a % 60);
  const localIso8601 = y + "-" + mo + "-" + da + "T" + h + ":" + mi + ":" + s + sign + oh + ":" + om;
  const utcIso8601 =
    now.getUTCFullYear() +
    "-" +
    pad(now.getUTCMonth() + 1) +
    "-" +
    pad(now.getUTCDate()) +
    "T" +
    pad(now.getUTCHours()) +
    ":" +
    pad(now.getUTCMinutes()) +
    ":" +
    pad(now.getUTCSeconds()) +
    "Z";
  let ianaTimeZone = "UTC";
  try {
    ianaTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  } catch (e0) {}
  return {
    registeredAt: registeredAt,
    registration: { ianaTimeZone: ianaTimeZone, localIso8601: localIso8601, utcIso8601: utcIso8601 },
  };
}

function buildPassport(humanId) {
  const now = new Date();
  const useV03 = typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration);
  const roleFromCreatorId = defaultIssuerRoleFromCreatorId(creatorId);
  const issuerRole = roleFromCreatorId;
  const clock = buildRegistrationClock(now);
  const p = {
    version: useV03 ? "0.3" : "0.2",
    passportId:humanId||null,
    objectType: objType,
    type: v("f_type"),
    title: v("f_title"),
    issuerRole: issuerRole,
    creator: { name:v("f_name"), wallet, creatorId },
    year: parseInt(v("f_year")), month: now.getMonth()+1,
    registeredAt: clock.registeredAt,
    registration: clock.registration,
  };

  if (objType==="physical") {
    const med=v("f_medium"), mat=v("f_mat"), en=v("f_edn"), et=v("f_edt"), desc=v("f_desc");
    if (med) p.medium = med;
    if (mat) p.materials = mat.split(",").map(m=>({name:m.trim()})).filter(m=>m.name);
    if (en&&et) p.edition = {number:parseInt(en),total:parseInt(et)};
    if (desc) p.description = desc;

    const seal = {};
    if (sealType===1||sealType===3) {
      seal.nfc = { uid:v("f_nuid"), publicKey:v("f_nkey"), model:v("f_nmod"), installedAt:v("f_ndate") };
      const nn=v("f_nnotes"); if(nn) seal.nfc.notes=nn;
    }
    if (sealType===2||sealType===3) {
      seal.numbered = { number:v("f_snum"), type:v("f_stype") };
      const sc=v("f_scol"),ss=v("f_ssz"),sn=v("f_snotes");
      if(sc) seal.numbered.color=sc; if(ss) seal.numbered.size=ss; if(sn) seal.numbered.notes=sn;
    }
    p.seal = seal;
  } else {
    const desc=v("f_desc"), fmt=v("f_fmt");
    const c2paManifestRaw = v("f_c2pa_manifest_hash");
    const c2paManifestLabel = v("f_c2pa_manifest_label");
    // Passport JSON: "sha256:hex" — matches mint.py; chain uses fileHashBytes32
    const dig = { subtype:v("f_sub"), fileHash: "sha256:"+fileHashBytes32.slice(2) };
    if (fmt) dig.format = fmt;
    if (fileSize) dig.fileSize = fileSize;
    const c2paManifestNorm = normalizeSha256Text(c2paManifestRaw);
    if (c2paManifestNorm || c2paManifestLabel) {
      dig.c2pa = {};
      if (c2paManifestNorm) dig.c2pa.manifestHash = c2paManifestNorm;
      if (c2paManifestLabel) dig.c2pa.activeManifest = c2paManifestLabel;
    }
    p.digital = dig;
    if (desc) p.description = desc;
  }

  imageUrl = v("f_imgUrl");
  // JSON field matches mint.py: f"sha256:{hex}"; on-chain still uses 0x bytes32 (imageHash)
  if (imageHash!==ZERO32) p.image = { url:imageUrl, hash: "sha256:"+imageHash.slice(2) };
  if (useV03) {
    const extras = [];
    if (imageHash2 !== ZERO32) extras.push({ url: v("f_imgUrl2"), hash: "sha256:" + imageHash2.slice(2) });
    if (imageHash3 !== ZERO32) extras.push({ url: v("f_imgUrl3"), hash: "sha256:" + imageHash3.slice(2) });
    if (extras.length) p.images = extras;
    const dw = v("f_dim_w"),
      dh = v("f_dim_h");
    if (dw && dh) {
      const du = v("f_dim_unit") || "cm";
      p.dimensions = { width: Number(dw), height: Number(dh), unit: du };
    }
    const wv = v("f_weight");
    if (wv) p.weight = { value: Number(wv), unit: v("f_weight_unit") || "kg" };
    const dpt = v("f_depth");
    if (dpt) p.depth = { value: Number(dpt), unit: v("f_depth_unit") || "cm" };
    const cdate = v("f_creation_date");
    if (cdate) p.creationDate = cdate;
    const lprice = v("f_listing_price");
    if (lprice) p.listingPrice = lprice;
    const itag = v("f_internal_tag");
    if (itag) p.internalTag = itag;
  }
  return p;
}

function normalizeNFC(obj) {
  // Unicode NFC normalization — must match Python unicodedata.normalize("NFC", s)
  if (typeof obj === "string") return obj.normalize("NFC");
  if (Array.isArray(obj))      return obj.map(normalizeNFC);
  if (obj !== null && typeof obj === "object") {
    return Object.fromEntries(Object.entries(obj).map(([k,v]) => [k, normalizeNFC(v)]));
  }
  return obj;
}

function normalizeSha256Text(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  if (/^sha256:[a-fA-F0-9]{64}$/.test(s)) return "sha256:" + s.slice(7).toLowerCase();
  if (/^0x[a-fA-F0-9]{64}$/.test(s)) return "sha256:" + s.slice(2).toLowerCase();
  return "";
}

function sortKeysDeep(obj) {
  if (Array.isArray(obj)) return obj.map(sortKeysDeep);
  if (obj !== null && typeof obj === "object") {
    return Object.keys(obj).sort().reduce((acc, k) => {
      acc[k] = sortKeysDeep(obj[k]);
      return acc;
    }, {});
  }
  return obj;
}

/** Same string as hashed for on-chain dataHash (SPEC: NFC → sort keys → stringify). */
function canonicalJsonString(o) {
  return JSON.stringify(sortKeysDeep(normalizeNFC(o)));
}

async function sha256obj(o) {
  const canonical = canonicalJsonString(o);
  const buf = new TextEncoder().encode(canonical);
  const h   = await crypto.subtle.digest("SHA-256", buf);
  return "0x"+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function validate() {
  if (!v("f_title"))   return t("passport.form.validateTitle");
  if (!v("f_name"))    return t("passport.form.validateName");
  if (
    (imageHash2 !== ZERO32 || imageHash3 !== ZERO32) &&
    imageHash === ZERO32
  ) {
    return "Add the primary preview image before additional images (v0.3).";
  }
  const skip =
    odpSupportsOptionalDataUrl(odpContractGeneration) && document.getElementById("f_skip_public_url")?.checked === true;
  if (!skip) {
    const useFolder = document.getElementById("f_use_folder")?.checked !== false;
    if (useFolder) {
      if (!normalizeBaseUrl(v("f_urlBase"))) return t("passport.form.validateFolderUrl");
    } else if (!v("f_url")) {
      return t("passport.form.validateJsonUrl");
    }
  }
  if (objType==="digital" && fileHashBytes32===ZERO32) return t("passport.form.validateDigitalFile");
  if (objType==="digital") {
    const c2 = v("f_c2pa_manifest_hash");
    if (c2 && !normalizeSha256Text(c2)) return "C2PA manifest hash must be sha256:... or 0x... (32 bytes).";
  }
  if (objType==="physical") {
    if ((sealType===1||sealType===3) && (!v("f_nuid")||!v("f_nkey"))) return t("passport.form.validateNfc");
    if ((sealType===2||sealType===3) && (!v("f_snum")||!v("f_stype"))) return t("passport.form.validateSeal");
  }
  if (typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)) {
    const auxRaw = (document.getElementById("f_aux_hash") && document.getElementById("f_aux_hash").value || "").trim();
    const auxU = (document.getElementById("f_aux_uri") && document.getElementById("f_aux_uri").value || "").trim();
    if (auxU.length > 512) return "Auxiliary URI must be at most 512 characters.";
    if (!auxRaw && auxU) return "Set an auxiliary commitment hash, or clear the auxiliary URL.";
    if (auxRaw) {
      const norm = auxRaw.startsWith("0x") ? auxRaw : "0x" + auxRaw;
      if (!/^0x[a-fA-F0-9]{64}$/.test(norm)) return "Auxiliary hash must be 32 bytes (0x + 64 hex).";
    }
  }
  return null;
}

/** Legacy deployments: second tx to fix `dataUrl` after Passport ID is known; retry without artificial delay. */
async function updatePassportUrlsWithRetry(humanId, registeredDataUrl, imgU_, dataHash_) {
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const tx2 = await contract.updatePassportUrls(humanId, registeredDataUrl, imgU_, dataHash_);
      await tx2.wait();
      const p = await contract.getPassport(humanId);
      if (p.dataUrl === registeredDataUrl) return;
      lastErr = new Error("On-chain dataUrl mismatch after updatePassportUrls");
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

async function executeMint() {
  const errEl = document.getElementById("formErr");
  errEl.innerHTML = "";
  const err = validate();
  if (err) { errEl.innerHTML=`<div class="info e" style="margin-top:12px">${esc(err)}</div>`; return; }

  /** Snapshot at hash time — must be the exact bytes later written to .odpass (only passportId changes). Re-building after tx.wait() would shift registration timestamps and break Verify. */
  const passportForHash = buildPassport(null);
  const dataHash_ = await sha256obj(passportForHash);
  const imgH_     = imageHash;
  const imgU_     = imageUrl;
  const imgEx =
    typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)
      ? [
          imageHash2 !== ZERO32 ? imageHash2 : ethers.constants.HashZero,
          v("f_imgUrl2") || "",
          imageHash3 !== ZERO32 ? imageHash3 : ethers.constants.HashZero,
          v("f_imgUrl3") || "",
        ]
      : [];
  const now       = new Date();
  const year      = parseInt(v("f_year"));
  const month     = now.getMonth()+1;
  const skip =
    odpSupportsOptionalDataUrl(odpContractGeneration) && document.getElementById("f_skip_public_url")?.checked === true;
  const useFolder = document.getElementById("f_use_folder")?.checked !== false;
  const baseNorm  = useFolder ? normalizeBaseUrl(v("f_urlBase")) : "";
  let dataUrlForMint;
  let dataUrlIsFolderBase = false;
  if (skip) {
    dataUrlForMint = "";
    dataUrlIsFolderBase = false;
  } else if (odpSupportsFolderBaseMint(odpContractGeneration)) {
    if (useFolder) {
      dataUrlForMint = baseNorm;
      dataUrlIsFolderBase = true;
    } else {
      dataUrlForMint = v("f_url");
    }
  } else {
    dataUrlForMint = useFolder
      ? `${baseNorm}/odp-mint-pending-${Date.now()}.odpass`
      : v("f_url");
  }

  let sealHash_ = ZERO32;
  let nfcBytes  = new Uint8Array(0);

  if (objType==="physical" && passportForHash.seal) {
    sealHash_ = await sha256obj(passportForHash.seal);
    if ((sealType===1||sealType===3) && v("f_nkey")) {
      try { nfcBytes = ethers.utils.arrayify("0x"+v("f_nkey").replace(/^0x/,"")); } catch {}
    }
  }

  let auxCommitmentHash = ZERO32;
  let auxCommitmentUri = "";
  if (typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)) {
    const rawAux = (document.getElementById("f_aux_hash") && document.getElementById("f_aux_hash").value || "").trim();
    auxCommitmentUri = (document.getElementById("f_aux_uri") && document.getElementById("f_aux_uri").value || "").trim();
    if (rawAux) {
      try {
        auxCommitmentHash = ethers.utils.hexlify(ethers.utils.arrayify(rawAux.startsWith("0x") ? rawAux : "0x" + rawAux));
      } catch {
        auxCommitmentHash = ZERO32;
        auxCommitmentUri = "";
      }
    } else {
      auxCommitmentUri = "";
    }
  }

  document.getElementById("app").innerHTML = `
    <div style="text-align:center;padding:48px 0">
      <div style="width:40px;height:40px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px"></div>
      <div style="font-family:var(--serif);font-size:20px;font-style:italic;margin-bottom:8px">${esc(t("passport.form.mintWaiting"))}</div>
      <div style="font-size:12px;color:var(--text2)">${esc(t("passport.form.mintConfirmWallet"))}</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  try {
    let passportIdsBeforeMint = [];
    try {
      passportIdsBeforeMint = await contract.getPassportsByCreator(wallet);
    } catch {
      passportIdsBeforeMint = [];
    }

    let tx;
    if (objType==="physical") {
      const nfcModelStr = (sealType===1||sealType===3) ? "NTAG424DNA_TT" : "";
      if (odpSupportsFolderBaseMint(odpContractGeneration)) {
        tx = await contract.mintPhysical(
          year,month,dataHash_,dataUrlForMint,imgH_,imgU_,
          sealType,sealHash_,nfcBytes,nfcModelStr,
          ...imgEx,
          dataUrlIsFolderBase,
          ...(typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)
            ? [auxCommitmentHash, auxCommitmentUri, ""]
            : []),
          mintTxOpts()
        );
      } else {
        tx = await contract.mintPhysical(
          year,month,dataHash_,dataUrlForMint,imgH_,imgU_,
          sealType,sealHash_,nfcBytes,nfcModelStr,
          ...imgEx,
          ...(typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)
            ? [auxCommitmentHash, auxCommitmentUri, ""]
            : []),
          mintTxOpts()
        );
      }
    } else if (odpSupportsFolderBaseMint(odpContractGeneration)) {
      tx = await contract.mintDigital(
        year,month,dataHash_,dataUrlForMint,imgH_,imgU_,
        ...imgEx,
        fileHashBytes32,dataUrlIsFolderBase,
        ...(typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)
          ? [auxCommitmentHash, auxCommitmentUri, ""]
          : []),
        mintTxOpts()
      );
    } else {
      tx = await contract.mintDigital(
        year,month,dataHash_,dataUrlForMint,imgH_,imgU_,
        ...imgEx,
        fileHashBytes32,
        ...(typeof odpSupportsV03 === "function" && odpSupportsV03(odpContractGeneration)
          ? [auxCommitmentHash, auxCommitmentUri, ""]
          : []),
        mintTxOpts()
      );
    }

    document.getElementById("app").innerHTML = `
      <div style="text-align:center;padding:48px 0">
        <div style="width:40px;height:40px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px"></div>
        <div style="font-family:var(--serif);font-size:20px;font-style:italic;margin-bottom:8px">${esc(t("passport.form.mintConfirming"))}</div>
        <div style="font-size:12px;color:var(--text2)">${tx.hash.slice(0,24)}…</div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

    const receipt = await tx.wait();

    const iface = new ethers.utils.Interface(ABI);
    function humanIdFromMintReceiptLogs(logs) {
      for (const log of logs || []) {
        try {
          const parsed = iface.parseLog(log);
          if (parsed.name === "PassportMinted" && parsed.args && parsed.args.humanId) {
            return String(parsed.args.humanId);
          }
        } catch {
          /* wrong log shape / not our event */
        }
      }
      return null;
    }

    let humanId = humanIdFromMintReceiptLogs(receipt.logs);
    let humanIdSource = humanId ? "receipt_logs" : null;

    if (!humanId && provider && tx && tx.hash) {
      for (let attempt = 0; attempt < 5 && !humanId; attempt++) {
        if (attempt > 0) await new Promise((r) => setTimeout(r, 280));
        try {
          const rec2 = await provider.getTransactionReceipt(tx.hash);
          humanId = humanIdFromMintReceiptLogs(rec2 && rec2.logs);
          if (humanId) humanIdSource = "receipt_refetch";
        } catch {
          /* RPC flake */
        }
      }
    }

    if (!humanId) {
      try {
        const after = await contract.getPassportsByCreator(wallet);
        const beforeSet = new Set(passportIdsBeforeMint || []);
        const newcomers = (after || []).filter((id) => id && !beforeSet.has(id));
        if (newcomers.length >= 1) {
          humanId = newcomers[newcomers.length - 1];
          humanIdSource = "list_diff";
        }
      } catch {
        /* fall through */
      }
    }

    let registeredDataUrl = dataUrlForMint;
    if (!humanId) throw new Error(t("passport.form.mintReadHumanId"));

    if (odpSupportsFolderBaseMint(odpContractGeneration) && dataUrlIsFolderBase) {
      registeredDataUrl = joinPassportBundleUrl(baseNorm, humanId);
    } else if (!skip && !odpSupportsFolderBaseMint(odpContractGeneration) && useFolder && baseNorm) {
      registeredDataUrl = joinPassportBundleUrl(baseNorm, humanId);
      document.getElementById("app").innerHTML = `
        <div style="text-align:center;padding:48px 0">
          <div style="width:40px;height:40px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px"></div>
          <div style="font-family:var(--serif);font-size:20px;font-style:italic;margin-bottom:8px">${esc(t("passport.form.mintRegisteringUrl"))}</div>
          <div style="font-size:12px;color:var(--text2)">${esc(t("passport.form.mintSecondConfirm"))}</div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
      try {
        await updatePassportUrlsWithRetry(humanId, registeredDataUrl, imgU_, dataHash_);
      } catch (e2) {
        const want = esc(registeredDataUrl);
        document.getElementById("app").innerHTML = `<div class="info w" style="max-width:440px;margin:24px auto;line-height:1.6">
          ${esc(t("passport.form.mintUrlFail"))}<br><br>
          <code style="font-size:11px;word-break:break-all">${want}</code><br><br>
          ${esc(e2.message || String(e2))}
        </div>
        <div style="text-align:center;margin-top:16px"><button class="btn" onclick="renderForm()">${esc(t("passport.form.mintBackForm"))}</button></div>`;
        return;
      }
    }

    // dataHash on-chain is sha256(passportForHash). Bundle JSON = same object + real passportId (verify minify maps ID → null to match hash).
    const passportOut = JSON.parse(JSON.stringify(passportForHash));
    passportOut.passportId = humanId;
    const finalJson = canonicalJsonString(passportOut);
    showSuccess(humanId, tx.hash, finalJson, passportForHash.title, registeredDataUrl, {
      txHash: tx.hash,
      dataHash: dataHash_,
      imageHash: imgH_,
      imageHash2: imageHash2,
      imageHash3: imageHash3,
      fileHash: fileHashBytes32,
      originalFile: selectedOriginalFile,
      imageFile: selectedImageFile,
      imageFile2: selectedImageFile2,
      imageFile3: selectedImageFile3,
    });

  } catch(e) {
    document.getElementById("app").innerHTML = `<div class="info e">${esc(e.message)}</div>`;
    setTimeout(renderForm, 3000);
  }
}

function safeFilePart(s) {
  return String(s).replace(/[^\w.-]+/g, "_").slice(0, 96);
}

/** `.odpass` byte files live under `originals/`; `role` prefix keeps basenames unique (SPEC §15). */
function odpOriginalsBundleRelPath(role, filename) {
  const r = String(role || "file").replace(/[^\w-]+/g, "");
  const base = safeFilePart(filename || "file");
  return `originals/${r}__${base}`;
}

/** SPEC §18.2 — minimal did:odp passport DID document (off-chain export). */
function buildOdpDidDocument({ humanId, creatorAddress, creatorProfileId, dataUrl }) {
  const hid = String(humanId || "").trim();
  const did = `did:odp:passport:${hid}`;
  const raw = String(creatorAddress || "").trim();
  let checksummed = raw;
  try {
    if (raw && /^0x[a-fA-F0-9]{40}$/i.test(raw) && typeof ethers !== "undefined" && ethers.utils && ethers.utils.getAddress) {
      checksummed = ethers.utils.getAddress(raw);
    }
  } catch {
    checksummed = raw;
  }
  const chainId = Number(NET.chainId || 137);
  const caip10 =
    checksummed && /^0x[a-fA-F0-9]{40}$/i.test(checksummed)
      ? `eip155:${chainId}:${checksummed}`
      : null;
  const alsoKnownAs = [];
  const du = String(dataUrl || "").trim();
  if (du) alsoKnownAs.push(du);
  try {
    alsoKnownAs.push(getVerifyAbsoluteUrl(hid));
  } catch {
    /* ignore */
  }
  const vmId = `${did}#ethereum`;
  const doc = {
    "@context": ["https://www.w3.org/ns/did/v1"],
    id: did,
  };
  if (caip10) {
    doc.verificationMethod = [
      {
        id: vmId,
        type: "EcdsaSecp256k1VerificationKey2019",
        controller: did,
        blockchainAccountId: caip10,
      },
    ];
    doc.authentication = [vmId];
    doc.assertionMethod = [vmId];
  }
  if (alsoKnownAs.length) doc.alsoKnownAs = alsoKnownAs;
  doc.odp = {
    chainId,
    contract: String(NET.contract || ""),
    creatorProfileId: String(creatorProfileId || ""),
  };
  return doc;
}

function downloadJsonBlob(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename || "document.json";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 2500);
}

async function downloadOdpDidForPassport(humanId) {
  if (!contract) return;
  try {
    const p = await contract.getPassport(humanId);
    const doc = buildOdpDidDocument({
      humanId,
      creatorAddress: p.creator,
      creatorProfileId: p.creatorId,
      dataUrl: p.dataUrl || "",
    });
    downloadJsonBlob(doc, `${safeFilePart(humanId)}-did-document.json`);
  } catch (e) {
    alert(esc(e.message || String(e)));
  }
}

async function shareOdpVerify({ title, text, url, fullText }) {
  const body = fullText || `${text}\n\n${url}`;
  try {
    if (navigator.share) {
      await navigator.share({ title, text: body, url });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  try {
    await navigator.clipboard.writeText(body);
    alert(t("passport.form.alerts.copied"));
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      alert(t("passport.form.alerts.linkCopied"));
    } catch {
      prompt("Copy:", body);
    }
  }
}

/** qrcodejs: SPEC short `odp://` / `odpc://` uses ECC Q; longer text uses L; fallback = same primary URI. */
function renderOdpQr(el, primaryText, fallbackUrl) {
  if (!el) return;
  el.innerHTML = "";
  if (typeof QRCode === "undefined") {
    el.innerHTML = `<div class="qr-fail">${esc(t("passport.form.qrFail"))}<br><a href="${esc(fallbackUrl)}">${esc(fallbackUrl)}</a></div>`;
    return;
  }
  const w = 168;
  const h = 168;
  const cl =
    QRCode.CorrectLevel && QRCode.CorrectLevel.L !== undefined
      ? QRCode.CorrectLevel.L
      : QRCode.CorrectLevel && QRCode.CorrectLevel.M !== undefined
        ? QRCode.CorrectLevel.M
        : undefined;
  const make = (t, useCl, eccOverride) => {
    el.innerHTML = "";
    const o = {
      text: t,
      width: w,
      height: h,
      colorDark: "#000",
      colorLight: "#fff",
    };
    const ecc =
      eccOverride !== undefined
        ? eccOverride
        : useCl !== false && cl !== undefined
          ? cl
          : undefined;
    if (ecc !== undefined) o.correctLevel = ecc;
    new QRCode(el, o);
  };
  const specShort =
    typeof primaryText === "string" &&
    primaryText.length < 120 &&
    (primaryText.startsWith("odp://") || primaryText.startsWith("odpc://")) &&
    QRCode.CorrectLevel &&
    QRCode.CorrectLevel.Q !== undefined
      ? QRCode.CorrectLevel.Q
      : null;
  try {
    make(primaryText, true, specShort !== null ? specShort : undefined);
  } catch (e1) {
    try {
      make(primaryText, false, specShort !== null ? specShort : undefined);
    } catch {
      try {
        make(fallbackUrl, true, specShort !== null ? specShort : undefined);
      } catch {
        try {
          make(fallbackUrl, false, specShort !== null ? specShort : undefined);
        } catch (e2) {
          el.innerHTML = `<div class="qr-fail">${esc(t("passport.form.qrGenFail"))} <a href="${esc(fallbackUrl)}">${esc(t("passport.form.qrOpenVerify"))}</a><br><span style="font-size:10px;color:var(--text3)">${esc(
            String((e2 && e2.message) || (e1 && e1.message) || "unknown")
          )}</span></div>`;
        }
      }
    }
  }
}

/** Returns true if the system share sheet completed successfully; false if Web Share with files is unavailable. */
async function trySharePassportOdpFile(humanId, json, bundleMeta) {
  const blob = await createPassportOdpBlob(humanId, json, bundleMeta);
  const filename = `${safeFilePart(humanId)}.odpass`;
  const file = new File([blob], filename, { type: "application/zip" });
  if (!navigator.canShare || !navigator.canShare({ files: [file] })) return false;
  await navigator.share({ files: [file], title: "ODPass bundle", text: filename });
  return true;
}

async function sharePassportOdpFile(humanId, json, bundleMeta) {
  try {
    const ok = await trySharePassportOdpFile(humanId, json, bundleMeta);
    if (ok) return;
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  await downloadPassportOdp(humanId, json, bundleMeta);
}

async function sha256HexFromBuffer(buf) {
  const d = await crypto.subtle.digest("SHA-256", buf);
  return "0x" + Array.from(new Uint8Array(d)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function blobDownloadOdp(humanId, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeFilePart(humanId)}.odpass`;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 2500);
}

/** SPEC §15 + §15.1.1 — `.odpass` ZIP: `originals/<role>__<file>` + `manifest.originals` paths; aligned with `tools/mint.py`. */
async function createPassportOdpBlob(humanId, json, bundleMeta) {
  if (typeof JSZip === "undefined") throw new Error("JSZip not loaded");
  const zip = new JSZip();
  zip.file("passport.json", json);
  const manifest = {
    format: "odpass-bundle",
    bundleVersion: "0.3",
    passportId: String(humanId || ""),
    createdAtUtc: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
    mode: "full",
    onChain: {
      dataHash: String((bundleMeta && bundleMeta.dataHash) || ""),
      imageHash: String((bundleMeta && bundleMeta.imageHash) || ZERO32),
      imageHash2: String((bundleMeta && bundleMeta.imageHash2) || ZERO32),
      imageHash3: String((bundleMeta && bundleMeta.imageHash3) || ZERO32),
      fileHash: String((bundleMeta && bundleMeta.fileHash) || ZERO32),
      txHash: String((bundleMeta && bundleMeta.txHash) || ""),
      chainId: Number(NET.chainId),
      contract: String(NET.contract || ""),
    },
    originals: {},
    files: [{ path: "passport.json", role: "passport", mime: "application/json" }],
  };
  if (bundleMeta && bundleMeta.originalFile) {
    const f = bundleMeta.originalFile;
    const rel = odpOriginalsBundleRelPath("digital", f.name);
    zip.file(rel, f);
    manifest.originals.fileHash = rel;
    const h = await sha256HexFromBuffer(await f.arrayBuffer());
    manifest.files.push({
      path: rel,
      role: "original",
      mime: String(f.type || "application/octet-stream"),
      sizeBytes: Number(f.size || 0),
      sha256: h,
    });
  }
  if (bundleMeta && bundleMeta.imageFile) {
    const f = bundleMeta.imageFile;
    const rel = odpOriginalsBundleRelPath("image", f.name);
    zip.file(rel, f);
    manifest.originals.imageHash = rel;
    const h = await sha256HexFromBuffer(await f.arrayBuffer());
    manifest.files.push({
      path: rel,
      role: "imageOriginal",
      mime: String(f.type || "application/octet-stream"),
      sizeBytes: Number(f.size || 0),
      sha256: h,
    });
  }
  if (bundleMeta && bundleMeta.imageFile2) {
    const f = bundleMeta.imageFile2;
    const rel = odpOriginalsBundleRelPath("image2", f.name);
    zip.file(rel, f);
    manifest.originals.imageHash2 = rel;
    const h = await sha256HexFromBuffer(await f.arrayBuffer());
    manifest.files.push({
      path: rel,
      role: "imageOriginal2",
      mime: String(f.type || "application/octet-stream"),
      sizeBytes: Number(f.size || 0),
      sha256: h,
    });
  }
  if (bundleMeta && bundleMeta.imageFile3) {
    const f = bundleMeta.imageFile3;
    const rel = odpOriginalsBundleRelPath("image3", f.name);
    zip.file(rel, f);
    manifest.originals.imageHash3 = rel;
    const h = await sha256HexFromBuffer(await f.arrayBuffer());
    manifest.files.push({
      path: rel,
      role: "imageOriginal3",
      mime: String(f.type || "application/octet-stream"),
      sizeBytes: Number(f.size || 0),
      sha256: h,
    });
  }
  zip.file("manifest.json", JSON.stringify(manifest, null, 2));
  return zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
}

async function downloadPassportOdp(humanId, json, bundleMeta) {
  const blob = await createPassportOdpBlob(humanId, json, bundleMeta);
  blobDownloadOdp(humanId, blob);
}

function fmtSz(b) {
  if (b<1024) return b+" B";
  if (b<1048576) return (b/1024).toFixed(1)+" KB";
  if (b<1073741824) return (b/1048576).toFixed(1)+" MB";
  return (b/1073741824).toFixed(2)+" GB";
}

document.addEventListener("DOMContentLoaded", async () => {
  await odpInitI18n({ page: "passport", pageTitleKey: "passport.meta.documentTitle" });
  await odpMergeRegistryConfigAsync(NET);
  const fv = document.getElementById("footerSiteVer");
  if (fv && typeof ODP_SITE_VERSION !== "undefined") fv.textContent = "site " + ODP_SITE_VERSION;
  const skipAuto = (() => {
    try { return sessionStorage.getItem(ODP_SKIP_WALLET_AUTOCONNECT) === "1"; } catch { return false; }
  })();
  const eth = injectedEthereum();
  if (eth) {
    odpInstallSingleAccountGuard(eth, {
      onMultiple: async function () {
        var r = await odpRequireSingleEthereumAccount(eth);
        walletConnectError = r.message || t("passport.multiAccount");
        await disconnectWallet();
      },
      onEmpty: async function () {
        await disconnectWallet();
      },
    });
    const acc = await eth.request({method:"eth_accounts"}).catch(()=>[]);
    if (!skipAuto && acc.length > 0) {
      if (acc.length > 1) {
        var br = await odpRequireSingleEthereumAccount(eth);
        walletConnectError = br.message;
      } else {
        odpWalletConnectInFlight = true;
        try {
          const net = NET;
          const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || "");
          await odpMergeRegistryConfigAsync(NET);
          if (!odpHasValidRegistryAddress(NET)) {
            provider = null;
            signer = null;
            contract = null;
            wallet = null;
            odpContractGeneration = null;
            ABI = null;
            walletConnectError = odpRegistryMisconfiguredBannerHtml(isLocal);
            walletConnectErrorNeutral = true;
          } else {
            await ensureWalletChain(eth, net);
            provider = new ethers.providers.Web3Provider(eth);
            signer = provider.getSigner();
            wallet = await signer.getAddress();
            const fin = await odpFinalizeWalletContract(net, signer, POLYGON_RPC_FALLBACKS, "passport");
            if (fin.legacyUnsupported) {
              provider = null;
              signer = null;
              contract = null;
              wallet = null;
              odpContractGeneration = null;
              ABI = null;
              walletConnectError = fin.message || (typeof ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG !== "undefined" ? ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG : "Legacy contract not supported.");
            } else {
              odpContractGeneration = fin.generation;
              ABI = fin.abi;
              contract = fin.contract;
              creatorId = await contract.getCreatorByWallet(wallet);
              if (creatorId) {
                renderForm();
                initNetPill();
                return;
              }
              document.getElementById("app").innerHTML = `
      <div class="info w" style="text-align:center">
        ${esc(t("passport.noCreator.title"))}<br>
        <a href="creator.html" style="color:var(--accent)">${esc(t("passport.noCreator.link"))}</a>
      </div>`;
              initNetPill();
              return;
            }
          }
        } catch (e) {
          console.warn("Auto-connect failed:", e);
        } finally {
          odpWalletConnectInFlight = false;
        }
      }
    }
  }
  connect();
  initNetPill();
});
