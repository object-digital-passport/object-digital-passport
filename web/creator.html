  "https://polygon-bor.publicnode.com",
  "https://1rpc.io/matic",
];

/** When you deploy this site to a real domain, set this to that root (e.g. https://example.com/) so “Share via device” sends a full https://… link. Leave empty to use whatever host the page is opened on. */
const PUBLIC_VERIFY_BASE = "";

function getVerifyRelativePath(id) {
  return `verify.html?id=${encodeURIComponent(id)}`;
}

function getVerifyAbsoluteUrl(id) {
  const rel = getVerifyRelativePath(id);
  const b = typeof PUBLIC_VERIFY_BASE === "string" && PUBLIC_VERIFY_BASE.trim();
  if (b) {
    try {
      return new URL(rel, b.endsWith("/") ? b : `${b}/`).href;
    } catch {
      /* fall through */
    }
  }
  return new URL(rel, window.location.href).href;
}

const ABI = [
  {
    name: "registerCreator", type: "function", stateMutability: "payable",
    inputs:  [{ name: "typePrefix", type: "bytes1" }],
    outputs: [{ name: "creatorId",  type: "string" }],
  },
  {
    name: "getCreatorByWallet", type: "function", stateMutability: "view",
    inputs:  [{ name: "wallet", type: "address" }],
    outputs: [{ name: "", type: "string" }],
  },
  {
    name: "getCreator", type: "function", stateMutability: "view",
    inputs: [{ name: "creatorId", type: "string" }],
    outputs: [{ name: "", type: "tuple", components: [
      { name: "creatorId",  type: "string"  },
      { name: "wallet",     type: "address" },
      { name: "typePrefix", type: "bytes1"  },
      { name: "timestamp",  type: "uint256" },
    ]}],

];

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── QR + share modal (Creator ID) ───────────────────────────────────────────

function safeFilePart(s) {
  return String(s).replace(/[^\w.-]+/g, "_").slice(0, 96);
}

function downloadQrFromEl(containerEl, filename) {
  if (!containerEl) return;
  const img = containerEl.querySelector("img");
  const canvas = containerEl.querySelector("canvas");
  let url;
  if (img && img.src) url = img.src;
  else if (canvas) url = canvas.toDataURL("image/png");
  else return;
  const a = Object.assign(document.createElement("a"), {
    href: url,
    download: filename || "odp-qr.png",
  });
  a.click();
}

function closeShareModal() {
  const m = document.getElementById("shareModal");
  if (!m) return;
  m.hidden = true;
  m.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

function openShareModal() {
  const m = document.getElementById("shareModal");
  if (!m) return;
  m.hidden = false;
  m.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function bindShareModalCloseHandlers() {
  const close = () => closeShareModal();
  document.getElementById("shareModalClose")?.addEventListener("click", close);
  document.getElementById("shareModalBackdrop")?.addEventListener("click", close);
}

async function shareOdpVerify({ title, text, url, fullText }) {
  const body = fullText || `${text}\n\n${url}`;
  try {
    if (navigator.share) {
      await navigator.share({ title, text: body, url });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  try {
    await navigator.clipboard.writeText(body);
    alert("Copied to clipboard.");
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      alert("Link copied to clipboard.");
    } catch {
      prompt("Copy:", body);
    }
  }
}

/** Same as passport.html — SPEC odp:// / odpc:// + ECC Q when short; never silent-fail. */
function renderOdpQr(el, primaryText, fallbackUrl) {
  if (!el) return;
  el.innerHTML = "";
  if (typeof QRCode === "undefined") {
    el.innerHTML = `<div class="qr-fail">QR library did not load (network / CDN blocked).<br><a href="${esc(fallbackUrl)}">${esc(fallbackUrl)}</a></div>`;
    return;
  }
  const w = 168;
  const h = 168;
  const cl =
    QRCode.CorrectLevel && QRCode.CorrectLevel.L !== undefined
      ? QRCode.CorrectLevel.L
      : QRCode.CorrectLevel && QRCode.CorrectLevel.M !== undefined
        ? QRCode.CorrectLevel.M
        : undefined;
  const make = (t, useCl, eccOverride) => {
    el.innerHTML = "";
    const o = {
      text: t,
      width: w,
      height: h,
      colorDark: "#000",
      colorLight: "#fff",
    };
    const ecc =
      eccOverride !== undefined
        ? eccOverride
        : useCl !== false && cl !== undefined
          ? cl
          : undefined;
    if (ecc !== undefined) o.correctLevel = ecc;
    new QRCode(el, o);
  };
  const specShort =
    typeof primaryText === "string" &&
    primaryText.length < 120 &&
    (primaryText.startsWith("odp://") || primaryText.startsWith("odpc://")) &&
    QRCode.CorrectLevel &&
    QRCode.CorrectLevel.Q !== undefined
      ? QRCode.CorrectLevel.Q
      : null;
  try {
    make(primaryText, true, specShort !== null ? specShort : undefined);
  } catch (e1) {
    try {
      make(primaryText, false, specShort !== null ? specShort : undefined);
    } catch {
      try {
        make(fallbackUrl, true, specShort !== null ? specShort : undefined);
      } catch {
        try {
          make(fallbackUrl, false, specShort !== null ? specShort : undefined);
        } catch (e2) {
          el.innerHTML = `<div class="qr-fail">Could not generate QR. <a href="${esc(fallbackUrl)}">Open verify link</a><br><span style="font-size:10px;color:var(--text3)">${esc(
            String((e2 && e2.message) || (e1 && e1.message) || "unknown")
          )}</span></div>`;
        }
      }
    }
  }
}

function fillCreatorShareModal() {
  if (!creatorId) return;
  const odpcUri = `odpc://${creatorId}`;
  const sharePayload = `Object Digital Passport - verify this Creator ID\nCreator ID: ${creatorId}\n${odpcUri}`;
  const vuAbs = getVerifyAbsoluteUrl(creatorId);
  const qrEl = document.getElementById("shareModalQr");
  const urlEl = document.getElementById("shareModalUrl");
  if (urlEl) urlEl.textContent = odpcUri;
  renderOdpQr(qrEl, odpcUri, odpcUri);
  openShareModal();
  const fn = `${safeFilePart(creatorId)}-creator-odp-qr.png`;
  const dl = document.getElementById("shareModalDl");
  const copyB = document.getElementById("shareModalCopy");
  const nat = document.getElementById("shareModalNative");
  if (dl) dl.onclick = () => downloadQrFromEl(qrEl, fn);
  if (copyB) {
    copyB.onclick = () => {
      navigator.clipboard
        .writeText(sharePayload)
        .then(() => alert("Copied to clipboard."))
        .catch(() => prompt("Copy:", sharePayload));
    };
  }
  if (nat) {
    nat.onclick = () => {
      void shareOdpVerify({
        title: "Object Digital Passport - Creator ID",
        text: `Verify this Creator ID: ${creatorId}`,
        url: vuAbs,
        fullText: sharePayload,
      });
    };
  }
}

function bindCreatorShare() {
  bindShareModalCloseHandlers();
  const shareBtn = document.getElementById("shareCreatorBtn");
  if (!shareBtn || !creatorId) return;
  shareBtn.addEventListener("click", () => fillCreatorShareModal());

async function disconnect() {
  const eth = injectedEthereum();
  let revoked = false;
  if (eth) {
    revoked = await revokeSiteWalletPermission(eth);
    // #region agent log
    fetch("http://127.0.0.1:7568/ingest/413879c6-a994-407f-b8b7-86c3aa65000a", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "99fdf4" },
      body: JSON.stringify({
        sessionId: "99fdf4",
        hypothesisId: "H2",
        location: "creator.html:disconnect",
        message: "wallet_revokePermissions",
        data: { revoked },
        timestamp: Date.now(),
        runId: "post-fix",
      }),
    }).catch(() => {});
    // #endregion
  }
  try { sessionStorage.setItem(ODP_SKIP_WALLET_AUTOCONNECT, "1"); } catch {}
  wallet = null; provider = null; signer = null; contract = null; creatorId = null;
  render();
}

// ── Wallet connection ─────────────────────────────────────────────────────────

function injectedEthereum() {
  const w = window.ethereum;
  if (!w) return null;
  if (w.providers && w.providers.length)
    return w.providers.find((p) => p.isMetaMask) || w.providers[0];
  return w;
}

/** MetaMask / modern EIP-1193: revoke site access so the next Connect shows a wallet prompt. */
async function revokeSiteWalletPermission(eth) {
  if (!eth) return false;
  try {
    await eth.request({ method: "wallet_revokePermissions", params: [{ eth_accounts: {} }] });
    return true;
  } catch {
    return false;
  }
}

/** Opens this page inside the MetaMask mobile app (in-app browser provides window.ethereum). */
function openInMetaMaskAppUrl() {
  try {
    const u = new URL(location.href);
    if (u.protocol !== "https:" && u.protocol !== "http:") return "";
    return "https://metamask.app.link/dapp/" + encodeURIComponent(u.toString());
  } catch {
    return "";
  }
}

/** Ask MetaMask to use Polygon (NET.chainId) before any contract calls. */
async function ensureWalletChain(eth, cfg) {
  const target = cfg.chainId;
  const hex = await eth.request({ method: "eth_chainId" });
  const cur = parseInt(hex, 16);
  if (cur === target) return;
  const chainIdHex = "0x" + target.toString(16);
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: chainIdHex }] });
  } catch (e) {
    if (e.code === 4902) {
      await eth.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: chainIdHex,
          chainName: cfg.name,
          nativeCurrency: { name: "POL", symbol: "POL", decimals: 18 },
          rpcUrls: [cfg.rpc],
          blockExplorerUrls: [cfg.explorer],
        }],
      });
    } else {
      throw e;
    }
  }
}

    No injected wallet (<code>window.ethereum</code>). On desktop, install
    <a href="https://metamask.io" target="_blank" rel="noopener" style="color:var(--accent)">MetaMask</a>
    or another extension, then reload this page.
    ${mobileHint}
    ${fileProto ? `<br><br><strong>Opening as <code>file://</code></strong> — many wallets do not inject on local files. Serve the <code>web/</code> folder over <code>http://localhost</code> (any static server) or upload to HTTPS.` : !mmApp ? `<br><br>Use <strong>https://</strong> or <strong>http://localhost</strong> if the wallet still does not appear.` : ""}
  </div>`;
}

async function connectWallet() {
  const eth = injectedEthereum();
  const errEl = document.getElementById("connectErr");
  if (!eth) {
    // #region agent log
    fetch("http://127.0.0.1:7568/ingest/413879c6-a994-407f-b8b7-86c3aa65000a", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "99fdf4" },
      body: JSON.stringify({
        sessionId: "99fdf4",
        location: "creator.html:connectWallet",
        message: "no window.ethereum",
        data: { hasMmApp: !!openInMetaMaskAppUrl(), proto: location.protocol },
        timestamp: Date.now(),
        runId: "mm-mobile",
        hypothesisId: "H1",
      }),
    }).catch(() => {});
    // #endregion
    errEl.innerHTML = noWalletHtml();
    return;
  }
  try {
    const preAcc = await eth.request({ method: "eth_accounts" }).catch(() => []);
    await eth.request({ method: "eth_requestAccounts" });
    const postAcc = await eth.request({ method: "eth_accounts" }).catch(() => []);
    await ensureWalletChain(eth, NET);
    await _finish(new ethers.providers.Web3Provider(eth));
  } catch(e) {
    errEl.innerHTML = `<div class="info error">${esc(e.message)}</div>`;
  }
}

async function _finish(web3p) {
  try { sessionStorage.removeItem(ODP_SKIP_WALLET_AUTOCONNECT); } catch {}
  const net = NET;
  if (!net.contract) {
    document.getElementById("connectErr").innerHTML =
      `<div class="info error">Contract address not set for ${net.name}. Edit NET in source.</div>`;
    return;
  }
  provider = web3p;
  signer   = provider.getSigner();
  wallet   = await signer.getAddress();
  contract = new ethers.Contract(net.contract, ABI, signer);

  // Check existing
  const existing = await contract.getCreatorByWallet(wallet);
  if (existing) {
    creatorId = existing;
    render();
    return;
  }

  // Show security step first
  document.getElementById("app").innerHTML = renderSecurity();
}

// ── Register ──────────────────────────────────────────────────────────────────

async function doRegister() {
  const btn = document.getElementById("regBtn");
  const err = document.getElementById("regErr");
  btn.disabled = true;
  btn.textContent = "Waiting for wallet…";
  err.innerHTML = "";

  try {
    // bytes1 encoding: "C" → 0x43, "B" → 0x42, "P" → 0x50
    const typeBytes = ethers.utils.hexlify(
      ethers.utils.toUtf8Bytes(selType)
    ); // e.g. "0x43" for "C"
    // Must match REGISTER_FEE in contract (0.001 ether); no public getter on-chain
    const regFee = ethers.utils.parseEther("0.001");
    const tx = await contract.registerCreator(typeBytes, { value: regFee });
    btn.textContent = "Confirming…";
    err.innerHTML = `<div class="info neutral" style="margin-bottom:10px">Transaction sent: ${tx.hash.slice(0,20)}…</div>`;
    await tx.wait();
    creatorId = await contract.getCreatorByWallet(wallet);
    render();
  } catch(e) {
    err.innerHTML = `<div class="info error" style="margin-bottom:10px">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = "Register — ~$0.01 POL";
  }
}

// ── Network pill (read-only RPC) ──────────────────────────────────────────────

async function initNetPill() {
  const dot = document.getElementById("netDot");
  const label = document.getElementById("netLabel");
  if (!dot || !label) return;
  label.textContent = NET.name + " — …";
  for (const rpcUrl of POLYGON_RPC_FALLBACKS) {
    try {
      const p = new ethers.providers.JsonRpcProvider(rpcUrl, { name: "polygon", chainId: NET.chainId });
      await p.getBlockNumber();
      dot.className = "net-dot on";
      label.textContent = NET.name;
      return;
    } catch { /* try next */ }
  }
  dot.className = "net-dot off";
  label.textContent = NET.name + " — offline";
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const m = document.getElementById("shareModal");
  if (m && !m.hidden) closeShareModal();
});

document.addEventListener("DOMContentLoaded", async () => {
  initNetPill();
  const skipAuto = (() => {
    try { return sessionStorage.getItem(ODP_SKIP_WALLET_AUTOCONNECT) === "1"; } catch { return false; }
  })();
  // Auto-reconnect browser extension if already approved (unless user disconnected this tab)
  const eth = injectedEthereum();
  if (eth) {
    const accounts = await eth.request({ method: "eth_accounts" }).catch(() => []);
    // #region agent log
    fetch("http://127.0.0.1:7568/ingest/413879c6-a994-407f-b8b7-86c3aa65000a", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "99fdf4" },
      body: JSON.stringify({
        sessionId: "99fdf4",
        hypothesisId: "H1",
        location: "creator.html:DOMContentLoaded",
        message: "wallet autoconnect check",
        data: { skipAuto, accLen: accounts.length },
        timestamp: Date.now(),
      }),
    }).catch(() => {});
    // #endregion
    if (!skipAuto && accounts.length > 0) {
      try {
        const net = NET;
        await ensureWalletChain(eth, net);
        provider  = new ethers.providers.Web3Provider(eth);
        signer    = provider.getSigner();
        wallet    = await signer.getAddress();
        if (net.contract) {
          contract  = new ethers.Contract(net.contract, ABI, signer);
          const existing = await contract.getCreatorByWallet(wallet);
          if (existing) creatorId = existing;
          secOk = true;
        }
      } catch {}
    }
  }
  render();
});
