<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODP — Register Creator ID</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js" crossorigin="anonymous"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Mono:wght@300;400;500&display=swap');

:root {
  --bg:      #0f0e0c;
  --bg2:     #171612;
  --bg3:     #1f1d18;
  --bg4:     #272420;
  --border:  #2e2b25;
  --border2: #3d3930;
  --text:    #e8e3d8;
  --text2:   #8a8478;
  --text3:   #524f48;
  --accent:  #d4a853;
  --accent2: #9a7a3a;
  --green:   #5a9e72;
  --green-bg:#0e1f14;
  --red:     #9e5a5a;
  --red-bg:  #1f0e0e;
  --serif:   'Fraunces', Georgia, serif;
  --mono:    'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.page {
  width: 100%;
  max-width: 560px;
  padding: 0 24px 80px;
}

/* Header */
header {
  padding: 52px 0 40px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}

h1 {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 300;
  font-style: italic;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 8px;
}

.sub {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* Nav */
.nav {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 48px;
}

.nav a {
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  text-decoration: none;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 3px;
  transition: all 0.15s;
}

.nav a:hover, .nav a.active {
  color: var(--accent);
  border-color: var(--accent2);
}

/* Steps */
.step-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-bottom: 40px;
}

.si-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.si-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  background: var(--bg2);
  transition: all 0.2s;
}

.si-item.active .si-num { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }
.si-item.active { color: var(--text2); }
.si-item.done .si-num { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.si-item.done { color: var(--text2); }

.si-line { width: 48px; height: 1px; background: var(--border); margin: 0 4px 18px; }

/* Cards */
.card {
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  background: var(--bg2);
  margin-bottom: 16px;
  animation: up 0.25s ease;
}

@keyframes up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-head {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  font-family: var(--serif);
  font-size: 17px;
  font-style: italic;
  font-weight: 300;
  color: var(--text);
}

.card-body { padding: 20px; }

/* Type selector */
.type-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.type-opt {
  padding: 16px 10px;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg3);
}

.type-opt:hover { border-color: var(--border2); }
.type-opt.sel   { border-color: var(--accent2); background: var(--bg4); }

.type-letter {
  font-family: var(--serif);
  font-size: 30px;
  font-style: italic;
  color: var(--accent);
  display: block;
  line-height: 1;
  margin-bottom: 8px;
}

.type-name { font-size: 12px; color: var(--text); margin-bottom: 3px; }
.type-desc { font-size: 10px; color: var(--text3); line-height: 1.4; }

/* Wallet connect */
.wallet-options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.wallet-opt {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg3);
  text-align: center;
}

.wallet-opt:hover { border-color: var(--border2); }
.wallet-opt-icon  { font-size: 22px; margin-bottom: 8px; }
.wallet-opt-name  { font-size: 12px; color: var(--text); margin-bottom: 3px; }
.wallet-opt-desc  { font-size: 10px; color: var(--text3); line-height: 1.4; }

/* Security checklist */
.checklist { list-style: none; }

.checklist li {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
}

.checklist li:last-child { border-bottom: none; }
.checklist-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
.checklist li strong { color: var(--text); display: block; margin-bottom: 2px; }

.confirm-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 3px;
  cursor: pointer;
  margin: 16px 0;
}

.confirm-row input[type="checkbox"] {
  width: 15px; height: 15px;
  accent-color: var(--accent);
  flex-shrink: 0; margin-top: 2px; cursor: pointer;
}

.confirm-row label {
  font-size: 12px; color: var(--text2);
  cursor: pointer; line-height: 1.5;
}

/* Info boxes */
.info  { padding: 13px 16px; border-radius: 3px; font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
.info.neutral { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }
.info.warn    { background: #1a1508; border: 1px solid var(--accent2); color: var(--accent); }
.info.success { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); }
.info.error   { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }

/* Button */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  background: var(--accent);
  color: var(--bg);
}

.btn:hover    { opacity: 0.85; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-sec {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border2);
  margin-top: 8px;
}

.btn-sec:hover { border-color: var(--text2); color: var(--text); }

/* Result */
.result-id {
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-align: center;
  margin: 20px 0 8px;
  display: block;
}

.result-full {
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  font-family: var(--mono);
  word-break: break-all;
  margin-bottom: 24px;
  line-height: 1.6;
}

.publish-list {
  list-style: none;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 20px;
}

.publish-list li {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  line-height: 1.5;
}

.publish-list li:last-child { border-bottom: none; }
.publish-list li span { flex-shrink: 0; font-size: 15px; }

/* Wallet status bar */
.wallet-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg2);
  margin-bottom: 24px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text2);
}

.w-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
}
.w-dot.on  { background: var(--green); box-shadow: 0 0 5px var(--green); }
.w-dot.off { background: var(--red); }

.w-addr { flex: 1; }
.w-switch { color: var(--text3); cursor: pointer; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.w-switch:hover { color: var(--accent); }

footer {
  border-top: 1px solid var(--border);
  margin-top: 48px;
  padding-top: 20px;
  display: flex; gap: 20px;
  font-size: 11px; font-family: var(--mono); color: var(--text3);
}
footer a { color: var(--text3); text-decoration: none; }
footer a:hover { color: var(--accent); }

@media (max-width: 480px) {
  .type-grid { grid-template-columns: 1fr; }
  .wallet-options-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="page">

<header>
  <h1>Creator ID</h1>
  <p class="sub">Object Digital Passport · Registration</p>
</header>

<div class="nav">
  <a href="creator.html" class="active">Creator ID</a>
  <a href="passport.html">Passport</a>
  <a href="verify.html">Verify</a>
</div>

<div id="app"></div>

<footer>
  <a href="https://github.com/object-digital-passport" target="_blank">GitHub</a>
  <span>ODP Spec v0.1</span>
  <span>MIT License</span>
</footer>

</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────

const CFG = {
  amoy: {
    name: "Polygon Amoy (testnet)",
    chainId: 80002,
    rpc: "https://rpc-amoy.polygon.technology",
    explorer: "https://amoy.polygonscan.com",
    contract: "",  // ← paste after deploy
  },
  polygon: {
    name: "Polygon PoS",
    chainId: 137,
    rpc: "https://polygon-rpc.com",
    explorer: "https://polygonscan.com",
    contract: "0x380092fA9C708BF01a552247909CF5DeceFb469E",
  },
};

const ABI = [
  {
    name: "registerCreator", type: "function", stateMutability: "payable",
    inputs:  [{ name: "typePrefix", type: "bytes1" }],
    outputs: [{ name: "creatorId",  type: "string" }],
  },
  {
    name: "REGISTER_FEE", type: "function", stateMutability: "view",
    inputs: [], outputs: [{ name: "", type: "uint256" }],
  },
  {
    name: "getCreatorByWallet", type: "function", stateMutability: "view",
    inputs:  [{ name: "wallet", type: "address" }],
    outputs: [{ name: "", type: "string" }],
  },
  {
    name: "getCreator", type: "function", stateMutability: "view",
    inputs: [{ name: "creatorId", type: "string" }],
    outputs: [{ name: "", type: "tuple", components: [
      { name: "creatorId",  type: "string"  },
      { name: "wallet",     type: "address" },
      { name: "typePrefix", type: "bytes1"  },
      { name: "timestamp",  type: "uint256" },
    ]}],
  },
];

// ── State ─────────────────────────────────────────────────────────────────────

let netKey     = "polygon";
let provider   = null;
let signer     = null;
let contract   = null;
let wallet     = null;
let creatorId  = null;
let selType    = "C";
let secOk      = false;

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  const app = document.getElementById("app");

  if (!wallet) {
    app.innerHTML = renderConnect();
    return;
  }

  if (creatorId) {
    app.innerHTML = renderAlready();
    return;
  }

  app.innerHTML = renderForm();
  updateTypeUI();
}

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Step 1: Connect wallet ────────────────────────────────────────────────────

function renderConnect() {
  return `
    <div class="step-indicator">
      <div class="si-item active"><div class="si-num">1</div><span>Wallet</span></div>
      <div class="si-line"></div>
      <div class="si-item"><div class="si-num">2</div><span>Security</span></div>
      <div class="si-line"></div>
      <div class="si-item"><div class="si-num">3</div><span>Register</span></div>
    </div>

    <div class="card">
      <div class="card-head">Connect your wallet</div>
      <div class="card-body">
        <p class="info neutral">
          Your wallet address becomes your identity in ODP.
          The Creator ID is permanently linked to your wallet.
          Make sure you have a backup of your key before proceeding.
        </p>

        <div class="wallet-options-grid" style="grid-template-columns:1fr;max-width:420px;margin:0 auto">
          <div class="wallet-opt" onclick="connectWallet()">
            <div class="wallet-opt-icon">🔗</div>
            <div class="wallet-opt-name">Connect wallet</div>
            <div class="wallet-opt-desc">Browser extension — MetaMask, Rabby, Brave Wallet, etc.</div>
          </div>
        </div>

        <div id="connectErr"></div>

        <div style="text-align:center;margin-top:8px">
          <select onchange="netKey=this.value" style="background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:3px;outline:none">
            <option value="amoy">Polygon Amoy (testnet)</option>
            <option value="polygon" selected>Polygon PoS (mainnet)</option>
          </select>
        </div>
      </div>
    </div>`;
}

// ── Step 2: Security ──────────────────────────────────────────────────────────

function renderSecurity() {
  return `
    <div class="step-indicator">
      <div class="si-item done"><div class="si-num">✓</div><span>Wallet</span></div>
      <div class="si-line"></div>
      <div class="si-item active"><div class="si-num">2</div><span>Security</span></div>
      <div class="si-line"></div>
      <div class="si-item"><div class="si-num">3</div><span>Register</span></div>
    </div>

    <div class="wallet-bar">
      <div class="w-dot on"></div>
      <div class="w-addr">${wallet.slice(0,8)}…${wallet.slice(-6)}</div>
      <div class="w-switch" onclick="disconnect()">Disconnect</div>
    </div>

    <div class="card">
      <div class="card-head">Before you register</div>
      <div class="card-body">
        <p style="font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.7">
          Your Creator ID is tied to this wallet permanently.
          If you lose access to the wallet, the ID cannot be transferred or recovered.
          Read the following carefully.
        </p>

        <ul class="checklist">
          <li>
            <span class="checklist-icon">📝</span>
            <div>
              <strong>Seed phrase wallets — back up before anything else</strong>
              Write the 12–24 words on paper. Verify word order when prompted.
              Store offline. Keep a second copy in a different location.
              Never store digitally — no photos, no cloud, no messaging apps.
            </div>
          </li>
          <li>
            <span class="checklist-icon">💳</span>
            <div>
              <strong>Seed-less hardware wallets — get a backup device now</strong>
              The key lives only in the hardware chip. There is no seed phrase.
              Losing all copies of the device means permanent loss of access.
              Always have at least one backup device before registering.
            </div>
          </li>
          <li>
            <span class="checklist-icon">🔒</span>
            <div>
              <strong>Never share your key or seed phrase with anyone</strong>
              No legitimate service or support team will ever ask for it.
              Ransomware and phishing specifically target seed phrases.
            </div>
          </li>
          <li>
            <span class="checklist-icon">ℹ️</span>
            <div>
              <strong>If you lose wallet access — your passports are safe</strong>
              All passports you minted remain valid and verifiable forever.
              You only lose the ability to mint new passports under that identity.
            </div>
          </li>
        </ul>

        <div class="confirm-row" onclick="toggleSec()">
          <input type="checkbox" id="secCheck">
          <label for="secCheck">
            I have backed up my key and understand the risks.
            My seed phrase is on paper / I have a backup hardware device.
          </label>
        </div>

        <button class="btn" id="secBtn" onclick="showRegister()" disabled>
          Continue to Registration
        </button>
      </div>
    </div>`;
}

// ── Step 3: Register ──────────────────────────────────────────────────────────

function renderForm() {
  return `
    <div class="step-indicator">
      <div class="si-item done"><div class="si-num">✓</div><span>Wallet</span></div>
      <div class="si-line"></div>
      <div class="si-item done"><div class="si-num">✓</div><span>Security</span></div>
      <div class="si-line"></div>
      <div class="si-item active"><div class="si-num">3</div><span>Register</span></div>
    </div>

    <div class="wallet-bar">
      <div class="w-dot on"></div>
      <div class="w-addr">${wallet.slice(0,8)}…${wallet.slice(-6)}</div>
      <div class="w-switch" onclick="disconnect()">Disconnect</div>
    </div>

    <div class="card">
      <div class="card-head">Choose your type</div>
      <div class="card-body">

        <div class="type-grid">
          <div class="type-opt sel" id="opt-C" onclick="selType='C';updateTypeUI()">
            <span class="type-letter">C</span>
            <div class="type-name">Creator</div>
            <div class="type-desc">Individual artist, photographer, maker, craftsperson</div>
          </div>
          <div class="type-opt" id="opt-B" onclick="selType='B';updateTypeUI()">
            <span class="type-letter">B</span>
            <div class="type-name">Brand</div>
            <div class="type-desc">Company, studio, label, collective</div>
          </div>
          <div class="type-opt" id="opt-P" onclick="selType='P';updateTypeUI()">
            <span class="type-letter">P</span>
            <div class="type-name">Institution</div>
            <div class="type-desc">Museum, gallery, auction house, certification body</div>
          </div>
        </div>

        <div id="typeInfo" class="info neutral" style="margin-bottom:16px"></div>

        <div class="info warn" style="margin-bottom:16px">
          ⚠ Your type prefix cannot be changed after registration.
          One Creator ID per wallet. Permanent.
        </div>

        <div id="regErr"></div>

        <button class="btn" id="regBtn" onclick="doRegister()">
          Register — ~$0.01 POL
        </button>
      </div>
    </div>`;
}

// ── Already registered ────────────────────────────────────────────────────────

function renderAlready() {
  const net = CFG[netKey];
  return `
    <div class="wallet-bar">
      <div class="w-dot on"></div>
      <div class="w-addr">${wallet.slice(0,8)}…${wallet.slice(-6)}</div>
      <div class="w-switch" onclick="disconnect()">Disconnect</div>
    </div>

    <div class="card">
      <div class="card-head">Your Creator ID</div>
      <div class="card-body">
        <div class="info success" style="margin-bottom:20px">
          ✓ Registered and active on ${esc(net.name)}
        </div>

        <span class="result-id">${esc(creatorId)}</span>
        <div class="result-full">
          ${esc(creatorId)} / ${wallet}
        </div>

        <div style="font-size:10px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px">
          Publish this everywhere
        </div>

        <ul class="publish-list">
          <li><span>🌐</span>On your official website — prominently, not hidden in menus</li>
          <li><span>📱</span>In all your social media profiles and bios</li>
          <li><span>🏷</span>On physical objects, packaging, and certificates you issue</li>
          <li><span>📋</span>In press releases and official communications</li>
        </ul>

        <div class="info neutral" style="margin-bottom:16px;font-size:11px">
          Short:&nbsp; <strong style="color:var(--text)">${esc(creatorId)}</strong><br>
          Full:&nbsp;&nbsp; <strong style="color:var(--text)">${esc(creatorId)} / [your name] / ${wallet}</strong>
        </div>

        <a href="passport.html">
          <button class="btn">Create a Passport →</button>
        </a>
        <a href="${net.explorer}/address/${wallet}" target="_blank">
          <button class="btn btn-sec">View on Explorer ↗</button>
        </a>
      </div>
    </div>`;
}

// ── UI helpers ────────────────────────────────────────────────────────────────

const TYPE_INFO = {
  C: "Individual creator — artist, photographer, maker, or craftsperson. Use this if you are registering as a person.",
  B: "Brand or collective — company, studio, label, or group. Use this for organizations.",
  P: "Proof Institution — museum, gallery, auction house, or expert body. P-type accounts can attach attestations to any passport.",
};

function updateTypeUI() {
  ["C","B","P"].forEach(t => {
    const el = document.getElementById(`opt-${t}`);
    if (el) el.classList.toggle("sel", t === selType);
  });
  const info = document.getElementById("typeInfo");
  if (info) info.textContent = TYPE_INFO[selType] || "";
}

function toggleSec() {
  const cb  = document.getElementById("secCheck");
  const btn = document.getElementById("secBtn");
  if (!cb || !btn) return;
  cb.checked = !cb.checked;
  btn.disabled = !cb.checked;
}

function showRegister() {
  secOk = true;
  render();
}

function disconnect() {
  wallet = null; provider = null; signer = null; contract = null; creatorId = null;
  render();
}

// ── Wallet connection ─────────────────────────────────────────────────────────

function injectedEthereum() {
  const w = window.ethereum;
  if (!w) return null;
  if (w.providers && w.providers.length)
    return w.providers.find((p) => p.isMetaMask) || w.providers[0];
  return w;
}

function noWalletHtml() {
  const fileProto = location.protocol === "file:";
  return `<div class="info error" style="line-height:1.6">
    No injected wallet (<code>window.ethereum</code>). Install
    <a href="https://metamask.io" target="_blank" rel="noopener" style="color:var(--accent)">MetaMask</a>
    or another browser extension, then reload this page.
    ${fileProto ? `<br><br><strong>Opening as <code>file://</code></strong> — many wallets do not inject on local files. Serve the <code>web/</code> folder over <code>http://localhost</code> (any static server) or upload to HTTPS.` : `<br><br>Use <strong>https://</strong> or <strong>http://localhost</strong> if the wallet still does not appear.`}
  </div>`;
}

async function connectWallet() {
  const eth = injectedEthereum();
  const errEl = document.getElementById("connectErr");
  if (!eth) {
    errEl.innerHTML = noWalletHtml();
    return;
  }
  try {
    await eth.request({ method: "eth_requestAccounts" });
    await _finish(new ethers.providers.Web3Provider(eth));
  } catch(e) {
    errEl.innerHTML = `<div class="info error">${esc(e.message)}</div>`;
  }
}

async function _finish(web3p) {
  const net = CFG[netKey];
  if (!net.contract) {
    document.getElementById("connectErr").innerHTML =
      `<div class="info error">Contract address not set for ${net.name}. Edit CFG in source.</div>`;
    return;
  }
  provider = web3p;
  signer   = provider.getSigner();
  wallet   = await signer.getAddress();
  contract = new ethers.Contract(net.contract, ABI, signer);

  // Check existing
  const existing = await contract.getCreatorByWallet(wallet);
  if (existing) {
    creatorId = existing;
    render();
    return;
  }

  // Show security step first
  document.getElementById("app").innerHTML = renderSecurity();
}

// ── Register ──────────────────────────────────────────────────────────────────

async function doRegister() {
  const btn = document.getElementById("regBtn");
  const err = document.getElementById("regErr");
  btn.disabled = true;
  btn.textContent = "Waiting for wallet…";
  err.innerHTML = "";

  try {
    // bytes1 encoding: "C" → 0x43, "B" → 0x42, "P" → 0x50
    const typeBytes = ethers.utils.hexlify(
      ethers.utils.toUtf8Bytes(selType)
    ); // e.g. "0x43" for "C"
    const regFee = await contract.REGISTER_FEE();
    const tx = await contract.registerCreator(typeBytes, { value: regFee });
    btn.textContent = "Confirming…";
    err.innerHTML = `<div class="info neutral" style="margin-bottom:10px">Transaction sent: ${tx.hash.slice(0,20)}…</div>`;
    await tx.wait();
    creatorId = await contract.getCreatorByWallet(wallet);
    render();
  } catch(e) {
    err.innerHTML = `<div class="info error" style="margin-bottom:10px">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = "Register — ~$0.01 POL";
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────

document.addEventListener("DOMContentLoaded", async () => {
  // Auto-reconnect browser extension if already approved
  const eth = injectedEthereum();
  if (eth) {
    const accounts = await eth.request({ method: "eth_accounts" }).catch(() => []);
    if (accounts.length > 0) {
      try {
        provider  = new ethers.providers.Web3Provider(eth);
        signer    = provider.getSigner();
        wallet    = await signer.getAddress();
        const net = CFG[netKey];
        if (net.contract) {
          contract  = new ethers.Contract(net.contract, ABI, signer);
          const existing = await contract.getCreatorByWallet(wallet);
          if (existing) creatorId = existing;
          secOk = true;
        }
      } catch {}
    }
  }
  render();
});
</script>
