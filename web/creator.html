// ── Config ────────────────────────────────────────────────────────────────────

function t(key) {
  return typeof window.odpT === "function" ? window.odpT(key) : key;
}

/** ethers v5 UMD is attached to globalThis; bare `ethers` can throw ReferenceError in some contexts. */
function odpEthersLib() {
  const g = typeof globalThis !== "undefined" ? globalThis : typeof window !== "undefined" ? window : {};
  return g.ethers || null;
}
(function odpBondEthersGlobal() {
  const e = odpEthersLib();
  if (!e) return;
  try {
    if (typeof globalThis !== "undefined" && !globalThis.ethers) globalThis.ethers = e;
    if (typeof window !== "undefined" && !window.ethers) window.ethers = e;
  } catch (err) {}
})();

/** Polygon PoS mainnet only */
const POLYGON_RPC_FALLBACKS = [
  "https://polygon-bor.publicnode.com",
  "https://1rpc.io/matic",
];

const NET = {
  name: "Polygon PoS",
  chainId: 137,
  rpc: POLYGON_RPC_FALLBACKS[0],
  rpcUrls: POLYGON_RPC_FALLBACKS.concat(["https://polygon.drpc.org"]),
  explorer: "https://polygonscan.com",
  contract: "0x35c29A1faC6e39925BeF616bb5222F024E5D6132",
  contractGenerationFallback: null,
  counterfeitConcern: "0x7C2EAaC6b0E4c14765d4064885A175fD057f680e",
};

/** When you deploy this site to a real domain, set this to that root (e.g. https://example.com/) so “Share via device” sends a full https://… link. Leave empty to use whatever host the page is opened on. */
const PUBLIC_VERIFY_BASE = "";

function getVerifyRelativePath(id) {
  return `verify.html?id=${encodeURIComponent(id)}`;
}

function getVerifyAbsoluteUrl(id) {
  const rel = getVerifyRelativePath(id);
  const b = typeof PUBLIC_VERIFY_BASE === "string" && PUBLIC_VERIFY_BASE.trim();
  if (b) {
    try {
      return new URL(rel, b.endsWith("/") ? b : `${b}/`).href;
    } catch {
      /* fall through */
    }
  }
  return new URL(rel, window.location.href).href;
}

/** EIP-55 checksum when possible; middle ellipsis for display (SPEC examples). */
function formatProfileWalletDisplay(addr) {
  let s = String(addr || "").trim();
  if (!s) return "";
  try {
    const E = odpEthersLib();
    if (E && E.utils && typeof E.utils.getAddress === "function") {
      s = E.utils.getAddress(s);
    }
  } catch {
    /* keep raw */
  }
  return s.length > 14 ? s.slice(0, 6) + "…" + s.slice(-4) : s;
}

let ABI = null;
let odpContractGeneration = null;

/** User chose Disconnect — skip eth_accounts auto-reconnect until explicit Connect (same tab). */

// ── Render ────────────────────────────────────────────────────────────────────

function syncOdpHeaderDisconnect() {
  const btn = document.getElementById("odpHeaderDisconnect");
  if (!btn) return;
  const on = !!wallet;
  btn.hidden = !on;
  btn.setAttribute("aria-hidden", on ? "false" : "true");
}

function render() {
  const app = document.getElementById("app");

  if (!wallet) {
    app.innerHTML = renderConnect();
    syncOdpHeaderDisconnect();
    return;
  }

  if (creatorId) {
    if (typeof odpPassportV03OpsInstall === "function") {
      odpPassportV03OpsInstall({
        getContract: () => contract,
        getWallet: () => wallet,
        getCreatorId: () => creatorId,
        getGeneration: () => odpContractGeneration,
        getCounterfeitReadContract: () =>
          typeof odpCounterfeitReadContract === "function"
            ? odpCounterfeitReadContract(contract, NET, odpContractGeneration, provider || signer)
            : null,
        getCounterfeitWriteContract: () =>
          typeof odpCounterfeitWriteContract === "function"
            ? odpCounterfeitWriteContract(contract, NET, odpContractGeneration, signer)
            : null,
        t,
        esc,
        isProfilePage: true,
        scrollToV03Card: () => {
          const el = document.getElementById("passportV03OpsCard");
          if (el) {
            try {
              el.scrollIntoView({ behavior: "smooth", block: "start" });
            } catch {}
          }
        },
      });
    }
    app.innerHTML = renderAlready();
    bindCreatorShare();
    if (typeof mountOdpIdCardQr === "function" && creatorId) {
      mountOdpIdCardQr(
        "odpIdCardQrProfile",
        "odp://" + creatorId,
        renderOdpQr,
        108
      );
    }
    if (typeof odpBindPassportV03Operations === "function") odpBindPassportV03Operations();
    if (
      (typeof odpPassportProfileTypeLetter === "function" ? odpPassportProfileTypeLetter(creatorId) : "") === "P" &&
      odpContractGeneration >= 2 &&
      contract &&
      typeof contract.getPAffiliatedChildren === "function"
    ) {
      bindPAffiliationHandlers();
    }
    queueMicrotask(() => {
      const q = new URLSearchParams(location.search);
      const hid = (q.get("v03hid") || "").trim();
      if (hid && /^ODP-/i.test(hid) && typeof odpPrefillPassportV03Ops === "function") {
        odpPrefillPassportV03Ops(hid);
        try {
          const u = new URL(location.href);
          u.searchParams.delete("v03hid");
          history.replaceState({}, "", u.pathname + u.search + u.hash);
        } catch {}
      }
    });
    syncOdpHeaderDisconnect();
    return;
  }

  app.innerHTML = renderForm();
  updateTypeUI();
  syncOdpHeaderDisconnect();
}

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── QR + share modal (profile) ───────────────────────────────────────────

function safeFilePart(s) {
  return String(s).replace(/[^\w.-]+/g, "_").slice(0, 96);
}

function downloadQrFromEl(containerEl, filename) {
  if (!containerEl) return;
  const img = containerEl.querySelector("img");
  const canvas = containerEl.querySelector("canvas");
  let url;
  if (img && img.src) url = img.src;
  else if (canvas) url = canvas.toDataURL("image/png");
  else return;
  const a = Object.assign(document.createElement("a"), {
    href: url,
    download: filename || "odp-qr.png",
  });
  a.click();
}

/** Solid card face (--bg2) in export clone; canvas bg null so only padding/margins outside the card are transparent in PNG. */
function odpExportCardThemeTokens() {
  try {
    const el = document.documentElement;
    const s = getComputedStyle(el);
    return {
      bg2: s.getPropertyValue("--bg2").trim() || "#ffffff",
      isBlue: el.getAttribute("data-theme") === "blue",
    };
  } catch (e) {
    return { bg2: "#ffffff", isBlue: true };
  }
}

function odpCanvasToPngBlob(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("PNG blob failed"))), "image/png");
  });
}

/** Renders profile ID card to PNG blob (used for download + native share file). */
async function buildProfileCardPngBlob() {
  if (!creatorId) throw new Error(t("creator.share.sharePngFail"));
  const h2cFn =
    typeof window !== "undefined" && typeof window.html2canvas === "function"
      ? window.html2canvas
      : typeof html2canvas === "function"
        ? html2canvas
        : null;
  if (!h2cFn) {
    throw new Error(t("creator.share.sharePngLibMissing"));
  }
  const filename = `${safeFilePart(creatorId)}-odp-profile.png`;
  let captureRoot = document.getElementById("odpProfileCardExport");
  let tempMount = null;

  if (!captureRoot && typeof odpProfileIdCardHtml === "function") {
    const typeLetter =
      typeof odpPassportProfileTypeLetter === "function" ? odpPassportProfileTypeLetter(creatorId) : "";
    const typeKey = typeLetter && /^[CBPM]$/i.test(typeLetter) ? typeLetter.toUpperCase() : "";
    const accountTypeLabel = typeKey ? t(`creator.type.${typeKey}`) : "—";
    tempMount = document.createElement("div");
    tempMount.setAttribute("data-odp-profile-png-temp", "1");
    tempMount.style.cssText =
      "position:fixed;left:-99999px;top:0;width:320px;z-index:2147483646;pointer-events:none;overflow:visible;";
    tempMount.innerHTML = odpProfileIdCardHtml({
      cardRootId: false,
      qrSlotId: "odpProfileExportTempQr",
      brandLabel: t("creator.idCard.brand"),
      stampText: t("creator.idCard.stamp"),
      heroTitle: t("creator.idCard.heroTitle"),
      heroId: creatorId,
      accountTypeLabel: accountTypeLabel,
      qrHint: t("creator.idCard.qrScanHint"),
      srLabel: t("creator.idCard.profileIdSr").replace("{id}", creatorId),
    });
    document.body.appendChild(tempMount);
    captureRoot = tempMount.querySelector(".odp-id-card-page-wrap");
    if (typeof mountOdpIdCardQr === "function") {
      mountOdpIdCardQr("odpProfileExportTempQr", `odp://${creatorId}`, renderOdpQr, 108);
    }
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (document.fonts && document.fonts.ready) await document.fonts.ready.catch(() => {});
  }

  if (!captureRoot) throw new Error(t("creator.share.sharePngFail"));

  const h2cTarget =
    captureRoot.classList && captureRoot.classList.contains("odp-id-card")
      ? captureRoot
      : captureRoot.querySelector(".odp-id-card") || captureRoot;

  const tok = odpExportCardThemeTokens();
  try {
    const canvas = await h2cFn(h2cTarget, {
      scale: 2,
      backgroundColor: null,
      useCORS: true,
      logging: false,
      onclone: (_doc, el) => {
        const shell =
          el.classList && el.classList.contains("odp-id-card")
            ? el.parentElement
            : el.querySelector(".odp-id-card__shell");
        if (shell && shell.classList && shell.classList.contains("odp-id-card__shell")) {
          shell.style.filter = "none";
        }
        const wrap =
          el.classList && el.classList.contains("odp-id-card-page-wrap")
            ? el
            : typeof el.closest === "function"
              ? el.closest(".odp-id-card-page-wrap")
              : null;
        if (wrap) wrap.style.background = "transparent";
        const card =
          el.classList && el.classList.contains("odp-id-card")
            ? el
            : el.querySelector(".odp-id-card");
        if (card) {
          card.style.backgroundImage = "none";
          card.style.backgroundColor = tok.bg2;
          card.style.boxShadow = "none";
        }
      },
    });
    // #region agent log
    fetch("http://127.0.0.1:7870/ingest/2f5a31df-775f-46ef-a661-30ac4fb319a1", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "c94472" },
      body: JSON.stringify({
        sessionId: "c94472",
        location: "creator.html:buildProfileCardPngBlob",
        message: "png export canvas",
        data: {
          isBlue: tok.isBlue,
          canvasBg: null,
          faceExport: "solid-bg2",
          h2cRoot: h2cTarget.className || h2cTarget.tagName,
          w: canvas.width,
          h: canvas.height,
        },
        hypothesisId: "H7",
        timestamp: Date.now(),
        runId: "h2c-card-root",
      }),
    }).catch(() => {});
    // #endregion
    const blob = await odpCanvasToPngBlob(canvas);
    return { blob, filename };
  } finally {
    if (tempMount && tempMount.parentNode) tempMount.parentNode.removeChild(tempMount);
  }
}

async function downloadProfileCardAsPng() {
  if (!creatorId) return;
  const { blob, filename } = await buildProfileCardPngBlob();
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    if (a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
}

/** Native share sheet with the same PNG as download (requires `canShare` + file support). */
async function shareProfileCardPngFromDevice() {
  if (!creatorId) return;
  const { blob, filename } = await buildProfileCardPngBlob();
  const file = new File([blob], filename, { type: "image/png" });
  const title = "Object Digital Passport — profile";
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
    throw e;
  }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    if (a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
  alert(t("creator.share.sharePngFallbackDl"));
}

async function shareOdpVerify({ title, text, url, fullText }) {
  const body = fullText || `${text}\n\n${url}`;
  try {
    if (navigator.share) {
      await navigator.share({ title, text: body, url });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  try {
    await navigator.clipboard.writeText(body);
    alert(t("creator.alerts.copied"));
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      alert(t("creator.alerts.linkCopied"));
    } catch {
      prompt("Copy:", body);
    }
  }
}

/** Same as passport.html — SPEC odp:// (passport or profile ID) + ECC Q when short; never silent-fail. */
function renderOdpQr(el, primaryText, fallbackUrl, pixelSize) {
  if (!el) return;
  el.innerHTML = "";
  if (typeof QRCode === "undefined") {
    el.innerHTML = `<div class="qr-fail">${esc(t("creator.qrFail"))}<br><a href="${esc(fallbackUrl)}">${esc(fallbackUrl)}</a></div>`;
    return;
  }
  const w = pixelSize != null && pixelSize > 0 ? Math.round(pixelSize) : 168;
  const h = w;
  const cl =
    QRCode.CorrectLevel && QRCode.CorrectLevel.L !== undefined
      ? QRCode.CorrectLevel.L
      : QRCode.CorrectLevel && QRCode.CorrectLevel.M !== undefined
        ? QRCode.CorrectLevel.M
        : undefined;
  const make = (t, useCl, eccOverride) => {
    el.innerHTML = "";
    const o = {
      text: t,
      width: w,
      height: h,
      colorDark: "#000",
      colorLight: "#fff",
    };
    const ecc =
      eccOverride !== undefined
        ? eccOverride
        : useCl !== false && cl !== undefined
          ? cl
          : undefined;
    if (ecc !== undefined) o.correctLevel = ecc;
    new QRCode(el, o);
  };
  const specShort =
    typeof primaryText === "string" &&
    primaryText.length < 120 &&
    primaryText.startsWith("odp://") &&
    QRCode.CorrectLevel &&
    QRCode.CorrectLevel.Q !== undefined
      ? QRCode.CorrectLevel.Q
      : null;
  try {
    make(primaryText, true, specShort !== null ? specShort : undefined);
  } catch (e1) {
    try {
      make(primaryText, false, specShort !== null ? specShort : undefined);
    } catch {
      try {
        make(fallbackUrl, true, specShort !== null ? specShort : undefined);
      } catch {
        try {
          make(fallbackUrl, false, specShort !== null ? specShort : undefined);
        } catch (e2) {
          el.innerHTML = `<div class="qr-fail">Could not generate QR. <a href="${esc(fallbackUrl)}">Open verify link</a><br><span style="font-size:10px;color:var(--text3)">${esc(
            String((e2 && e2.message) || (e1 && e1.message) || "unknown")
          )}</span></div>`;
        }
      }
    }
  }
}

function bindPAffiliationHandlers() {
  const activeParentVal = document.getElementById("pAffActiveParentVal");
  const parentInput = document.getElementById("pAffParentInput");
  const proposeBtn = document.getElementById("pAffProposeBtn");
  const proposeResult = document.getElementById("pAffProposeResult");
  const cancelBtn = document.getElementById("pAffCancelBtn");
  const cancelResult = document.getElementById("pAffCancelResult");
  const childInput = document.getElementById("pAffChildInput");
  const confirmBtn = document.getElementById("pAffConfirmBtn");
  const confirmResult = document.getElementById("pAffConfirmResult");
  const childrenList = document.getElementById("pAffChildrenList");
  const childrenMeta = document.getElementById("pAffChildrenMeta");
  const loadMoreBtn = document.getElementById("pAffLoadMoreBtn");
  if (!contract || !activeParentVal || !parentInput || !proposeBtn || !cancelBtn || !cancelResult || !childInput || !confirmBtn || !childrenList || !childrenMeta || !loadMoreBtn) return;

  proposeBtn.disabled = true;
  confirmBtn.disabled = false;
  proposeResult.innerHTML = "";
  cancelResult.innerHTML = "";
  confirmResult.innerHTML = "";

  const limit = 12;
  let loaded = [];
  let total = 0;
  let allChildrenCache = [];

  async function refresh() {
    try {
      proposeResult.innerHTML = "";
      cancelResult.innerHTML = "";
      confirmResult.innerHTML = "";
      activeParentVal.textContent = "…";
      childrenList.textContent = "…";
      childrenMeta.textContent = "";
      loaded = [];
      total = 0;
      allChildrenCache = [];
      loadMoreBtn.disabled = true;

      const parentPId = await contract.getPAffiliatedParent(creatorId);
      const hasParent = parentPId && String(parentPId).trim().length > 0;
      activeParentVal.textContent = hasParent ? parentPId : "—";
      proposeBtn.disabled = hasParent;

      const children = await contract.getPAffiliatedChildren(creatorId);
      allChildrenCache = Array.isArray(children) ? children.slice() : [];
      total = allChildrenCache.length;
      loaded = allChildrenCache.slice(0, limit);

      childrenList.textContent = loaded.length ? loaded.join(", ") : "—";
      childrenMeta.textContent = loaded.length ? `${loaded.length} / ${total}` : `0 / ${total}`;
      loadMoreBtn.disabled = total === 0 || loaded.length >= total;
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      activeParentVal.textContent = "Error";
      childrenList.textContent = m;
      childrenMeta.textContent = "";
      loadMoreBtn.disabled = true;
    }
  }

  refresh();

  parentInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    proposeBtn.click();
  });
  childInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    confirmBtn.click();
  });

  proposeBtn.addEventListener("click", async () => {
    if (!contract) return;
    const parentPId = parentInput.value ? String(parentInput.value).trim() : "";
    proposeResult.innerHTML = "";
    if (!parentPId) {
      proposeResult.innerHTML = `<div class="info warn">${esc(t("creator.pAff.parentRequired"))}</div>`;
      return;
    }
    proposeBtn.disabled = true;
    proposeResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.sending"))}</div>`;
    try {
      const tx = await contract.proposePAffiliation(parentPId);
      await tx.wait();
      proposeResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.proposed"))} <code class="mono">${esc(tx.hash)}</code></div>`;
      await refresh();
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      proposeResult.innerHTML = `<div class="info error">${esc(m)}</div>`;
      proposeBtn.disabled = false;
    }
  });

  cancelBtn.addEventListener("click", async () => {
    if (!contract) return;
    const parentPId = parentInput.value ? String(parentInput.value).trim() : "";
    cancelResult.innerHTML = "";
    if (!parentPId) {
      cancelResult.innerHTML = `<div class="info warn">${esc(t("creator.pAff.parentRequired"))}</div>`;
      return;
    }
    cancelBtn.disabled = true;
    cancelResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.cancelChecking"))}</div>`;
    try {
      const pending = await contract.isPAffiliationPending(parentPId, creatorId);
      if (!pending) {
        cancelResult.innerHTML = `<div class="info warn">${esc(t("creator.pAff.cancelNoPending"))}</div>`;
        cancelBtn.disabled = false;
        return;
      }
      cancelResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.sending"))}</div>`;
      const tx = await contract.cancelPAffiliationRequest(parentPId);
      await tx.wait();
      cancelResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.cancelDone"))} <code class="mono">${esc(tx.hash)}</code></div>`;
      await refresh();
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      cancelResult.innerHTML = `<div class="info error">${esc(m)}</div>`;
    }
    cancelBtn.disabled = false;
  });

  confirmBtn.addEventListener("click", async () => {
    if (!contract) return;
    const childPId = childInput.value ? String(childInput.value).trim() : "";
    confirmResult.innerHTML = "";
    if (!childPId) {
      confirmResult.innerHTML = `<div class="info warn">${esc(t("creator.pAff.childRequired"))}</div>`;
      return;
    }
    confirmBtn.disabled = true;
    confirmResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.checkingPending"))}</div>`;
    try {
      const pending = await contract.isPAffiliationPending(creatorId, childPId);
      if (!pending) {
        confirmResult.innerHTML = `<div class="info warn">${esc(t("creator.pAff.noPending"))}</div>`;
        confirmBtn.disabled = false;
        return;
      }
      const tx = await contract.confirmPAffiliation(childPId);
      await tx.wait();
      confirmResult.innerHTML = `<div class="info neutral">${esc(t("creator.pAff.confirmed"))} <code class="mono">${esc(tx.hash)}</code></div>`;
      await refresh();
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      confirmResult.innerHTML = `<div class="info error">${esc(m)}</div>`;
      confirmBtn.disabled = false;
    }
  });

  loadMoreBtn.addEventListener("click", async () => {
    if (!contract || total === 0) return;
    try {
      loadMoreBtn.disabled = true;
      const nextOffset = loaded.length;
      const more = allChildrenCache.slice(nextOffset, nextOffset + limit);
      loaded = loaded.concat(more);
      childrenList.textContent = loaded.length ? loaded.join(", ") : "—";
      childrenMeta.textContent = loaded.length ? `${loaded.length} / ${total}` : `0 / ${total}`;
      loadMoreBtn.disabled = loaded.length >= total;
    } catch (e) {
      const m = e && (e.reason || e.message) ? String(e.reason || e.message) : String(e);
      childrenMeta.textContent = "Load error";
      loadMoreBtn.disabled = false;
    }
  });
}

    M: t("creator.typeInfo.M"),
  };
}

function updateTypeUI() {
  const TI = getTypeInfo();
  ["C","B","P","M"].forEach(tn => {
    const el = document.getElementById(`opt-${tn}`);
    if (el) el.classList.toggle("sel", tn === selType);
  });
  const info = document.getElementById("typeInfo");
  if (info) info.textContent = TI[selType] || "";
}

function toggleSec() {
  const cb  = document.getElementById("secCheck");
  const btn = document.getElementById("secBtn");
  if (!cb || !btn) return;
  cb.checked = !cb.checked;
  btn.disabled = !cb.checked;
}

function showRegister() {
  secOk = true;
  render();
}

async function disconnect() {
  if (typeof odpWalletConnectIsActive === "function" && odpWalletConnectIsActive()) {
    if (typeof odpWalletConnectDisconnect === "function") await odpWalletConnectDisconnect();
  } else {
    const eth = injectedEthereum();
    if (eth) await revokeSiteWalletPermission(eth);
  }
  try { sessionStorage.setItem(ODP_SKIP_WALLET_AUTOCONNECT, "1"); } catch {}
  wallet = null; provider = null; signer = null; contract = null; creatorId = null;
  odpContractGeneration = null;
  ABI = null;
  render();
}

function registerButtonLabel() {
  return t("creator.register.btn");
}

// ── Wallet connection ─────────────────────────────────────────────────────────

function injectedEthereum() {
  const w = window.ethereum;
  if (!w) return null;
  if (w.providers && w.providers.length)
    return w.providers.find((p) => p.isMetaMask) || w.providers[0];
  return w;
}

/** MetaMask / modern EIP-1193: revoke site access so the next Connect shows a wallet prompt. */
async function revokeSiteWalletPermission(eth) {
  if (!eth) return false;
  try {
    await eth.request({ method: "wallet_revokePermissions", params: [{ eth_accounts: {} }] });
    return true;
  } catch {
    return false;
  }
}

/** MetaMask mobile: `metamask.app.link/dapp/{host…}` with `https://` stripped (same as metamask-deeplinks generator; do not encode the full URL). */
function openInMetaMaskAppUrl() {
  try {
    const u = new URL(location.href);
    if (u.protocol !== "https:" && u.protocol !== "http:") return "";
    const rest = u.href.replace(/^https?:\/\//i, "");
    const out = "https://metamask.app.link/dapp/" + rest;
    return out;
  } catch {
    return "";
  }
}

/** Ask MetaMask to use Polygon (NET.chainId) before any contract calls. */
async function ensureWalletChain(eth, cfg) {
  if (typeof odpEnsureWalletChain === "function") return odpEnsureWalletChain(eth, cfg);
}

function noWalletHtml() {
  const fileProto = location.protocol === "file:";
  const mmApp = openInMetaMaskAppUrl();
  const mobileHint =
    !fileProto && mmApp
      ? `<div style="margin:14px 0 10px">
          <a class="btn" href="${esc(mmApp)}" rel="noopener" style="display:inline-block;text-decoration:none">${esc(t("creator.noWallet.mmOpen"))}</a>
          <p class="fhint" style="margin:10px 0 0;font-size:11px">${esc(t("creator.noWallet.mmHint"))}</p>
        </div>`
      : "";
  const wcConfigured =
    typeof ODP_WALLETCONNECT_PROJECT_ID !== "undefined" && String(ODP_WALLETCONNECT_PROJECT_ID).trim().length > 0;
  const wcBlock = wcConfigured
    ? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
        <p style="font-size:12px;color:var(--text2);margin:0 0 10px">${esc(t("creator.noWallet.wcLead"))}</p>
        <button type="button" class="btn" onclick="connectWalletWithWalletConnect()">${esc(t("creator.connect.wcName"))}</button>
      </div>`
    : "";
  return `<div class="info error" style="line-height:1.6">
    ${esc(t("creator.noWallet.line1"))}
    <a href="https://metamask.io" target="_blank" rel="noopener" style="color:var(--accent)">${esc(t("creator.noWallet.metaMask"))}</a>
    ${esc(t("creator.noWallet.line2"))}
    ${mobileHint}
    ${fileProto ? `<br><br>${esc(t("creator.noWallet.fileProto"))}` : !mmApp ? `<br><br>${esc(t("creator.noWallet.httpsHint"))}` : ""}
    ${wcBlock}
  </div>`;
}

function odpSetConnectButtonsBusyCreator(busy) {
  const btnInj = document.getElementById("odpConnectWalletBtn");
  const btnWc = document.getElementById("odpConnectWalletWcBtn");
  [btnInj, btnWc].forEach((btn) => {
    if (!btn) return;
    if (busy) {
      btn.style.opacity = "0.65";
      btn.style.pointerEvents = "none";
    } else {
      btn.style.opacity = "";
      btn.style.pointerEvents = "";
    }
  });
}

async function connectWallet() {
  const eth = injectedEthereum();
  const errEl = document.getElementById("connectErr");
  if (odpConnectInFlight) {
    if (errEl)
      errEl.innerHTML =
        `<div class="info error">${esc(t("creator.errors.connectInProgress"))}</div>`;
    return;
  }
  if (!eth) {
    errEl.innerHTML = noWalletHtml();
    return;
  }
  odpConnectInFlight = true;
  odpSetConnectButtonsBusyCreator(true);
  try {
    // eth_requestAccounts must be the first wallet RPC in this handler so the browser
    // keeps user activation (MetaMask popup opens without forcing a manual extension click).
    await eth.request({ method: "eth_requestAccounts" });
    const single = await odpRequireSingleEthereumAccount(eth);
    if (!single.ok) {
      errEl.innerHTML = `<div class="info error">${esc(single.message)}</div>`;
      return;
    }
    await odpMergeRegistryConfigAsync(NET);
    await ensureWalletChain(eth, NET);
    await ensureWalletChain(eth, NET);
    const Elib = odpEthersLib();
    if (!Elib || !Elib.providers) {
      errEl.innerHTML =
        `<div class="info error">${esc("ethers v5 failed to load (CDN blocked?). Check network / ad blocker.")}</div>`;
      return;
    }
    await _finish(new Elib.providers.Web3Provider(eth));
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (/already pending|request of type.*pending/i.test(msg)) {
      errEl.innerHTML =
        `<div class="info error">${esc(t("creator.errors.walletPending"))}</div>`;
    } else {
      errEl.innerHTML = `<div class="info error">${esc(msg)}</div>`;
    }
  } finally {
    odpConnectInFlight = false;
    odpSetConnectButtonsBusyCreator(false);
  }
}

async function connectWalletWithWalletConnect() {
  const errEl = document.getElementById("connectErr");
  if (odpConnectInFlight) {
    if (errEl)
      errEl.innerHTML =
        `<div class="info error">${esc(t("creator.errors.connectInProgress"))}</div>`;
    return;
  }
  await odpMergeRegistryConfigAsync(NET);
  odpConnectInFlight = true;
  odpSetConnectButtonsBusyCreator(true);
  try {
    await odpEnsureWalletConnectBundle();
    const eth = await odpWalletConnectConnect({ chainId: NET.chainId, rpcUrl: NET.rpc });
    await ensureWalletChain(eth, NET);
    const single = await odpRequireSingleEthereumAccount(eth);
    if (!single.ok) {
      errEl.innerHTML = `<div class="info error">${esc(single.message)}</div>`;
      return;
    }
    await ensureWalletChain(eth, NET);
    if (typeof odpInstallSingleAccountGuard === "function") {
      odpInstallSingleAccountGuard(eth, {
        onMultiple: async function () {
          var r = await odpRequireSingleEthereumAccount(eth);
          walletConnectError = r.message || t("creator.multiAccount");
          await disconnect();
        },
        onEmpty: async function () {
          await disconnect();
        },
      });
    }
    const Ewc = odpEthersLib();
    if (!Ewc || !Ewc.providers) {
      errEl.innerHTML =
        `<div class="info error">${esc("ethers v5 failed to load (CDN blocked?). Check network / ad blocker.")}</div>`;
      return;
    }
    await _finish(new Ewc.providers.Web3Provider(eth));
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (/already pending|request of type.*pending/i.test(msg)) {
      errEl.innerHTML =
        `<div class="info error">${esc(t("creator.errors.walletPending"))}</div>`;
    } else {
      errEl.innerHTML = `<div class="info error">${esc(msg)}</div>`;
    }
  } finally {
    odpConnectInFlight = false;
    odpSetConnectButtonsBusyCreator(false);
  }
}

async function _finish(web3p) {
  await odpMergeRegistryConfigAsync(NET);
  try { sessionStorage.removeItem(ODP_SKIP_WALLET_AUTOCONNECT); } catch {}
  const eth =
    typeof odpWalletConnectIsActive === "function" &&
    odpWalletConnectIsActive() &&
    typeof odpWalletConnectGetEip1193 === "function"
      ? odpWalletConnectGetEip1193()
      : injectedEthereum();
  const single = await odpRequireSingleEthereumAccount(eth);
  if (!single.ok) {
    const ce = document.getElementById("connectErr");
    if (ce) ce.innerHTML = `<div class="info error">${esc(single.message)}</div>`;
    return;
  }
  const net = NET;
  const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || "");
  if (!odpHasValidRegistryAddress(net)) {
    const ce = document.getElementById("connectErr");
    if (ce) ce.innerHTML = odpRegistryMisconfiguredBannerHtml(isLocal);
    return;
  }
  provider = web3p;
  signer   = provider.getSigner();
  wallet   = await signer.getAddress();
  const fin = await odpFinalizeWalletContract(net, signer, POLYGON_RPC_FALLBACKS, "creator");
  if (fin.legacyUnsupported) {
    provider = null;
    signer = null;
    contract = null;
    wallet = null;
    odpContractGeneration = null;
    ABI = null;
    const msg = fin.message || (typeof ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG !== "undefined" ? ODP_UNSUPPORTED_LEGACY_CONTRACT_MSG : "Legacy contract not supported.");
    const ce = document.getElementById("connectErr");
    if (ce) ce.innerHTML = `<div class="info error">${esc(msg)}</div>`;
    return;
  }
  odpContractGeneration = fin.generation;
  ABI = fin.abi;
  contract = fin.contract;
  if (typeof odpPersistRegistryContractToSession === "function") odpPersistRegistryContractToSession(net);

  // Check existing
  const existing = await contract.getCreatorByWallet(wallet);
  if (existing) {
    creatorId = existing;
    render();
    return;
  }

  // Show security step first
  document.getElementById("app").innerHTML = renderSecurity();
  syncOdpHeaderDisconnect();
}

// ── Register ──────────────────────────────────────────────────────────────────

async function doRegister() {
  const btn = document.getElementById("regBtn");
  const err = document.getElementById("regErr");
  btn.disabled = true;
  btn.textContent = t("creator.register.waiting");
  err.innerHTML = "";

  try {
    const Er = odpEthersLib();
    if (!Er || !Er.utils) {
      err.innerHTML = `<div class="info error">${esc("ethers v5 failed to load.")}</div>`;
      btn.disabled = false;
      btn.textContent = registerButtonLabel();
      return;
    }
    // bytes1 encoding: "C" → 0x43, "B" → 0x42, "P" → 0x50
    const typeBytes = Er.utils.hexlify(Er.utils.toUtf8Bytes(selType)); // e.g. "0x43" for "C"
    const tx = await contract.registerCreator(typeBytes);
    btn.textContent = t("creator.register.confirming");
    err.innerHTML = `<div class="info neutral" style="margin-bottom:10px">${esc(t("creator.register.txPrefix"))} ${tx.hash.slice(0,20)}…</div>`;
    await tx.wait();
    creatorId = await contract.getCreatorByWallet(wallet);
    render();
  } catch(e) {
    err.innerHTML = `<div class="info error" style="margin-bottom:10px">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = registerButtonLabel();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const m = document.getElementById("shareModal");
  if (m && !m.hidden) closeShareModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────

document.addEventListener("DOMContentLoaded", async () => {
  try {
  await odpInitI18n({
    page: "creator",
    pageTitleKey: "creator.meta.documentTitle",
    mergePages: ["passport"],
  });
  if (typeof odpMaybeAutoShowSiteTrustModal === "function") odpMaybeAutoShowSiteTrustModal();
  await odpMergeRegistryConfigAsync(NET);
  const fv = document.getElementById("footerSiteVer");
  if (fv && typeof ODP_SITE_VERSION !== "undefined") fv.textContent = "site " + ODP_SITE_VERSION;
  const skipAuto = (() => {
    try { return sessionStorage.getItem(ODP_SKIP_WALLET_AUTOCONNECT) === "1"; } catch { return false; }
  })();
  const eth = injectedEthereum();
  let accounts = [];
  if (eth) {
    odpInstallSingleAccountGuard(eth, {
      onMultiple: async function () {
        var r = await odpRequireSingleEthereumAccount(eth);
        walletConnectError = r.message || t("creator.multiAccount");
        await disconnect();
      },
      onEmpty: async function () {
        await disconnect();
      },
    });
    accounts = await eth.request({ method: "eth_accounts" }).catch(() => []);
  }
  if (!skipAuto && accounts.length > 0) {
    if (accounts.length > 1) {
      var br = await odpRequireSingleEthereumAccount(eth);
      walletConnectError = br.message;
    } else {
      odpConnectInFlight = true;
      try {
        const net = NET;
        const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || "");
        await odpMergeRegistryConfigAsync(NET);
        if (!odpHasValidRegistryAddress(NET)) {
          provider = null;
          signer = null;
          contract = null;
          wallet = null;
          odpContractGeneration = null;
          ABI = null;
          walletConnectError = odpRegistryMisconfiguredBannerHtml(isLocal);
          walletConnectErrorNeutral = true;
        } else {
          await ensureWalletChain(eth, net);
          const Eauto = odpEthersLib();
          if (!Eauto || !Eauto.providers) throw new Error("ethers v5 failed to load");
          provider = new Eauto.providers.Web3Provider(eth);
          signer = provider.getSigner();
          wallet = await signer.getAddress();
          const fin = await odpFinalizeWalletContract(net, signer, POLYGON_RPC_FALLBACKS, "creator");
          if (fin.legacyUnsupported) {
            provider = null;
            signer = null;
            contract = null;
            wallet = null;
            odpContractGeneration = null;
            ABI = null;
          } else {
            odpContractGeneration = fin.generation;
            ABI = fin.abi;
            contract = fin.contract;
            const existing = await contract.getCreatorByWallet(wallet);
            if (existing) creatorId = existing;
            secOk = true;
          }
        }
      } catch {}
      finally {
        odpConnectInFlight = false;
      }
    }
  } else if (!skipAuto && accounts.length === 0) {
    try {
      await odpEnsureWalletConnectBundle();
      if (typeof odpWalletConnectTryRestoreSession === "function") {
        const wcEth = await odpWalletConnectTryRestoreSession({ chainId: NET.chainId, rpcUrl: NET.rpc });
        if (wcEth) {
          odpConnectInFlight = true;
          try {
            await ensureWalletChain(wcEth, NET);
            const single = await odpRequireSingleEthereumAccount(wcEth);
            if (!single.ok) {
              walletConnectError = single.message;
            } else {
              await ensureWalletChain(wcEth, NET);
              if (typeof odpInstallSingleAccountGuard === "function") {
                odpInstallSingleAccountGuard(wcEth, {
                  onMultiple: async function () {
                    var r = await odpRequireSingleEthereumAccount(wcEth);
                    walletConnectError = r.message || t("creator.multiAccount");
                    await disconnect();
                  },
                  onEmpty: async function () {
                    await disconnect();
                  },
                });
              }
              const Ewc2 = odpEthersLib();
              if (Ewc2 && Ewc2.providers) await _finish(new Ewc2.providers.Web3Provider(wcEth));
              return;
            }
          } catch (e) {
            console.warn("WalletConnect session restore failed:", e);
          } finally {
            odpConnectInFlight = false;
          }
        }
      }
    } catch (e) {
      console.warn("WalletConnect bundle / restore:", e);
    }
  }
  render();
  } catch (err) {
    console.error("[ODP] creator init failed:", err);
    try {
      if (typeof odpRevealI18nUi === "function") odpRevealI18nUi();
    } catch (_) {}
    try {
      document.documentElement.classList.remove("odp-i18n-pending");
      document.documentElement.classList.add("odp-i18n-ready");
    } catch (_) {}
    const appEl = document.getElementById("app");
    if (appEl) {
      const msg = err && err.message ? String(err.message) : String(err);
      appEl.innerHTML =
        '<div class="info error" style="max-width:520px;margin:24px auto;line-height:1.55">Page failed to finish loading. Try reload, another browser, or private mode.<br><br><code style="font-size:11px;word-break:break-all">' +
        esc(msg) +
        "</code></div>";
    }
  }
});
</script>
