name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Hardhat tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chain/package-lock.json
      - run: npm ci
      - run: npm test

  schema:
    name: passport.json schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate 0.7 examples against the 0.7 schema
        run: >
          npx --yes ajv-cli@5 validate --spec=draft2020
          -s schema/passport-0.7.schema.json
          -d "schema/examples/0.7/*.json"

  release-notes:
    name: release note style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check docs/releases against the template
        run: node chain/tools/lint_release_notes.mjs

  slither:
    # crytic-compile cannot parse Hardhat 3 build-info (split output files),
    # so we compile straight through solc per entry contract instead.
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install slither + solc 0.8.20
        run: |
          pip install slither-analyzer solc-select
          solc-select install 0.8.20
          solc-select use 0.8.20
      - name: Run slither (fail on high)
        working-directory: chain/contracts
        run: |
          status=0
          for f in ObjectDigitalPassport.sol ODPPassportProofRegistry.sol \
                   ODPRegistryRelations.sol ODPCounterfeitConcern.sol \
                   ODPWalletDocumentAnchor.sol ODPExtensionMintRouter.sol; do
            echo "::group::$f"
            slither "$f" --fail-high --solc-args "--via-ir --optimize" || status=1
            echo "::endgroup::"
          done
          exit $status

  profile-links:
    name: organization profile links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The organization page is the project's front door and renders from a copy of this file
      # in the .github repository, where nothing reports a rotted link.
      - name: Check .github/profile/README.md against the tree
        run: node tools/check-profile-links.mjs

  translations:
    name: translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The freshness check reads `git log` per file, so it needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Full parity doubles the surface where a translation can quietly fall behind.
      # docs/TRANSLATIONS.md records what is translated; this enforces that record.
      - name: Check docs/ru against docs/TRANSLATIONS.md
        run: node tools/check-translations.mjs --all

  spec-site:
    name: spec site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      # pages.yml runs this builder only on push to main, so a broken build was
      # only visible as a failed deploy. Run it on every pull request instead.
      - name: Render /spec/ from markdown
        run: node tools/build-spec.mjs _site/spec
      - name: Every page and schema landed
        run: |
          for f in index.html objectid-profile.html security.html \
                   schema/passport-0.7.schema.json; do
            test -s "_site/spec/$f" || { echo "missing or empty: $f"; exit 1; }
          done
