name: CodeQL

# Advanced setup, so that .github/codeql-config.yml is honoured. Switching this on requires
# Default setup to be turned off under Settings → Code security → Code scanning; GitHub will
# not run both.

on:
  push:
    branches: [main, v0.7]
  pull_request:
    branches: [main, v0.7]
  schedule:
    # Weekly, so a newly published advisory surfaces without waiting for the next push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Solidity is not a CodeQL language — the contracts are covered by Slither in ci.yml.
        # Python is here because chain/tools/mint.py is the tool that spends real money.
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
