# Deploys the static UI from /web to GitHub Pages.
# Requires: Repo Settings → Pages → Build and deployment → Source: GitHub Actions (not “Deploy from a branch”).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      # Flatten web/ to artifact root so /verify.html works.
      # Also mirror under /web/ so /web/verify.html works (same relative assets; avoids 404 for repo-style URLs).
      - name: Stage site
        env:
          # Repository secret (preferred) or repo/org Variable — public address is fine in Variables.
          ODP_CONTRACT_ADDRESS: ${{ secrets.ODP_CONTRACT_ADDRESS || vars.ODP_CONTRACT_ADDRESS }}
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/web
          cp -r web/. _site/web/
          # UI i18n + translated docs live under web/localization/ in the repo.
          if [ -d web/localization ]; then
            rm -rf _site/localization
            cp -r web/localization _site/localization
          fi
          if [ -n "$ODP_CONTRACT_ADDRESS" ]; then
            echo "Injecting ODP_CONTRACT_ADDRESS into NET.contract (6 HTML files) + registry-config.json"
            for f in _site/creator.html _site/passport.html _site/verify.html _site/web/creator.html _site/web/passport.html _site/web/verify.html; do
              test -f "$f" || continue
              sed -i "s|contract: \"[^\"]*\",|contract: \"${ODP_CONTRACT_ADDRESS}\",|" "$f"
            done
            printf '{"contract":"%s"}\n' "$ODP_CONTRACT_ADDRESS" > _site/registry-config.json
            cp _site/registry-config.json _site/web/registry-config.json
          else
            echo "ODP_CONTRACT_ADDRESS empty — set Actions secret or repo Variable ODP_CONTRACT_ADDRESS, then redeploy"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
