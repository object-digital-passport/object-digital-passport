# Deploys the specification to GitHub Pages:
#   /       — landing: what ODP is, with links to the spec and the demo
#   /spec/  — SPEC.md + profile docs rendered to HTML (tools/build-spec.mjs)
#   /demo/  — redirect stubs; the reference web UI is its own repository now
# Legacy root/*.html, /demo/*.html and /web/*.html URLs redirect to the site, query string intact.
# Requires: Repo Settings → Pages → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build /spec/ from markdown
        run: |
          npm install --prefix tools --no-audit --no-fund
          node tools/build-spec.mjs _site/spec
      - name: Landing and redirects to the site
        # The reference website is its own repository now. What stays here is the
        # specification, plus stubs so every address the monorepo used keeps resolving —
        # query string intact, which is what carries ?id=ODP-… on a scanned link.
        run: |
          SITE="https://object-digital-passport.github.io"
          redirect () { # $1 = file to write, $2 = absolute destination
            mkdir -p "$(dirname "$1")"
            printf '%s\n' \
              '<!doctype html><meta charset="utf-8">' \
              '<title>Moved</title>' \
              "<script>location.replace(\"$2\" + location.search + location.hash);</script>" \
              "<p>Moved to <a href=\"$2\">$2</a>.</p>" > "$1"
          }
          for p in index verify creator passport; do
            redirect "_site/$p.html"      "$SITE/$p.html"
            redirect "_site/demo/$p.html" "$SITE/$p.html"
            redirect "_site/web/$p.html"  "$SITE/$p.html"
          done
          # The root now introduces the specification and points at the demo.
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8">' \
            '<title>Object Digital Passport</title>' \
            '<meta name="viewport" content="width=device-width,initial-scale=1">' \
            '<style>body{font:16px/1.6 system-ui,sans-serif;max-width:34rem;margin:12vh auto;padding:0 1.2rem}a{color:inherit}</style>' \
            '<h1>Object Digital Passport</h1>' \
            '<p>An open standard for giving a real object a passport anyone can verify.</p>' \
            '<p><a href="spec/">Read the specification →</a></p>' \
            "<p><a href=\"$SITE/verify.html\">Verify something — free, no wallet →</a></p>" \
            '<p><a href="https://github.com/object-digital-passport/object-digital-passport">Source, contracts and schema on GitHub</a></p>' > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
